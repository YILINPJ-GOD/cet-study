        <textarea id="essay" rows="11" placeholder="在这里写作文…（写完后点下方按钮，本地批改引擎会从词数、结构、衔接、句式、用词、拼写六个维度评分并给出修改建议）">${curFeedback ? '' : ''}</textarea>
        <div style="display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap">
          <span class="note">词数：<b id="wc" class="mono">0</b> / 150–200</span>
          <span class="note">句子：<b id="sc" class="mono">0</b></span>
          <button class="btn big" id="gradeBtn" style="margin-left:auto">🤖 提交批改</button>
        </div>
        <div id="fbBox" style="margin-top:16px"></div>
      </div>
      <div class="card">
        <h3>我的批改历史 <span class="sub">${essays.length} 篇</span></h3>
        ${essays.length >= 2 ? `<h3 style="font-size:13.5px;margin-top:4px">📈 写作能力成长曲线 <span class="sub">每次批改的综合分</span></h3>
        ${App.charts.line({ series: [{ name: '批改得分', color: '#4f46e5', data: App.store.essays.map((e2, i) => ({ x: (e2.date || '') + ' #' + (App.store.essays.length - i), y: e2.score })) }], max: 100, min: 0, yUnit: '' })}` : ''}
        ${essays.length ? essays.slice(0, 8).map(e2 => `<div class="list-row"><span class="badge ${e2.score >= 80 ? 'ok' : e2.score >= 70 ? 'warn' : 'bad'}">${e2.score}分</span><div style="flex:1;min-width:0"><div style="font-size:13.5px" class="essay-pane">${App.esc(e2.text.slice(0, 80))}…</div><div class="note">${e2.date} · ${e2.cat || ''}</div></div><button class="btn plain sm" data-view="${e2.date}">查看</button></div>`).join('') : '<div class="empty">还没有批改记录</div>'}
      </div>`;
    // 事件
    el.querySelectorAll('[data-t]').forEach(c => c.onclick = () => { curTopic = topics.find(t => t.id === c.dataset.t); curFeedback = null; V.render(el); });
    el.querySelector('#showHint').onclick = () => { const h = el.querySelector('#hintBox'); h.style.display = h.style.display === 'none' ? 'block' : 'none'; };
    const ta = el.querySelector('#essay'), wc = el.querySelector('#wc'), sc = el.querySelector('#sc');
    const paint = () => {
      const words = App.grader.tokenize(ta.value).length;
      wc.textContent = words;
      wc.style.color = words >= 150 && words <= 200 ? 'var(--ok)' : words > 0 ? 'var(--warn)' : '';
      sc.textContent = ta.value.split(/[.!?]+/).filter(s => App.grader.tokenize(s).length > 2).length;
    };
    ta.oninput = paint;
    el.querySelector('#gradeBtn').onclick = () => {
      const text = ta.value.trim();
      if (App.grader.tokenize(text).length < 20) { App.toast('作文太短啦，先写几句再批改'); return; }
      const fb = App.grader.gradeWriting(text);
      curFeedback = fb;
      App.store.essays.push({ date: App.today(), topicId: curTopic ? curTopic.id : '', cat: curTopic ? curTopic.cat : '', text, score: fb.score, items: fb.items.length });
      if (App.store.essays.length > 60) App.store.essays = App.store.essays.slice(-50);
      App.save();
      renderFeedback(el.querySelector('#fbBox'), fb);
      el.querySelector('#fbBox').scrollIntoView({ behavior: 'smooth' });
    };
    el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
      const rec = App.store.essays.find(e2 => e2.date === b.dataset.view);
      if (!rec) return;
      ta.value = rec.text; paint();
      const fb = App.grader.gradeWriting(rec.text);
      renderFeedback(el.querySelector('#fbBox'), fb, true);
      el.querySelector('#fbBox').scrollIntoView({ behavior: 'smooth' });
    });
    if (curFeedback) renderFeedback(el.querySelector('#fbBox'), curFeedback);
    paint();
  }

  function renderFeedback(box, fb, cached) {
    const icons = { good: ['✅', '亮点'], warn: ['⚠️', '建议'], bad: ['❌', '问题'], info: ['💡', '提示'] };
    box.innerHTML = `
      <div class="score-dial">
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="46" fill="none" stroke="#edeff7" stroke-width="11"/>
          <circle cx="55" cy="55" r="46" fill="none" stroke="${fb.score >= 80 ? '#16a34a' : fb.score >= 60 ? '#d97706' : '#dc2626'}" stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${(fb.score / 100 * 289).toFixed(0)} 289" transform="rotate(-90 55 55)"/>
          <text x="55" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#1c2333">${fb.score}</text>
          <text x="55" y="72" text-anchor="middle" font-size="11" fill="#8b93ab">${fb.band}</text>
        </svg>
        <div><b style="font-size:16px">AI 批改报告${cached ? '（历史作文）' : ''}</b><div class="note" style="max-width:420px;margin-top:4px">${fb.summary}</div></div>
      </div>
      <hr class="hr">
      <div class="grid2" style="grid-template-columns:300px 1fr;align-items:center">
        <div><b style="font-size:13.5px;display:block;text-align:center;margin-bottom:4px">维度画像</b>${App.charts.radar(fb.dims || [])}</div>
        <div>${fb.items.map(it => `<div class="fb-item ${it.type}"><b>${icons[it.type][0]} ${App.esc(it.title)}</b><span>${App.esc(it.detail)}</span></div>`).join('')}</div>
      </div>
      <div class="note" style="margin-top:8px">批改维度：篇幅 · 结构 · 衔接 · 句式 · 用词 · 拼写规范。雷达图越接近外圈越强；优先补最凹的那一项。每次修改后重新提交，观察分数变化。</div>`;
  }

  /* ---------- 范文 ---------- */
  function renderModels(el) {
    const topics = window.WRITING_TOPICS || [];
    const cats = Array.from(new Set(topics.map(t => t.cat)));
    let curCat = cats[0];
    const paint = () => {
      const list = topics.filter(t => t.cat === curCat);
      el.innerHTML = `
        <div class="tabs" style="margin-bottom:14px">${cats.map(c => '<button class="tab ' + (c === curCat ? 'active' : '') + '" data-c="' + c + '">' + c + '</button>').join('')}</div>
        ${list.map(t => `<div class="card">
          <h3>${t.cat} · 范文赏析 <button class="btn ghost sm" data-go="${t.id}" style="margin-left:auto">✍️ 写这篇</button></h3>
          <div class="note" style="margin-bottom:8px"><b>题目：</b>${App.esc(t.title)}</div>
          <div style="background:var(--pri-soft);border-radius:10px;padding:10px 14px;margin-bottom:10px" class="note"><b>审题思路：</b>${App.esc(t.hint)}</div>
          <div class="passage essay-pane" data-src="范文" style="max-height:none">${App.esc(t.sample)}</div>
          <div class="note" style="margin:10px 0"><b>中文大意：</b>${App.esc(t.sampleNote)}</div>
          <h3 style="font-size:13.5px">可复用句式</h3>
          ${t.patterns.map(p => { const [en, cn] = p.split('|'); return '<div class="fb-item info"><b>✒️</b><span>' + App.esc(en) + '<br><span class="note">' + App.esc(cn || '') + '</span></span></div>'; }).join('')}
        </div>`).join('')}`;
      el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { curCat = b.dataset.c; paint(); });
      el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => V.render(el, { topicId: b.dataset.go }));
      el.querySelectorAll('.passage').forEach(p => App.dict.wrapWords(p));
    };
    paint();
  }

  /* ---------- 模板 ---------- */
  function renderTpl(el) {
    const tpls = window.WRITING_TEMPLATES || [];
    el.innerHTML = tpls.map(t => `<div class="card">
      <h3>🧱 ${t.name} <span class="sub">${t.desc}</span></h3>
      <div style="background:var(--teal-soft);border-radius:10px;padding:10px 14px" class="note"><b>结构骨架：</b>${App.esc(t.skeleton)}</div>
      <div style="margin-top:10px">${t.sentences.map(s => {
        const [en, cn] = s.split('|');
        return '<div class="fb-item info" style="align-items:flex-start"><b style="min-width:20px">▫</b><span style="font-family:Georgia,serif">' + App.esc(en) + '<br><span class="note" style="font-family:inherit">' + App.esc(cn || '') + '</span></span></div>';
      }).join('')}</div>
    </div>`).join('');
  }

  /* ---------- 句式 ---------- */
  function renderSent(el) {
    const sents = window.WRITING_SENTENCES || [];
    el.innerHTML = `<div class="card"><h3>✒️ 进阶句式库 <span class="sub">${sents.length} 个 · 写作时挑 1–2 个用即可</span></h3>
      ${sents.map(s => `<div class="fb-item info" style="align-items:flex-start">
        <b style="min-width:22px">✒️</b>
        <span style="font-family:Georgia,serif;font-size:14.5px">${App.esc(s.pat)}
        <br><span class="note" style="font-family:inherit">用法：${App.esc(s.cn)}</span>
        <br><span class="note" style="font-family:inherit;color:var(--teal)">例：${App.esc(s.eg)}</span></span>
      </div>`).join('')}</div>`;
  }

  /* ---------- 过渡 ---------- */
  function renderTrans(el) {
    const groups = window.WRITING_TRANSITIONS || [];
    el.innerHTML = `<div class="card"><h3>🔗 万能过渡语 <span class="sub">按功能分组 · 让段落逻辑显形</span></h3>
      ${groups.map(g => `<h3 style="font-size:13.5px;margin-top:14px">${g.group}</h3>
        ${g.items.map(([en, cn]) => `<div class="fb-item info"><b>${App.esc(en)}</b><span class="note">${App.esc(cn)}</span></div>`).join('')}`).join('')}
    </div>`;
  }
})();
</script>
<script>/* ===== 翻译专项：主题练习 / 双栏对照 / 积累本 ===== */
App.Views.translation = App.Views.translation || {};
(function () {
  let tab = 'practice';
  let theme = '全部';

  const THEMES = ['全部', '文化历史', '社会发展', '科技经济'];
  const V = App.Views.translation;
  V.reset = function () { tab = 'practice'; };

  V.render = function (el, param) {
    if (param && param.pid) return renderPractice(el, param.pid);
    el.innerHTML = '<div class="tabs">' +
      [['practice', '✍️ 主题练习'], ['sent', '✏️ 句子训练'], ['book', '📒 常用表达积累本']]
        .map(([k, t]) => '<button class="tab ' + (tab === k ? 'active' : '') + '" data-t="' + k + '">' + t + '</button>').join('') + '</div><div id="tBody"></div>';
    el.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; V.render(el); });
    if (tab === 'practice') renderList(el.querySelector('#tBody'));
    else if (tab === 'sent') renderSentences(el.querySelector('#tBody'));
    else renderBook(el.querySelector('#tBody'));
  };

  /* ---------- 句子翻译训练 ---------- */
  let sentIdx = null;
  function renderSentences(el) {
    const bank = window.TRANSLATION_SENTENCES || [];
    if (!bank.length) { el.innerHTML = '<div class="card">句子库未加载</div>'; return; }
    if (sentIdx == null) sentIdx = Math.floor(Math.random() * bank.length);
    const item = bank[sentIdx % bank.length];
    const done = (App.store.sentPractice || []).filter(s => s.id === sentIdx % bank.length);
    el.innerHTML = `<div class="card" style="max-width:760px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span class="tag">句子翻译训练</span><span class="note">第 ${sentIdx % bank.length + 1} / ${bank.length} 句 · 历史已练 ${done.length} 次</span>
        <button class="btn plain sm" id="nextSent" style="margin-left:auto">换一句 →</button>
      </div>
      <div class="passage" style="max-height:none;background:#fffdf5" data-src="翻译原文">${App.esc(item.cn)}</div>
      <textarea id="sentInput" rows="4" style="margin-top:12px" placeholder="把上面的中文句子翻译成英文…（先抓关键表达，再组合成句）"></textarea>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn big" id="sentGrade">🤖 提交评分</button>
        <button class="btn ghost" id="sentRef">👀 看参考译文（不计分）</button>
      </div>
      <div id="sentResult"></div>
    </div>`;
    el.querySelector('#nextSent').onclick = () => { sentIdx = (sentIdx + 1 + Math.floor(Math.random() * 3)) % bank.length; renderSentences(el); };
    el.querySelector('#sentGrade').onclick = () => {
      const text = el.querySelector('#sentInput').value.trim();
      if (App.grader.tokenize(text).length < 4) { App.toast('先写出你的英文译文'); return; }
      const r = App.grader.gradeSentence(text, item);
      App.store.sentPractice = App.store.sentPractice || [];
      App.store.sentPractice.push({ id: sentIdx % bank.length, date: App.today(), score: r.score });
      if (App.store.sentPractice.length > 500) App.store.sentPractice = App.store.sentPractice.slice(-400);
      App.save();
      showSentResult(el, item, r);
    };
    el.querySelector('#sentRef').onclick = () => showSentResult(el, item, null);
  }

  function showSentResult(el, item, r) {
    const box = el.querySelector('#sentResult');
    const icons = { good: '✅', warn: '⚠️', bad: '❌', info: '💡' };
    let html = '<hr class="hr"><div class="grid2" style="grid-template-columns:1fr 1fr;gap:12px">' +
      '<div style="background:#f7f8fd;border-radius:12px;padding:12px 14px"><b class="note">✍️ 我的译文</b><div class="essay-pane" style="margin-top:6px">' + App.esc(el.querySelector('#sentInput').value.trim() || '（空）') + '</div></div>' +
      '<div style="background:var(--teal-soft);border-radius:12px;padding:12px 14px"><b class="note">📖 参考译文</b><div class="essay-pane" style="margin-top:6px">' + App.esc(item.ref) + '</div></div></div>';
    if (r) {
      html += `<div class="score-dial" style="margin-top:12px">
        <svg width="90" height="90" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="#edeff7" stroke-width="11"/><circle cx="55" cy="55" r="46" fill="none" stroke="${r.score >= 80 ? '#16a34a' : r.score >= 60 ? '#d97706' : '#dc2626'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(r.score / 100 * 289).toFixed(0)} 289" transform="rotate(-90 55 55)"/><text x="55" y="55" text-anchor="middle" font-size="26" font-weight="800">${r.score}</text><text x="55" y="75" text-anchor="middle" font-size="11" fill="#8b93ab">${r.grade}</text></svg>
        <div><b>AI 评分</b><div class="note">${r.summary}</div></div></div>`;
      html += r.items.map(it => `<div class="fb-item ${it.type}"><b>${icons[it.type]} ${App.esc(it.title)}</b><span>${App.esc(it.detail)}</span></div>`).join('');
    }
    html += '<h3 style="font-size:13.5px;margin-top:12px">关键表达</h3><div style="display:flex;flex-wrap:wrap;gap:8px">' +
      item.keys.map(k => '<span class="tag">' + App.esc(k) + '</span>').join('') + '</div>';
    box.innerHTML = html;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function allPassages() { return window.TRANSLATION_PASSAGES || []; }

  function renderList(el) {
    const list = allPassages().filter(p => theme === '全部' || p.theme === theme);
    el.innerHTML = `
      <div class="card">
        <div class="tabs" style="margin-bottom:6px">${THEMES.map(t => '<button class="tab ' + (t === theme ? 'active' : '') + '" data-th="' + t + '">' + t + '</button>').join('')}</div>
        <div class="note">六级翻译常考中国文化、社会发展与科技经济三大主题。先自己译，再对照参考译文；批改引擎会核对<b>关键表达</b>是否译出，命中的表达自动进入积累本。</div>
      </div>
      <div class="grid3">${list.map(p => {
        const recs = App.store.translations.filter(t => t.pid === p.id);
        const best = recs.length ? Math.max(...recs.map(r => r.score)) : null;
        return `<div class="card" style="cursor:pointer" data-p="${p.id}">
          <span class="tag">${p.theme}</span>
          <h3 style="margin:8px 0 4px">${p.title}</h3>
          <div class="note" style="min-height:36px">${App.esc(p.cn.slice(0, 40))}…</div>
          <hr class="hr">
          <div style="display:flex;justify-content:space-between;font-size:13px"><span>${p.keys.length} 个关键表达</span><b>${best == null ? '未练习' : '最好 ' + best + ' 分'}</b></div>
        </div>`;
      }).join('')}</div>`;
    el.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { theme = b.dataset.th; V.render(el); });
    el.querySelectorAll('[data-p]').forEach(c => c.onclick = () => V.render(el, { pid: c.dataset.p }));
  }

  function addExprs(p) {
    for (const k of p.keys) {
      if (!App.store.exprs.some(e => e.zh === k.zh && e.theme === p.theme)) {
        App.store.exprs.push({ zh: k.zh, en: k.en, theme: p.theme, d: App.today() });
      }
    }
    App.save();
  }

  function renderPractice(el, pid) {
    const p = allPassages().find(x => x.id === pid);
    if (!p) { V.render(el); return; }
    const done = App.store.translations.filter(t => t.pid === pid);
    let graded = done.length ? done[done.length - 1] : null;
    el.innerHTML = `<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <button class="btn plain sm" id="back">‹ 返回</button>
        <span class="tag">${p.theme}</span><b>${p.title}</b>
        <span class="note" style="margin-left:auto">${done.length ? '已练 ' + done.length + ' 次 · 最好 ' + Math.max(...done.map(d => d.score)) + ' 分' : '第一次练习'}</span>
      </div>
      <div class="passage" style="max-height:none;background:#fffdf5" data-src="翻译原文">${App.esc(p.cn)}</div>
      <textarea id="trInput" rows="8" style="margin-top:12px" placeholder="在此写下你的英文译文…（对照上面的中文段落，建议先抓每句的关键表达）"></textarea>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
        <button class="btn big" id="submit">🤖 提交批改</button>
        <button class="btn ghost" id="peek">👀 直接看参考译文</button>
      </div>
      <div id="result"></div>
    </div>`;

    el.querySelector('#back').onclick = () => V.render(el);
    const ta = el.querySelector('#trInput');
    if (graded) { ta.value = graded.text; showResult(el, p, graded, true); }
    el.querySelector('#submit').onclick = () => {
      const text = ta.value.trim();
      if (App.grader.tokenize(text).length < 15) { App.toast('译文太短啦，先译完再提交'); return; }
      const r = App.grader.gradeTranslation(text, p);
      graded = { date: App.today(), pid, title: p.title, theme: p.theme, text, score: r.score, missed: r.missedKeys.length };
      App.store.translations.push(graded);
      if (App.store.translations.length > 200) App.store.translations = App.store.translations.slice(-150);
      App.save();
      addExprs(p);
      showResult(el, p, r, false);
    };
    el.querySelector('#peek').onclick = () => {
      if (!App.confirmBox('直接看参考译文将不计入练习成绩，继续吗？')) return;
      addExprs(p);
      showResult(el, p, null, false, true);
    };
  }

  function showResult(el, p, r, cached, peekOnly) {
    const box = el.querySelector('#result');
    const icons = { good: '✅', warn: '⚠️', bad: '❌', info: '💡' };
    let html = '<hr class="hr"><h3>对照与点评</h3>';
    if (r) {
      html += `<div class="score-dial" style="margin-bottom:10px">
        <svg width="100" height="100" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="46" fill="none" stroke="#edeff7" stroke-width="11"/>
          <circle cx="55" cy="55" r="46" fill="none" stroke="${r.score >= 80 ? '#16a34a' : r.score >= 60 ? '#d97706' : '#dc2626'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(r.score / 100 * 289).toFixed(0)} 289" transform="rotate(-90 55 55)"/>
          <text x="55" y="52" text-anchor="middle" font-size="24" font-weight="800">${r.score}</text>
          <text x="55" y="72" text-anchor="middle" font-size="10.5" fill="#8b93ab">${r.band}</text>
        </svg>
        <div><b>AI 翻译批改${cached ? '（上次练习）' : ''}</b><div class="note" style="max-width:420px">${r.summary} 折算六级翻译分约 ${r.estCET} / 106.5。</div></div>
      </div>`;
    }
    html += `<div class="grid2" style="grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:#f7f8fd;border-radius:12px;padding:12px 14px">
        <b class="note">✍️ 我的译文</b>
        <div class="essay-pane" style="margin-top:6px">${App.esc(el.querySelector('#trInput').value.trim() || '（空）')}</div>
      </div>
      <div style="background:var(--teal-soft);border-radius:12px;padding:12px 14px">
        <b class="note">📖 参考译文</b>
        <div class="essay-pane no-dict" style="margin-top:6px">${App.esc(p.ref)}</div>
      </div>
    </div>`;
    if (r) {
      if (r.missedKeys.length) {
        html += '<h3 style="font-size:13.5px;margin-top:14px">未译出的关键表达（已存入积累本）</h3>' +
          r.missedKeys.map(k => `<div class="fb-item warn"><b>${App.esc(k.zh)}</b><span>→ <b>${App.esc(k.en)}</b></span></div>`).join('');
      }
      if (r.dims) {
        html += '<div class="grid2" style="grid-template-columns:280px 1fr;align-items:center"><div><b style="font-size:13.5px;display:block;text-align:center;margin-bottom:4px">维度画像</b>' + App.charts.radar(r.dims) + '</div><div>' +
          r.items.map(it => `<div class="fb-item ${it.type}"><b>${icons[it.type]} ${App.esc(it.title)}</b><span>${App.esc(it.detail)}</span></div>`).join('') + '</div></div>';
      } else {
        html += r.items.map(it => `<div class="fb-item ${it.type}"><b>${icons[it.type]} ${App.esc(it.title)}</b><span>${App.esc(it.detail)}</span></div>`).join('');
      }
    }
    html += '<h3 style="font-size:13.5px;margin-top:14px">本篇关键表达</h3><div style="display:flex;flex-wrap:wrap;gap:8px">' +
      p.keys.map(k => '<span class="tag" title="' + App.esc(k.en) + '">' + App.esc(k.zh) + ' → ' + App.esc(k.en) + '</span>').join('') + '</div>';
    box.innerHTML = html;
    box.scrollIntoView({ behavior: 'smooth' });
  }

  function renderBook(el) {
    const byTheme = {};
    for (const e of App.store.exprs) (byTheme[e.theme] = byTheme[e.theme] || []).push(e);
    const done = App.store.translations;
    const trend = done.length >= 2 ? '<div class="card"><h3>📈 翻译成绩趋势 <span class="sub">' + done.length + ' 次练习</span></h3>' +
      App.charts.line({ series: [{ name: '批改得分', color: '#0d9488', data: done.map((t, i) => ({ x: (t.date || '') + ' #' + (done.length - i), y: t.score })) }], max: 100, min: 0 }) + '</div>' : '';
    el.innerHTML = trend + `<div class="card">
      <h3>📒 常用表达积累本 <span class="sub">练习与浏览过的表达自动收录 · 共 ${App.store.exprs.length} 条</span></h3>
      ${App.store.exprs.length ? Object.keys(byTheme).map(th => `
        <h3 style="font-size:13.5px;margin-top:12px"><span class="tag">${th}</span> ${byTheme[th].length} 条</h3>
        ${byTheme[th].map(e => `<div class="list-row"><div style="flex:1"><b style="font-size:13.5px">${App.esc(e.zh)}</b><div class="note" style="font-family:Georgia,serif">${App.esc(e.en)}</div></div><span class="note">${e.d}</span></div>`).join('')}`).join('')
      : '<div class="empty"><div class="big">📭</div>还没有积累的表达。完成一篇翻译练习后，本篇的关键表达会自动收进来。</div>'}
    </div>`;
  }
})();
</script>
<script>/* ===== 冲刺模考：限时分区组卷 + 成绩报告 ===== */
App.Views.mock = App.Views.mock || {};
(function () {
  const SETS = [
    { id: 'A', name: '模考卷 A', essay: 'w1', careful: 'c1', matching: 'm1', cloze: 'k1', trans: 't7' },
    { id: 'B', name: '模考卷 B', essay: 'w3', careful: 'c2', matching: 'm2', cloze: 'k2', trans: 't9' },
    { id: 'C', name: '模考卷 C', essay: 'w6', careful: 'c3', matching: 'm3', cloze: 'k3', trans: 't1' },
    { id: 'D', name: '模考卷 D', essay: 'w8', careful: 'c2', matching: 'm1', cloze: 'k2', trans: 't3' }
  ];
  const SECS = [
    { key: 'writing', name: '✍️ 写作', min: 30 },
    { key: 'careful', name: '🔍 仔细阅读', min: 15 },
    { key: 'matching', name: '🧩 长篇阅读', min: 10 },
    { key: 'cloze', name: '🧪 选词填空', min: 8 },
    { key: 'trans', name: '🀄 翻译', min: 30 }
  ];
  let run = null; // {setId, secIdx, results:{writing:{score},careful:{c,t},...}}

  /* ===== 真题全卷模式：真实结构/时长/710 分制 ===== */
  App.Mock = {};
  App.Mock.REAL_SECS = [
    { key: 'writing', name: '✍️ 写作', short: '写作', min: 30 },
    { key: 'listening', name: '🎧 听力', short: '听力', min: 30 },
    { key: 'rcloze', name: '🧪 阅读·选词填空', short: '选词', min: 12, group: '阅读 40′' },
    { key: 'rmatch', name: '🧩 阅读·长篇匹配', short: '匹配', min: 12, group: '阅读 40′' },
    { key: 'rcareful', name: '🔍 阅读·仔细阅读', short: '仔细', min: 16, group: '阅读 40′' },
    { key: 'trans', name: '🀄 翻译', short: '翻译', min: 30 }
  ];
  App.Mock.REAL_LISTENING_SETS = { cet4: ['n1', 'c1', 'p1'], cet6: ['c5', 'p5', 'l1'] };
  App.Mock.REAL_READING_SETS = { cloze: 'k1', match: 'm1', careful: 'c1' };
  /* 710 分制折算：写作 106.5 · 听力 248.5 · 阅读 248.5 · 翻译 106.5 */
  App.Mock.scoreReal = function (r) {
    const w = Math.round(106.5 * (r.writing ? r.writing.score / 100 : 0));
    const l = Math.round(248.5 * (r.listening ? r.listening.c / Math.max(1, r.listening.t) : 0));
    const rd = Math.round(248.5 * (r.reading ? r.reading.c / Math.max(1, r.reading.t) : 0));
    const t = Math.round(106.5 * (r.translation ? r.translation.score / 100 : 0));
    return { writing: w, listening: l, reading: rd, translation: t, total: w + l + rd + t };
  };
  App.Mock.scoreQuick = function (r) {
    const readingC = (r.careful ? r.careful.c : 0) + (r.matching ? r.matching.c : 0) + (r.cloze ? r.cloze.c : 0);
    const readingT = (r.careful ? r.careful.t : 0) + (r.matching ? r.matching.t : 0) + (r.cloze ? r.cloze.t : 0);
    return {
      writing: r.writing ? Math.round(r.writing.score / 100 * 106.5) : 0,
      reading: Math.round(readingC / (readingT || 1) * 248.5),
      trans: r.trans ? r.trans.estCET : 0,
      readingDetail: readingC + '/' + readingT
    };
  };

  const V = App.Views.mock;
  V.reset = function () { run = null; };
  V.render = function (el) {
    if (run && run.mode === 'real') return renderRealRun(el);
    if (run) return renderRun(el);
    el.innerHTML = `
      <div class="card">
        <h3>⏱ 冲刺模考 <span class="sub">不含听力 · 全程限时 · 自动切区</span></h3>
        <div class="note" style="margin-bottom:12px">完整体验考场节奏：写作 30 分钟 → 仔细阅读 15 分钟 → 长篇阅读 10 分钟 → 选词填空 8 分钟 → 翻译 30 分钟，共约 93 分钟。每区到时自动提交进入下一区，中途不能回退。交卷后按六级分值折算预估分（写作 106.5 + 阅读 248.5 + 翻译 106.5；听力 248.5 分不在本模考范围内）。</div>
        <div class="grid2">
          ${SETS.map(s => {
            const last = App.store.mocks.filter(m => m.setId === s.id).pop();
            return `<div class="card" style="cursor:pointer;margin:0" data-set="${s.id}">
              <h3 style="margin-bottom:6px">${s.name}</h3>
              <div class="note">写作：${(window.WRITING_TOPICS || []).find(t => t.id === s.essay).cat} 话题 · 阅读：第 1-${SETS.indexOf(s) + 1} 套 · 翻译：${(window.TRANSLATION_PASSAGES || []).find(t => t.id === s.trans).title}</div>
              <div style="margin-top:10px">${last ? '<span class="badge ok">上次预估 ' + last.total + ' 分</span>' : '<span class="tag">未挑战</span>'}</div>
              <button class="btn" style="margin-top:12px">开始模考</button>
            </div>`;
          }).join('')}
        </div>
      </div>
      ${App.store.mocks.length ? `<div class="card"><h3>模考记录</h3>${App.store.mocks.slice().reverse().slice(0, 6).map(m => `<div class="list-row"><span class="tag">${m.date}</span><b>${m.setId} 卷</b><div style="flex:1" class="note">${m.mode === 'real' ? '真题全卷 · 710 制' : '写作 ' + (m.parts.writing || '—') + ' 分 · 阅读 ' + m.parts.reading + ' · 翻译 ' + (m.parts.trans || '—') + ' 分'}</div><span class="badge ${m.total >= (m.mode === 'real' ? 425 : 330) ? 'ok' : 'warn'}" style="font-size:13px">预估 ${m.total}${m.mode === 'real' ? '/710' : '/461.5'}</span></div>`).join('')}</div>` : ''}
      <div class="card">
        <h3>🏛 真题全卷模式 <span class="sub">真实结构 · 真实时长 · 710 分制 · 含听力</span></h3>
        <div class="note" style="margin-bottom:12px">完全对标真卷流程：<b>写作 30′ → 听力 30′ → 阅读 40′（选词/匹配/仔细）→ 翻译 30′</b>，共 130 分钟，到时自动切区。交卷按真卷分值折算 710 分制预估分（写作 106.5 · 听力 248.5 · 阅读 248.5 · 翻译 106.5）。<br>📌 题源说明：本模式题源为自编仿真题（结构对标 2020–2024 真卷）；真题原题受版权保护不予收录，冲刺阶段请搭配正版真题集，用本模式模拟考场节奏。</div>
        <button class="btn big" id="startReal">🏛 开始真题全卷（${App.examName()} · 130 分钟）</button>
        ${App.store.mocks.filter(m => m.mode === 'real').length ? '<span class="tag" style="margin-left:10px">已完成 ' + App.store.mocks.filter(m => m.mode === 'real').length + ' 次 · 最近 ' + App.store.mocks.filter(m => m.mode === 'real').pop().total + ' 分</span>' : ''}
      </div>`;
    el.querySelectorAll('[data-set]').forEach(c => c.onclick = () => {
      if (!App.confirmBox('模考全程约 93 分钟，中途退出不计成绩。确定开始吗？')) return;
      run = { setId: c.dataset.set, secIdx: 0, results: {} };
      renderRun(el);
    });
    const sr = el.querySelector('#startReal');
    if (sr) sr.onclick = () => {
      if (!App.confirmBox('真题全卷共 130 分钟（写作30 → 听力25 → 阅读40 → 翻译30），到时自动切区，中途退出不计成绩。确定开始吗？')) return;
      run = { mode: 'real', secIdx: 0, results: {} };
      renderRealRun(el);
    };
  }

  /* ===== 真题全卷运行 ===== */
  function renderRealRun(el) {
    if (run.secIdx >= App.Mock.REAL_SECS.length) return renderRealReport(el);
    const sec = App.Mock.REAL_SECS[run.secIdx];
    el.innerHTML = `
      <div class="card">
        <div class="steps">${App.Mock.REAL_SECS.map((s, i) => '<span class="step ' + (i < run.secIdx ? 'done' : i === run.secIdx ? 'cur' : '') + '">' + s.short + ' ' + s.min + '′</span>').join('')}</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <b>${sec.name}</b>
          <span class="note">${sec.group || '真卷流程'} · 限时 ${sec.min} 分钟，到时自动提交</span>
          <span class="timer cool" style="margin-left:auto" id="secTimer">--:--</span>
          <button class="btn danger sm" id="abort">中止考试</button>
        </div>
      </div>
      <div id="secBody"></div>`;
    el.querySelector('#abort').onclick = () => {
      if (App.confirmBox('中止后本次真题全卷成绩将作废，确定？')) { run = null; V.render(el); }
    };
    const body = el.querySelector('#secBody');
    const timeLimit = sec.min * 60;
    let left = timeLimit;
    const tEl = el.querySelector('#secTimer');
    tEl.textContent = App.mmss(left);
    const tick = setInterval(() => { left--; if (tEl.isConnected) tEl.textContent = App.mmss(left); }, 1000);
    let autoTimer = null;
    const exam = App.store.profile.exam || 'cet6';
    const goNext = (result) => {
      clearInterval(tick);
      clearInterval(autoTimer);
      run.results[sec.key] = result;
      run.secIdx++;
      App.toast('「' + sec.short + '」已提交');
      renderRealRun(el);
    };
    let forceSubmit = null;
    if (sec.key === 'writing') {
      renderWritingSec(body, { essay: 'w1' }, goNext, f => forceSubmit = f);
    } else if (sec.key === 'listening') {
      const setIds = App.Mock.REAL_LISTENING_SETS[exam];
      const h = App.Listening.renderMock(body, goNext, { setIds });
      forceSubmit = h.forceSubmit;
    } else if (sec.key === 'rcloze' || sec.key === 'rmatch' || sec.key === 'rcareful') {
      const map = { rcloze: 'cloze', rmatch: 'matching', rcareful: 'careful' };
      App.Reading['render_' + map[sec.key]](body, App.Mock.REAL_READING_SETS[map[sec.key]], { timeLimit, onSubmit: goNext }, () => {});
      clearInterval(tick);
      tEl.style.display = 'none';
    } else if (sec.key === 'trans') {
      renderTransSec(body, { trans: exam === 'cet4' ? 't1' : 't7' }, goNext, f => forceSubmit = f);
    }
    // 到时自动提交（阅读三区由渲染器自带计时接管）
    if (sec.key === 'writing' || sec.key === 'listening' || sec.key === 'trans') {
      autoTimer = setInterval(() => {
        if (run == null) { clearInterval(autoTimer); return; }
        if (left > 0) return;
        clearInterval(autoTimer);
        App.toast('⏰ 「' + sec.short + '」时间到，自动提交');
        if (forceSubmit) forceSubmit();
      }, 1000);
    }
  }

  function renderRealReport(el) {
    const r = run.results;
    const s = App.Mock.scoreReal(r);
    const rec = { date: App.today(), setId: 'REAL', mode: 'real', parts: { writing: s.writing, listening: s.listening, reading: s.reading, translation: s.translation }, total: s.total };
    App.store.mocks.push(rec);
    if (r.writing && r.writing.text) {
      App.store.essays.push({ date: App.today() + '（真题卷）', topicId: 'w1', cat: '真题全卷', text: r.writing.text, score: r.writing.score, items: 0 });
    }
    App.save();
    el.innerHTML = `<div class="card" style="max-width:700px;margin:20px auto;text-align:center;padding:34px">
      <div style="font-size:46px">🏛</div>
      <h2>真题全卷完成！</h2>
      <div style="font-size:42px;font-weight:800;color:var(--pri);margin:8px 0">预估总分 ${s.total}<span style="font-size:16px;color:var(--ink3)"> / 710</span></div>
      <div class="grid4" style="grid-template-columns:repeat(4,1fr);text-align:left;margin:14px 0">
        <div class="stat-card"><div class="num" style="font-size:19px">${s.writing}<small>/106.5</small></div><div class="lab">写作</div></div>
        <div class="stat-card"><div class="num" style="font-size:19px">${s.listening}<small>/248.5</small></div><div class="lab">听力</div></div>
        <div class="stat-card"><div class="num" style="font-size:19px">${s.reading}<small>/248.5</small></div><div class="lab">阅读</div></div>
        <div class="stat-card"><div class="num" style="font-size:19px">${s.translation}<small>/106.5</small></div><div class="lab">翻译</div></div>
      </div>
      <div class="note" style="margin-bottom:14px">分值说明：写作 15% · 听力 35% · 阅读 35% · 翻译 15%（710 分制，与真卷一致）。听力和阅读的正确率详见各分区解析。</div>
      <button class="btn big" id="backMock">返回模考中心</button>
    </div>`;
    el.querySelector('#backMock').onclick = () => { run = null; V.render(el); };
  };

  function renderRun(el) {
    if (run.secIdx >= SECS.length) return renderReport(el);
    const set = SETS.find(s => s.id === run.setId);
    const sec = SECS[run.secIdx];
    el.innerHTML = `
      <div class="card">
        <div class="steps">${SECS.map((s, i) => '<span class="step ' + (i < run.secIdx ? 'done' : i === run.secIdx ? 'cur' : '') + '">' + s.name.replace(/^\S+\s/, '') + ' ' + s.min + '′</span>').join('')}</div>
        <div style="display:flex;align-items:center;gap:12px">
          <b>${sec.name}</b>
          <span class="note">限时 ${sec.min} 分钟，到时自动提交</span>
          <span class="timer cool" style="margin-left:auto" id="secTimer">--:--</span>
          <button class="btn danger sm" id="abort">中止模考</button>
        </div>
      </div>
      <div id="secBody"></div>`;
    el.querySelector('#abort').onclick = () => {
      if (App.confirmBox('中止后本次模考成绩将作废，确定？')) { run = null; V.render(el); }
    };
    const body = el.querySelector('#secBody');
    const timeLimit = sec.min * 60;
    // 区内倒计时显示
    let left = timeLimit;
    const tEl = el.querySelector('#secTimer');
    tEl.textContent = App.mmss(left);
    const tick = setInterval(() => { left--; if (tEl.isConnected) tEl.textContent = App.mmss(left); }, 1000);

    const goNext = (result) => {
      clearInterval(tick);
      run.results[sec.key] = result;
      run.secIdx++;
      App.toast('「' + sec.name.replace(/^\S+\s/, '') + '」已提交');
      renderRun(el);
    };
    const autoNext = () => { App.toast('⏰ 本区时间到，自动提交'); forceSubmit && forceSubmit(); };

    let forceSubmit = null;
    if (sec.key === 'writing') renderWritingSec(body, set, goNext, f => forceSubmit = f);
    else if (sec.key === 'trans') renderTransSec(body, set, goNext, f => forceSubmit = f);
    else {
      App.Reading['render_' + sec.key](body, set[sec.key], { timeLimit, onSubmit: goNext }, () => {});
      clearInterval(tick);          // 题型渲染器自带倒计时
      tEl.style.display = 'none';   // 隐藏外层计时，避免重复显示
    }
  }

  function renderWritingSec(body, set, done, regForce) {
    const topic = (window.WRITING_TOPICS || []).find(t => t.id === set.essay);
    body.innerHTML = `<div class="card">
      <div class="note" style="margin-bottom:8px"><b>题目：</b>${App.esc(topic.title)}</div>
      <textarea id="mEssay" rows="12" placeholder="考场作文：150–200 词，建议三段式…"></textarea>
      <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
        <span class="note">词数：<b id="mWc">0</b></span>
        <button class="btn big" id="mSubmit" style="margin-left:auto">提交并进入下一区 →</button>
      </div></div>`;
    const ta = body.querySelector('#mEssay');
    ta.oninput = () => body.querySelector('#mWc').textContent = App.grader.tokenize(ta.value).length;
    const submit = () => {
      const text = ta.value.trim();
      if (App.grader.tokenize(text).length < 20 && !App.confirmBox('作文不足 20 词，仍要提交吗？')) return;
      const fb = App.grader.gradeWriting(text);
      done({ score: fb.score, text, estCET: Math.round(fb.score / 100 * 106.5) });
    };
    body.querySelector('#mSubmit').onclick = submit;
    regForce(submit);
  }

  function renderTransSec(body, set, done, regForce) {
    const p = (window.TRANSLATION_PASSAGES || []).find(t => t.id === set.trans);
    body.innerHTML = `<div class="card">
      <div class="passage" style="max-height:none;background:#fffdf5" data-src="翻译原文">${App.esc(p.cn)}</div>
      <textarea id="mTrans" rows="9" style="margin-top:12px" placeholder="考场翻译：先抓关键表达，再保证句子完整…"></textarea>
      <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
        <span class="note">词数：<b id="mTc">0</b></span>
        <button class="btn big" id="mSubmit2" style="margin-left:auto">提交并交卷 →</button>
      </div></div>`;
    const ta = body.querySelector('#mTrans');
    ta.oninput = () => body.querySelector('#mTc').textContent = App.grader.tokenize(ta.value).length;
    const submit = () => {
      const text = ta.value.trim();
      if (App.grader.tokenize(text).length < 10 && !App.confirmBox('译文不足 10 词，仍要提交吗？')) return;
      const r = App.grader.gradeTranslation(text, p);
      done({ score: r.score, text, estCET: r.estCET });
    };
    body.querySelector('#mSubmit2').onclick = submit;
    regForce(submit);
  }

  function renderReport(el) {
    const set = SETS.find(s => s.id === run.setId);
    const r = run.results;
    const readingC = (r.careful ? r.careful.c : 0) + (r.matching ? r.matching.c : 0) + (r.cloze ? r.cloze.c : 0);
    const readingT = (r.careful ? r.careful.t : 0) + (r.matching ? r.matching.t : 0) + (r.cloze ? r.cloze.t : 0);
    const readingScore = Math.round(readingC / (readingT || 1) * 248.5);
    const writingScore = r.writing ? r.writing.estCET : 0;
    const transScore = r.trans ? r.trans.estCET : 0;
    const total = readingScore + writingScore + transScore;
    const rec = { date: App.today(), setId: set.id, parts: { writing: writingScore, reading: readingScore + '分(' + readingC + '/' + readingT + ')', trans: transScore }, total, detail: { careful: r.careful, matching: r.matching, cloze: r.cloze, writingScore: r.writing ? r.writing.score : 0, transScore: r.trans ? r.trans.score : 0 } };
    App.store.mocks.push(rec);
    App.save();
    el.innerHTML = `<div class="card" style="max-width:680px;margin:20px auto;text-align:center;padding:34px">
      <div style="font-size:46px">🏁</div>
      <h2>${set.name} 完成！</h2>
      <div style="font-size:40px;font-weight:800;color:var(--pri);margin:8px 0">预估总分 ${total}<span style="font-size:16px;color:var(--ink3)"> / 461.5（不含听力）</span></div>
      <div class="note" style="margin-bottom:16px">折算说明：写作 ${writingScore}/106.5 · 阅读 ${readingScore}/248.5（${readingC}/${readingT}）· 翻译 ${transScore}/106.5。含听力的 710 分制中，听力另占 248.5 分。</div>
      <div class="grid3" style="text-align:left">
        <div class="stat-card"><div class="num" style="font-size:20px">${r.writing ? r.writing.score : '—'}<small>/100</small></div><div class="lab">写作（AI批改）</div></div>
        <div class="stat-card"><div class="num" style="font-size:20px">${readingT ? Math.round(readingC / readingT * 100) + '%' : '—'}</div><div class="lab">阅读正确率</div></div>
        <div class="stat-card"><div class="num" style="font-size:20px">${r.trans ? r.trans.score : '—'}<small>/100</small></div><div class="lab">翻译（AI批改）</div></div>
      </div>
      <div style="margin-top:18px">
        <button class="btn big" id="backHome">返回模考中心</button>
      </div>
      <div class="note" style="margin-top:12px">模考中写作/翻译的详细 AI 批改报告，可到「写作专项→批改历史」回看（写作作文已保存）。</div>
    </div>`;
    // 模考作文也存入批改历史
    if (r.writing && r.writing.text) {
      App.store.essays.push({ date: App.today() + '（模考' + set.id + '）', topicId: set.essay, cat: '模考', text: r.writing.text, score: r.writing.score, items: 0 });
      App.save();
    }
    el.querySelector('#backHome').onclick = () => { run = null; V.render(el); };
  }
})();
</script>
<script>/* ===== 生词本：查过的词集中管理 ===== */
App.Views.wordbook = App.Views.wordbook || {};
(function () {
  const V = App.Views.wordbook;
  V.render = function (el) {
    const words = Object.keys(App.store.wordbook).sort((a, b) => App.store.wordbook[b].d.localeCompare(App.store.wordbook[a].d));
    el.innerHTML = `
      <div class="card">
        <h3>⭐ 生词本 <span class="sub">${words.length} 个词 · 自动进入每日复习队列</span></h3>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
          <input class="txt" id="lookup" placeholder="输入单词查询内置词典并收藏…" style="flex:1">
          <button class="btn ghost" id="lookupBtn">查词</button>
        </div>
        <div class="note">来源：① 阅读/写作/翻译页面点击生词 → 「加入生词本」；② 背词、速刷时标记「有点难/不认识」自动收录。生词本中的词与正式词库一样参与间隔重复。</div>
        <div id="lookupResult" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <h3>我的生词</h3>
        ${words.length ? words.map(w => {
          const e = App.WMAP()[w];
          const st = App.srsStatus(w);
          const meta = App.store.wordbook[w];
          return `<div class="list-row">
            <div style="flex:1;min-width:0">
              <b style="font-size:15px">${w}</b>
              ${e ? '<span class="note">/' + e.ipa + '/ ' + e.pos + '</span>' : '<span class="badge warn">未收录</span>'}
              <span class="badge ${st.cls || 'tag'}" style="${st.cls ? '' : 'background:#f1f3fa;color:var(--ink2)'}">${st.label}</span>
              <div class="note">${e ? App.esc(e.gloss) : '（词库未收录释义，点击 🔊 听发音）'} <span style="opacity:.6">· ${meta.d} 加入 · ${meta.src}</span></div>
            </div>
            ${e ? '<button class="ico-btn" data-sp="' + w + '">🔊</button>' : '<button class="ico-btn" data-sp="' + w + '">🔊</button>'}
            <button class="btn danger sm" data-del="${w}">移除</button>
          </div>`;
        }).join('') : '<div class="empty"><div class="big">📭</div>生词本还是空的。去阅读文章里点几个生词试试！</div>'}
      </div>`;
    const doLookup = () => {
      const q = el.querySelector('#lookup').value.trim();
      const box = el.querySelector('#lookupResult');
      if (!q) return;
      const entry = App.dict.lookup(q);
      if (entry) {
        box.innerHTML = `<div class="fb-item info"><b>${entry.w}</b><span>/${entry.ipa}/ ${entry.pos} · ${App.esc(entry.gloss)} <button class="btn ghost sm" id="addIt">＋ 加入生词本</button></span></div>`;
        box.querySelector('#addIt').onclick = () => App.dict.addToBook(entry.w, '手动查询');
      } else {
        box.innerHTML = '<div class="fb-item warn"><b>未收录</b><span>「' + App.esc(q) + '」不在内置词典中，可直接加入生词本记录。<button class="btn ghost sm" id="addIt2">＋ 仍要加入</button></span></div>';
        box.querySelector('#addIt2').onclick = () => App.dict.addToBook(q.toLowerCase(), '手动查询-未收录');
      }
      App.speak(q);
    };
    el.querySelector('#lookupBtn').onclick = doLookup;
    el.querySelector('#lookup').onkeydown = e => { if (e.key === 'Enter') doLookup(); };
    el.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => App.speak(b.dataset.sp));
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      if (App.confirmBox('把「' + b.dataset.del + '」从生词本移除？（学习记录将一并清除）')) {
        App.dict.removeFromBook(b.dataset.del);
        delete App.store.srs[b.dataset.del];
        App.save();
        V.render(el);
      }
    });
  };
})();
</script>
<script>/* ===== 真题中心：资源导航 + 本地真题库 + 刷题记录 ===== */
App.Views.realexam = App.Views.realexam || {};
(function () {
  let tab = 'links';
  const V = App.Views.realexam;
  V.reset = function () { tab = 'links'; };
  V.render = function (el) {
    el.innerHTML = '<div class="tabs">' +
      [['links', '🔗 资源导航'], ['lib', '📁 本地真题库'], ['scores', '📝 刷题记录']]
        .map(([k, t]) => '<button class="tab ' + (tab === k ? 'active' : '') + '" data-t="' + k + '">' + t + '</button>').join('') + '</div><div id="reBody"></div>';
    el.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; V.render(el); });
    const body = el.querySelector('#reBody');
    if (tab === 'links') renderLinks(body);
    else if (tab === 'lib') renderLib(body);
    else renderScores(body);
  };

  /* ---------- 资源导航 ---------- */
  function renderLinks(el) {
    const links = window.REAL_EXAM_LINKS || [];
    el.innerHTML = `
      <div class="card">
        <h3>📜 真题资源导航 <span class="sub">第三方公开资源站汇总</span></h3>
        <div class="fb-item warn"><b>⚖️ 版权说明</b><span>${App.esc(window.REAL_EXAM_DISCLAIMER || '')}</span></div>
        ${links.map((L, i) => `<div class="card" style="margin:10px 0 0">
          <h3 style="flex-wrap:wrap">${App.esc(L.name)}
            <a href="${L.url}" target="_blank" rel="noopener noreferrer"><button class="btn sm" data-open="${i}" style="margin-left:auto">打开站点 ↗</button></a>
          </h3>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">${L.tags.map(t => '<span class="tag">' + App.esc(t) + '</span>').join('')}</div>
          <div class="note" style="line-height:1.8">${App.esc(L.desc)}</div>
          <div class="note" style="margin-top:6px;opacity:.85">⚖️ ${App.esc(L.note)}</div>
          <div class="note" style="margin-top:6px">💡 用法：在站点下载真题 PDF / 听力音频到本机 → 切到「📁 本地真题库」导入 → 配合「冲刺模考」的真题全卷模式或打印对照使用。</div>
        </div>`).join('')}
      </div>`;
  }

  /* ---------- 本地真题库 ---------- */
  function renderLib(el) {
    const metas = (App.store.realExams || []).slice().sort((a, b) => b.date - a.date);
    const broken = !App.retdb.available();
    el.innerHTML = `
      <div class="card">
        <h3>📁 本地真题库 <span class="sub">${metas.length} 个文件 · 存于本机 IndexedDB</span></h3>
        ${broken ? '<div class="fb-item bad"><b>⚠️ 本地文件库不可用</b><span>当前以 file:// 方式打开，浏览器禁用了本地数据库。真题导入功能不可用——请通过本地服务器或 GitHub Pages 在线版使用本功能；其余学习模块不受影响。</span></div>' : `
        <div class="note" style="margin-bottom:10px">导入你下载好的真题 PDF（试卷/解析）或听力音频 MP3，打上级别与年月标签。文件只保存在本机，不上传任何服务器。</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px">
          <div><div class="note">级别</div><select class="selct" id="reLevel"><option value="cet6">六级</option><option value="cet4">四级</option></select></div>
          <div><div class="note">年份</div><input class="txt" id="reYear" type="number" min="2010" max="2027" value="2025" style="width:90px"></div>
          <div><div class="note">月份/考次</div><select class="selct" id="reMonth"><option value="6">6 月</option><option value="12">12 月</option><option value="3">3 月加考</option><option value="9">9 月加考</option></select></div>
          <div><div class="note">备注（可选）</div><input class="txt" id="reLabel" placeholder="如：第一套 / 解析版" style="width:140px"></div>
          <button class="btn" id="reImportBtn">⬆ 选择文件导入</button>
          <input type="file" id="reFile" accept=".pdf,.mp3,.wav,.m4a,.aac,.ogg,.doc,.docx" style="display:none">
        </div>`}
        <div id="reList"></div>
      </div>`;
    if (broken) return;
    const fileInput = el.querySelector('#reFile');
    el.querySelector('#reImportBtn').onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const f = fileInput.files[0];
      if (!f) return;
      const kind = App.retx.kindOf(f.name);
      if (!kind) { App.toast('仅支持 PDF/Word 试卷或音频文件'); return; }
      const level = el.querySelector('#reLevel').value;
      const year = parseInt(el.querySelector('#reYear').value) || 2025;
      const month = el.querySelector('#reMonth').value;
      const label = el.querySelector('#reLabel').value.trim();
      const key = 're_' + level + '_' + year + '_' + month + '_' + Date.now();
      try {
        await App.retdb.put(key, f);
        App.store.realExams = App.store.realExams || [];
        App.store.realExams.push({
          key, kind, level, year, month,
          name: f.name, size: f.size, label,
          date: Date.now()
        });
        App.save();
        App.toast('已导入：' + f.name);
        V.render(el);
      } catch (e) {
        App.toast('导入失败：' + (e.message || '存储不可用'));
      }
    };
    const list = el.querySelector('#reList');
    const paint = () => {
      if (!metas.length) { list.innerHTML = '<div class="empty"><div class="big">📭</div>还没有导入真题。去「资源导航」下载，再回到这里导入。</div>'; return; }
      list.innerHTML = metas.map(m => `<div class="list-row">
        <span class="badge ${m.kind === 'audio' ? 'warn' : 'ok'}" style="min-width:52px;text-align:center">${m.kind === 'audio' ? '🎧 听力' : '📄 试卷'}</span>
        <div style="flex:1;min-width:0">
          <b>${App.esc((m.level === 'cet4' ? '四级 ' : '六级 ') + m.year + '.' + String(m.month).padStart(2, '0'))}</b>
          ${m.label ? '<span class="tag">' + App.esc(m.label) + '</span>' : ''}
          <div class="note" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${App.esc(m.name)} · ${(m.size / 1048576).toFixed(1)} MB</div>
        </div>
        <button class="btn ghost sm" data-openre="${m.key}">${m.kind === 'audio' ? '▶ 播放' : '📂 打开'}</button>
        <button class="btn danger sm" data-delre="${m.key}">删除</button>
      </div>`).join('');
      list.querySelectorAll('[data-openre]').forEach(b => b.onclick = async () => {
        const m = metas.find(x => x.key === b.dataset.openre);
        const r = await App.retx.openFile(m.key, m.name);
        if (r && r.inline) {
          let zone = document.getElementById('rePlayer');
          if (!zone) {
            el.querySelector('#reList').insertAdjacentHTML('beforebegin', '<div class="card" id="rePlayer" style="margin-bottom:12px"></div>');
            zone = document.getElementById('rePlayer');
          }
          zone.innerHTML = '<h3>🎧 正在播放：' + App.esc(m.name) + '</h3><audio controls autoplay style="width:100%" src="' + r.url + '"></audio>';
        }
      });
      list.querySelectorAll('[data-delre]').forEach(b => b.onclick = async () => {
        const m = metas.find(x => x.key === b.dataset.delre);
        if (!App.confirmBox('删除「' + ((m.level === 'cet4' ? '四级 ' : '六级 ') + m.year + '.' + String(m.month).padStart(2, '0')) + '」的本地文件？')) return;
        await App.retdb.del(m.key);
        App.store.realExams = (App.store.realExams || []).filter(x => x.key !== m.key);
        App.save();
        V.render(el);
      });
    };
    paint();
  }

  /* ---------- 刷题记录 ---------- */
  function renderScores(el) {
    const scores = (App.store.realScores || []).slice().sort((a, b) => b.date - a.date);
    const avg = scores.length ? Math.round(scores.reduce((a, s) => a + s.total, 0) / scores.length) : null;
    const best = scores.length ? Math.max(...scores.map(s => s.total)) : null;
    el.innerHTML = `
      <div class="card">
        <h3>📝 真题刷题记录 <span class="sub">手动录入做过的真题分数 · 计入个人成长</span></h3>
        <div class="note" style="margin-bottom:10px">用导入的真题 PDF 计时模考后，在这里录入分数。425 分为普遍认为的及格线，550+ 为优秀（数据参考：CET通备考平台）。</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px">
          <div><div class="note">级别</div><select class="selct" id="scLevel"><option value="cet6">六级</option><option value="cet4">四级</option></select></div>
          <div><div class="note">试卷标注</div><input class="txt" id="scLabel" placeholder="如 2024.06 第一套" style="width:160px"></div>
          <div><div class="note">总分（必填）</div><input class="txt" id="scTotal" type="number" min="0" max="710" style="width:90px"></div>
          <div><div class="note">听力</div><input class="txt" id="scL" type="number" min="0" max="248.5" style="width:76px"></div>
          <div><div class="note">阅读</div><input class="txt" id="scR" type="number" min="0" max="248.5" style="width:76px"></div>
          <div><div class="note">写作翻译</div><input class="txt" id="scW" type="number" min="0" max="213" style="width:76px"></div>
          <button class="btn" id="scAdd">＋ 记录</button>
        </div>
        ${scores.length ? `<div style="display:flex;gap:18px;margin:6px 0 12px;flex-wrap:wrap">
          <div><div class="num" style="font-size:22px;font-weight:800">${avg}</div><div class="note">平均分</div></div>
          <div><div class="num" style="font-size:22px;font-weight:800;color:var(--ok)">${best}</div><div class="note">最高分</div></div>
          <div><div class="num" style="font-size:22px;font-weight:800">${scores.length}</div><div class="note">已刷套数</div></div>
        </div>` : ''}
        <div id="scList"></div>
      </div>`;
    const list = el.querySelector('#scList');
    const paint = () => {
      if (!scores.length) { list.innerHTML = '<div class="empty"><div class="big">📋</div>还没有记录。做一套真题，回来录入分数吧。</div>'; return; }
      list.innerHTML = scores.map(s => `<div class="list-row">
        <span class="badge ${s.total >= 550 ? 'ok' : s.total >= 425 ? 'warn' : 'bad'}" style="min-width:70px;text-align:center;font-size:14px">${s.total} 分</span>
        <div style="flex:1;min-width:0"><b>${s.level === 'cet4' ? '四级' : '六级'} · ${App.esc(s.label)}</b>
          <div class="note">${s.sub ? '听力 ' + (s.sub.l ?? '—') + ' · 阅读 ' + (s.sub.r ?? '—') + ' · 写翻 ' + (s.sub.w ?? '—') + ' · ' : ''}${s.date}</div></div>
        <button class="btn danger sm" data-delsc="${s.id}">删除</button>
      </div>`).join('');
      list.querySelectorAll('[data-delsc]').forEach(b => b.onclick = () => {
        if (!App.confirmBox('删除这条刷题记录？')) return;
        App.store.realScores = (App.store.realScores || []).filter(x => x.id !== b.dataset.delsc);
        App.save();
        V.render(el);
      });
    };
    el.querySelector('#scAdd').onclick = () => {
      const totalV = parseInt(el.querySelector('#scTotal').value);
      if (!totalV || totalV < 0 || totalV > 710) { App.toast('请输入 0-710 之间的总分'); return; }
      const sub = {
        l: el.querySelector('#scL').value || null,
        r: el.querySelector('#scR').value || null,
        w: el.querySelector('#scW').value || null
      };
      App.store.realScores = App.store.realScores || [];
      App.store.realScores.push({
        id: 'sc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        level: el.querySelector('#scLevel').value,
        label: el.querySelector('#scLabel').value.trim() || '未命名试卷',
        total: totalV, sub, date: App.today()
      });
      App.save();
      App.toast('已记录');
      V.render(el);
    };
    paint();
  }
})();
</script>
<script>/* ===== 主控：导航路由 + 学习计时 + 初始化 ===== */
(function () {
  const NAV = [
    ['home', '🏠', '首页看板', 'Dashboard'],
    ['placement', '🧭', '入学测试', 'Placement Test'],
    ['vocab', '📚', '词汇记忆', 'Vocabulary'],
    ['listening', '🎧', '听力专项', 'Listening'],
    ['reading', '📖', '阅读专项', 'Reading'],
    ['writing', '✍️', '写作专项', 'Writing'],
    ['translation', '🀄', '翻译专项', 'Translation'],
    ['mock', '⏱', '冲刺模考', 'Mock Exam'],
    ['realexam', '📜', '真题中心', 'Past Papers'],
    ['wordbook', '⭐', '生词本', 'Word Book']
  ];
  const TITLES = { home: '首页看板', welcome: '选择备考级别', placement: '入学水平测试', vocab: '核心词汇记忆系统', listening: '听力专项 · 真题原音精听', reading: '阅读专项训练', writing: '写作专项 · AI 批改', translation: '翻译专项训练', mock: '冲刺模考', realexam: '真题中心 · 资源与本地库', wordbook: '生词本' };

  App.currentView = 'home';
  App.EXAM_NAMES = { cet4: '四级', cet6: '六级' };
  App.examName = function () { return App.EXAM_NAMES[App.store.profile.exam] || ''; };
  /* 未选定级别/未完成入学测试时，除引导流程外的页面一律重定向 */
  App.onboardDone = function () { return !!App.store.profile.exam && !!App.store.profile.placed; };
  App.go = function (name, param) {
    if (!App.Views[name]) return;
    if (!App.onboardDone() && name !== 'welcome' && name !== 'placement') {
      name = App.store.profile.exam ? 'placement' : 'welcome';
      App.toast('请先完成级别选择与入学测试');
    }
    App.currentView = name;
    const el = document.getElementById('view');
    el.innerHTML = '';
    el.dataset.src = name;
    window.scrollTo(0, 0);
    document.getElementById('viewTitle').textContent = TITLES[name] || name;
    document.querySelectorAll('#nav .nav-item').forEach(n => n.classList.toggle('active', n.dataset.v === name));
    // 视图内部瞬态状态（tab/会话）在路由切换时重置
    if (App.Views[name].reset) { try { App.Views[name].reset(); } catch (e) {} }
    try { App.Views[name].render(el, param); }
    catch (e) {
      console.error(e);
      el.innerHTML = '<div class="card"><div class="empty"><div class="big">😵</div>页面加载出错：' + App.esc(e.message) + '<br><br><button class="btn" onclick="App.go(\'home\')">返回首页</button></div></div>';
    }
    paintTop();
    paintNavCount();
  };

  function paintTop() {
    const sec = App.dayStat().sec || 0;
    const streak = App.streak();
    const examChip = App.store.profile.exam ? '<span class="chip">' + App.examName() + '</span>' : '';
    document.getElementById('topRight').innerHTML =
      examChip +
      '<span class="chip">今日 ' + App.fmtSec(sec) + '</span>' +
      (streak > 0 ? '<span class="chip fire">🔥 连续 ' + streak + ' 天</span>' : '<span class="note">今日学习满10分钟即打卡</span>');
  }

  function paintNavCount() {
    const plan = App.planToday();
    const due = plan.revTotal - plan.revDone + plan.newTotal - plan.newDone;
    document.querySelectorAll('#nav .nav-item').forEach(n => {
      let c = n.querySelector('.cnt');
      if (n.dataset.v === 'vocab' && due > 0 && App.store.profile.placed) {
        if (!c) { c = document.createElement('span'); c.className = 'cnt'; n.appendChild(c); }
        c.textContent = due;
      } else if (c) c.remove();
    });
  }

  function buildNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = NAV.map(([id, ico, cn, en]) =>
      '<button class="nav-item" data-v="' + id + '"><span class="ico">' + ico + '</span><span>' + cn + '</span></button>').join('');
    nav.querySelectorAll('.nav-item').forEach(b => b.onclick = () => App.go(b.dataset.v));
    document.getElementById('sideFoot').innerHTML = '本地离线运行 · 数据存于本机<br><span style="opacity:.6">四六级智学 v' + App.VERSION + '</span>';
  }

  /* 学习时长心跳：页面可见时每 15 秒计 15 秒 */
  function startHeartbeat() {
    setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      const d = App.dayStat();
      d.sec = (d.sec || 0) + 15;
      App.save();
      paintTop();
    }, 15000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') paintTop(); });
  }

  function init() {
    App.load();
    // 旧数据迁移：已完成定级的老用户默认为六级
    if (App.store.profile.placed && !App.store.profile.exam) App.store.profile.exam = 'cet6';
    // 每日自动补充智能生成题源（每天首次打开补充 1 阅读 + 1 选词）
    try { if (App.Gen && App.Gen.autoSupply) App.Gen.autoSupply(); } catch (e) {}
    buildNav();
    App.dict.init();
    startHeartbeat();
    App.go(App.onboardDone() ? 'home' : 'welcome');
    window.addEventListener('beforeunload', App._saveNow);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<script>/* ===== E2E 测试套件 =====
   由测试驱动器（node 端）fetch + eval 注入页面后执行。
   每个用例独立一个 evaluate 调用（≤3s）；需要干净状态时由驱动器先 reset+reload。 */
window.__E2E = {
  cases: [],
  results: [],
  add(name, fn) { this.cases.push({ name, fn }); },
  reset() {
    // 暂停自动保存，防止 beforeunload 把旧数据写回
    try { App._noSave = true; App.save = function () {}; App._saveNow = function () {}; } catch (e) {}
    localStorage.removeItem('cet6app_v1');
  },
  async runOne(idx) {
    const c = this.cases[idx];
    const t0 = Date.now();
    try { await c.fn(); this.results.push({ name: c.name, pass: true, ms: Date.now() - t0 }); }
    catch (e) { this.results.push({ name: c.name, pass: false, msg: String((e && e.message) || e), ms: Date.now() - t0 }); }
    return this.results[this.results.length - 1];
  }
};
(function (T) {
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const viewText = () => $('#view').innerText.replace(/\n+/g, ' | ');
  const assert = (cond, msg) => { if (!cond) throw new Error('断言失败: ' + msg); };

    click(sel) { const el = $(sel); if (!el) throw new Error('找不到元素 ' + sel); el.click(); },

    window.__TEST_FAST__ = false;

  });

  T.add('P-02 全部点选后自动交卷出成绩', async () => {

  T.add('P-03 交卷后逐词展示正确/错误回顾', async () => {

  T.add('R1-04 已定级用户刷新后直达首页看板', () => {

  });

  T.add('R1-05 切换到四级会要求重新测试且题库调整', async () => {

    App.go('welcome');

    assert(viewText().includes('四级· 入学水平测试'), '应标注四级');
    H.click('#startBtn');
    await H.answerPlacement();
    H.click('#applyBtn');
    H.expectView('home');

  });

  T.add('R1-06 未完成测试时访问功能页被重定向回引导', () => {

    App.store.profile.placed = true;    // 还原
    App.go('home');
    H.expectView('home');
  });

  T.makeWav = function () {
    // 生成 1 秒 8kHz 16bit 单声道正弦波 WAV（Blob），用于 IndexedDB 回环测试
    const sr = 8000, n = sr, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / sr * 440 * 2 * Math.PI) * 12000, true);
    return new Blob([buf], { type: 'audio/wav' });
  };

  T.add('DS-01 备份导入深度校验（坏数据被拒/好数据通过）', async () => {
    const bad1 = new Blob(['not json'], { type: 'application/json' });
    const bad2 = new Blob([JSON.stringify({ version: 1 })], { type: 'application/json' });
    const bad3 = new Blob([JSON.stringify({ version: 1, profile: {}, srs: { word: { b: 'x' } }, days: {} })], { type: 'application/json' });
    const ok = new Blob([JSON.stringify({ version: 1, profile: { exam: 'cet6' }, srs: { word: { b: 1, due: 0, c: 1, w: 0 } }, days: {}, essays: [], translations: [], mocks: [], exprs: [], practice: {} })], { type: 'application/json' });
    const toFile = b => new File([b], 't.json');
    let toasts = [];
    const oldToast = App.toast;
    App.toast = m => toasts.push(String(m));
    const oldConfirm = window.confirm; window.confirm = () => false; // 拒绝覆盖
    App.importBackup(toFile(bad1));
    App.importBackup(toFile(bad2));
    App.importBackup(toFile(bad3));
    await new Promise(r => setTimeout(r, 50));
    assert(toasts.some(t => t.includes('不是有效的 JSON')), '坏 JSON 应被拒');
    assert(toasts.some(t => t.includes('缺少 profile')), '缺字段应被拒');
    assert(toasts.some(t => t.includes('结构异常')), 'srs 异常应被拒');
    toasts = [];
    let exported = 0;
    const oldExport = App.exportBackup;
    App.exportBackup = () => { exported++; };
    window.confirm = () => true; // 允许覆盖（真实场景用户点确定）
    App.importBackup(toFile(ok), () => {});
    for (let w = 0; w < 40 && !toasts.some(x => x.includes('导入成功')); w++) await new Promise(r => setTimeout(r, 30));
    App.toast = oldToast; window.confirm = oldConfirm; App.exportBackup = oldExport;
    assert(exported >= 1, '确认导入前应自动导出应急备份');
    assert(toasts.some(t => t.includes('导入成功')), '合法备份应导入成功');
    assert(App.store.profile.exam === 'cet6', '导入后数据生效');
    App.store.customWords = App.store.customWords || [];
  });

  T.add('RD6 仔细阅读对标真题难度', () => {
    for (const s of (window.READING_CAREFUL || [])) {
      const words = s.text.split(/\s+/).filter(x => /[a-zA-Z]/.test(x)).length;
      const sents = s.text.split(/[.!?]+/).filter(x => x.trim().split(/\s+/).length > 5);
      const avg = Math.round(words / Math.max(1, sents.length));
      assert(words >= 360, s.id + ' 词数应≥360，实际 ' + words);
      assert(avg >= 18, s.id + ' 平均句长应≥18词，实际 ' + avg);
      assert(s.questions.length === 5, s.id + ' 应5题');
      const expOk = s.questions.every(q => q.exp && q.exp.length >= 40);
      assert(expOk, s.id + ' 每题应有详细中文解析');
      const stems = s.questions.map(q => q.q.toLowerCase()).join(' ');
      const hasPurposeOrInfer = /in order to|inferred|closest in meaning|suggests/.test(stems);
      assert(hasPurposeOrInfer, s.id + ' 应含推断/词义/目的题型');
    }
  });

    const bank = window.TRANSLATION_SENTENCES || [];

    bank.forEach((s, i) => {
      assert(s.cn && s.ref && s.keys.length >= 2, '第' + (i + 1) + '句结构不完整');

  /* ---------- v1.8.1：回忆式复习模式 ---------- */
  T.add('RV-01 复习流程为回忆式（看词-自评-翻面-确认）', async () => {
    App.store.profile.placed = true;
    App.store.profile.exam = 'cet6';
    App.store.profile.dailyNew = 2;
    App.dayStat().newW = 0;
    const words = App.allWords().slice(0, 2);
    words.forEach(w => { App.store.srs[w.w] = { b: 1, due: Date.now() - 1000, c: 1, w: 0 }; });
    App.store.genLastDate = App.today();
    App.go('vocab');
    await new Promise(r => setTimeout(r, 100));
    const start = document.querySelector('#startAll');
    if (!start) {
      // 可能任务面板没渲染，强制进入
      App.go('vocab');
      await new Promise(r => setTimeout(r, 100));
    }
    const start2 = document.querySelector('#startAll');
    if (!start2) throw new Error('startAll not found after go(vocab)');
    start2.click();
    await new Promise(r => setTimeout(r, 500));
    const card = document.querySelector('#cardBox .flashcard');
    if (!card) {
      const txt = document.querySelector('#vBody') ? document.querySelector('#vBody').innerText.slice(0, 200) : 'no vBody';
      throw new Error('no flashcard after start. vBody: ' + txt);
    }
    const fw = card.querySelector('.fw');
    if (!fw || fw.textContent.trim().length < 2) throw new Error('no word shown');
    const fg = card.querySelector('.fg');
    if (fg && fg.textContent.trim().length > 2) throw new Error('meaning should not be visible initially');
    const rateBtns = document.querySelectorAll('#selfRate [data-r]');
    if (rateBtns.length !== 3) throw new Error('expected 3 self-rate buttons, got ' + rateBtns.length);
    if (document.querySelector('#confirmNext')) throw new Error('confirmNext should not exist before self-assessment');
    rateBtns[0].click();
    await new Promise(r => setTimeout(r, 200));
    const reveal = document.querySelector('#revealArea');
    if (!reveal || reveal.style.display === 'none') throw new Error('revealArea should be visible after self-assessment');
    const confirmNext = document.querySelector('#confirmNext');
    if (!confirmNext) throw new Error('confirmNext not found after reveal');
    confirmNext.click();
    await new Promise(r => setTimeout(r, 200));
    if (!document.querySelector('#cardBox .flashcard')) throw new Error('should advance to next card');
  });
