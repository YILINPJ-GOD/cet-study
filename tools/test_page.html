<script>/* ===== 入学水平测试：20题 / 5分钟 / 选完自动跳题 / 交卷后逐词回顾 ===== */
App.Views.placement = App.Views.placement || {};
(function () {
  let state = null; // {qs, idx, answers, left, timer, spokenIdx, locked}

  function build() {
    const words = App.allWords();
    const pick = (tier, n) => App.randPick(words.filter(w => w.tier === tier), n);
    const exam = App.store.profile.exam || 'cet6';
    // 题型配比：12 词义 + 4 短语 + 4 句子语境 = 20 题
    const wordMix = exam === 'cet4'
      ? [['t4c', 6], ['t4h', 4], ['t4s', 2]]
      : [['t4c', 3], ['t4h', 2], ['t6h', 4], ['t6s', 3]];
    const qs = wordMix.reduce((acc, [tier, n]) => acc.concat(pick(tier, n)), []).map(entry => {
      const ds = App.glossDistractors(entry, 3);
      const opts = App.shuffle([entry].concat(ds)).map(e => e.gloss);
      return { kind: 'word', w: entry.w, gloss: entry.gloss, tier: entry.tier, opts, answer: opts.indexOf(entry.gloss) };
    });
    // 短语题
    const phrases = window.PLACEMENT_PHRASES || [];
    App.shuffle(phrases).slice(0, 4).forEach(p => {
      const ds = App.randPick(phrases.filter(x => x !== p), 3).map(x => x[1]);
      const opts = App.shuffle([p[1]].concat(ds));
      qs.push({ kind: 'phrase', w: p[0], gloss: p[1], opts, answer: opts.indexOf(p[1]) });
    });
    // 句子语境题：从真题风格例句库取词，考"句中含义"（不足则跳过）
    const sentWords = App.randPick(Object.keys(window.EXAMPLES || {}), 8);
    sentWords.forEach(w => {
      if (qs.length >= 20) return;
      const entry = App.WMAP()[w];
      const ex = (window.EXAMPLES || {})[w];
      if (!entry || !ex) return;
      const ds = App.glossDistractors(entry, 3);
      const opts = App.shuffle([entry].concat(ds)).map(e => e.gloss);
      qs.push({ kind: 'sent', w: w, gloss: entry.gloss, sent: ex[0], opts, answer: opts.indexOf(entry.gloss) });
    });
    // 兜底：因个别例句词缺失不足 20 题时，用单词题补齐
    const usedW = new Set(qs.map(q => q.w));
    while (qs.length < 20) {
      const extra = pick(wordMix[qs.length % wordMix.length][0], 1)[0];
      if (!extra || usedW.has(extra.w)) {
        const anyW = App.randPick(words.filter(w => !usedW.has(w.w)), 1)[0];
        if (!anyW) break;
        const ds = App.glossDistractors(anyW, 3);
        const opts = App.shuffle([anyW].concat(ds)).map(e => e.gloss);
        qs.push({ kind: 'word', w: anyW.w, gloss: anyW.gloss, tier: anyW.tier, opts, answer: opts.indexOf(anyW.gloss) });
        usedW.add(anyW.w);
        continue;
      }
      const ds = App.glossDistractors(extra, 3);
      const opts = App.shuffle([extra].concat(ds)).map(e => e.gloss);
      qs.push({ kind: 'word', w: extra.w, gloss: extra.gloss, tier: extra.tier, opts, answer: opts.indexOf(extra.gloss) });
      usedW.add(extra.w);
    }
    return qs.slice(0, 20);
  }

  App.Views.placement.kinds = function () { return state && state.qs ? state.qs.map(q => q.kind) : null; };
  App.Views.placement.state = function () { return state; };
  App.Views.placement.debugBuild = function () { return build(); };

  function result(s) {
    const KIND_LABEL = { word: '单词', phrase: '短语', sent: '语境' };
    const byLv = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
    s.qs.forEach((q, i) => {
      const lv = (App.TIERS[q.tier] || {}).lv;
      if (!lv) return;   // 短语/语境题不计入分档统计
      byLv[lv][1]++;
      if (s.answers[i] === q.answer) byLv[lv][0]++;
    });
    const total = s.answers.filter((a, i) => a === s.qs[i].answer).length;
    // 逐词回顾：每题的正确/错误明细
    const review = s.qs.map((q, i) => ({
      w: q.w,
      kind: KIND_LABEL[q.kind] || '单词',
      sent: q.sent || null,
      ok: s.answers[i] === q.answer,
      your: s.answers[i] == null ? '未作答' : q.opts[s.answers[i]],
      correct: q.opts[q.answer]
    }));
    let lv, label, desc;
    if (total <= 8) { lv = 1; label = '基础起步'; desc = '建议从「常用」档开始背，每天 8 个新词，稳步打牢地基。'; }
    else if (total <= 14) { lv = 2; label = '进阶提升'; desc = '建议从「高频」档开始背，每天 12 个新词，重点突破高频词。'; }
    else { lv = 3; label = '冲刺强化'; desc = '基础扎实！建议从「冲刺」档开始，每天 15 个新词，向高分冲刺。'; }
    const dailyNew = App.LV[lv].dailyNew;
    return { total, byLv, lv, label, desc, dailyNew, review };
  }

  const V = App.Views.placement;
  V.reset = function () { if (state && state.timer) clearInterval(state.timer); state = null; };
  V.render = function (el) {
    if (state && state.mode === 'testing') { renderTest(el); return; }
    if (state && state.mode === 'done') { renderResult(el, state.r, false); return; }
    const p = App.store.profile;
    el.innerHTML = `
      <div class="card" style="max-width:640px;margin:30px auto;text-align:center;padding:36px">
        <div style="font-size:44px">🧭</div>
        <h2 style="margin:10px 0 6px">${App.examName() ? App.examName() + '· ' : ''}入学水平测试</h2>
        <p style="color:var(--ink2)">20 道高频词释义选择题 · 限时 5 分钟 · 选完自动跳下一题 · 到时自动交卷<br>测完为你定级，并生成专属每日背词计划；交卷后可逐词回顾对错</p>
        <div class="grid3" style="margin:18px 0;text-align:left">
          <div class="stat-card"><div class="num" style="font-size:20px">20<small> 题</small></div><div class="lab">四选一 · 选中文释义</div></div>
          <div class="stat-card"><div class="num" style="font-size:20px">5<small> 分钟</small></div><div class="lab">超时自动交卷</div></div>
          <div class="stat-card"><div class="num" style="font-size:20px">3<small> 档</small></div><div class="lab">常用 / 高频 / 冲刺</div></div>
        </div>
        ${p.placed ? `<div class="note" style="margin-bottom:12px">当前定级：${App.lvTierLabel(p.startLevel) || App.examName()} · 每日 ${p.dailyNew} 新词（重新测试会更新计划，已背词不受影响）</div>` : ''}
        <button class="btn big" id="startBtn">开始测试</button>
        <div style="margin-top:14px"><button class="btn plain sm" id="switchExam">← 返回重新选择级别（四级 / 六级）</button></div>
      </div>`;
    el.querySelector('#switchExam').onclick = () => { V.reset(); App.go('welcome'); };
    el.querySelector('#startBtn').onclick = () => {
      state = { mode: 'testing', qs: build(), idx: 0, answers: new Array(20).fill(null), left: 300, spokenIdx: -1, locked: false };
      state.answers = new Array(state.qs.length).fill(null);
      renderTest(el);
    };
  };

  function renderTest(el) {
    const s = state;
    el.innerHTML = `
      <div class="card" style="max-width:680px;margin:20px auto">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <b>第 ${s.idx + 1} / ${s.qs.length} 题</b>
          <span style="display:flex;gap:10px;align-items:center">
            <span class="note">点选释义后自动进入下一题</span>
            <span class="timer" id="tLeft">05:00</span>
          </span>
        </div>
        <div class="progress" style="margin-bottom:18px"><i style="width:${s.idx / s.qs.length * 100}%"></i></div>
        <div id="qBox"></div>
        <div style="display:flex;justify-content:space-between;margin-top:16px;align-items:center">
          <span class="note">已答 ${s.answers.filter(a => a != null).length} / ${s.qs.length}</span>
          <button class="btn plain sm" id="finishEarly">提前交卷</button>
        </div>
      </div>`;
    const qBox = el.querySelector('#qBox');
    const paint = () => {
      const q = s.qs[s.idx];
      const KIND_LABEL = { word: '单词释义', phrase: '短语辨析', sent: '句子语境选义' };
      let stem;
      if (q.kind === 'sent') {
        // 句子语境：目标词加粗高亮
        const re = new RegExp('\\b' + q.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*', 'i');
        const marked = App.esc(q.sent).replace(re, m => '<b style="color:var(--pri)">' + m + '</b>');
        stem = `<div class="passage" style="max-height:none;margin:6px 0 10px;font-style:italic">${marked}</div>
          <div style="text-align:center"><b style="font-size:22px;color:var(--pri)">${q.w}</b></div>
          <div class="note" style="text-align:center;margin:4px 0 10px">【${KIND_LABEL[q.kind]}】句中该词的含义最接近</div>`;
      } else {
        stem = `<div style="text-align:center;font-size:${q.kind === 'phrase' ? 26 : 30}px;font-weight:800;margin:14px 0 4px">${App.esc(q.w)} <button class="ico-btn" id="spk" title="点击重听">🔊</button></div>
          <div class="note" style="text-align:center;margin-bottom:14px">【${KIND_LABEL[q.kind]}】${q.kind === 'sent' ? '' : '选出正确的中文释义'}</div>`;
      }
      qBox.innerHTML = stem +
        q.opts.map((o, i) => `<div class="opt ${s.answers[s.idx] === i ? 'sel' : ''}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${App.esc(o)}</span></div>`).join('');
      qBox.querySelectorAll('.opt').forEach(o => o.onclick = () => pickOption(+o.dataset.i));
      const spk = qBox.querySelector('#spk');
      if (spk) spk.onclick = () => App.speak(q.w);
      // 单词首次出现自动朗读
      if (s.spokenIdx !== s.idx) { s.spokenIdx = s.idx; App.speak(q.w); }
    };
    const pickOption = (i) => {
      if (s.locked) return;
      s.locked = true;
      s.answers[s.idx] = i;
      // 选中高亮反馈
      qBox.querySelectorAll('.opt').forEach((o, j) => o.classList.toggle('sel', j === i));
      const delay = window.__TEST_FAST__ ? 15 : 320;
      setTimeout(() => {
        s.locked = false;
        if (s.idx < s.qs.length - 1) { s.idx++; renderTest(el); }
        else finish(el);
      }, delay);
    };
    paint();
    el.querySelector('#finishEarly').onclick = () => {
      if (s.answers.includes(null) && !App.confirmBox('还有 ' + s.answers.filter(a => a == null).length + ' 题未作答，确定提前交卷吗？')) return;
      finish(el);
    };
    if (s.timer) clearInterval(s.timer);
    const tEl = el.querySelector('#tLeft');
    tEl.textContent = App.mmss(s.left);
    s.timer = setInterval(() => {
      s.left--;
      if (tEl.isConnected) tEl.textContent = App.mmss(s.left);
      if (s.left <= 0) { clearInterval(s.timer); App.toast('时间到，自动交卷'); finish(el); }
    }, 1000);
  }

  function finish(el) {
    if (state.timer) clearInterval(state.timer);
    try { speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
    const r = result(state);
    state = { mode: 'done', r };
    renderResult(el, r, true);
  }

  function renderResult(el, r, isNew) {
    const right = r.review.filter(x => x.ok).length, wrong = r.review.length - right;
    el.innerHTML = `
      <div class="card" style="max-width:640px;margin:30px auto;text-align:center;padding:34px">
        <div style="font-size:40px">${isNew ? '🎉' : '🧭'}</div>
        <h2 style="margin:8px 0 2px">答对 ${r.total} / 20 题</h2>
        <div style="margin:4px 0 12px">
          <span class="badge lv${r.lv}" style="font-size:14px;padding:3px 14px">定级：${r.label} · 从「${App.lvTierLabel(r.lv)}」档开始</span>
        </div>
        <div class="grid3" style="margin:16px 0;text-align:center">
          ${[1, 2, 3].map(l => `<div class="stat-card"><div class="num" style="font-size:20px">${r.byLv[l][0]}<small>/${r.byLv[l][1]}</small></div><div class="lab">${App.LV[l].name}档词汇正确</div></div>`).join('')}
        </div>
        <p style="color:var(--ink2)">${r.desc}</p>
        <div class="note" style="margin:8px 0 16px">将为你生成计划：每天背 <b>${r.dailyNew}</b> 个新词 + 复习到期词汇（可随时在首页调整）</div>
        <button class="btn big" id="applyBtn">生成我的学习计划 →</button>
        <button class="btn plain" id="redoBtn" style="margin-left:8px">重新测试</button>
      </div>
      <div class="card" style="max-width:680px;margin:0 auto 30px">
        <h3>📋 逐词回顾 <span class="sub">答对 ${right} · 答错 ${wrong} · 点击单词可听发音</span></h3>
        ${r.review.map((x, i) => `
          <div class="list-row" style="cursor:pointer" data-sp="${x.w}">
            <span class="badge ${x.ok ? 'ok' : 'bad'}" style="min-width:44px;text-align:center">${x.ok ? '✓ 对' : '✗ 错'}</span>
            <div style="flex:1;min-width:0">
              <b>${App.esc(x.w)}</b> <span class="tag">${x.kind}</span>
              ${x.ok ? `<span class="note">${App.esc(x.correct)}</span>`
                : `<div class="note">你的选择：${App.esc(x.your)}<br>正确释义：<b style="color:var(--ok)">${App.esc(x.correct)}</b></div>`}
              ${x.sent ? `<div class="note" style="font-style:italic;opacity:.8">原句：${App.esc(x.sent)}</div>` : ''}
            </div>
            <button class="ico-btn" data-sp2="${x.w}">🔊</button>
          </div>`).join('')}
        <div class="note" style="margin-top:10px">💡 答错的词建议点「＋生词本」或在词汇系统的词库里搜索单独巩固。</div>
      </div>`;
    el.querySelector('#applyBtn').onclick = () => {
      App.store.profile.placed = true;
      App.store.profile.startLevel = r.lv;
      App.store.profile.dailyNew = r.dailyNew;
      App.save();
      state = null;
      App.toast('计划已生成，开始学习吧！');
      App.go('home');
    };
    el.querySelector('#redoBtn').onclick = () => { state = null; V.render(el); };
    el.querySelectorAll('[data-sp]').forEach(row => row.onclick = () => App.speak(row.dataset.sp));
  }
})();
</script>
<script>/* ===== 词汇记忆系统：SRS 任务 / 词库浏览 / 速刷 / 统计 ===== */
App.Views.vocab = App.Views.vocab || {};
(function () {
  let tab = 'task';
  let session = null;   // {queue:[{entry, isNew, quiz?}], idx, ok, total}
  let flash = null;     // {stack:[entry], idx, flipped}

  const V = App.Views.vocab;
  V.reset = function () { tab = 'task'; session = null; flash = null; rootQuiz = null; };
  V.render = function (el) {
    el.innerHTML = '<div class="tabs">' +
      [['task', '🎯 今日任务'], ['bank', '📖 词库'], ['roots', '🧩 词根词缀'], ['flash', '⚡ 速刷'], ['stat', '📊 统计']]
        .map(([k, t]) => '<button class="tab ' + (tab === k ? 'active' : '') + '" data-t="' + k + '">' + t + '</button>').join('') + '</div><div id="vBody"></div>';
    el.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; session = null; rootQuiz = null; V.render(el); });
    const body = el.querySelector('#vBody');
    if (tab === 'task') renderTask(body);
    else if (tab === 'bank') renderBank(body);
    else if (tab === 'roots') renderRoots(body);
    else if (tab === 'flash') renderFlash(body);
    else renderStat(body);
  };

  /* ---------- 今日任务 ---------- */
  function renderTask(el) {
    const plan = App.planToday();
    if (!App.store.profile.placed) {
      el.innerHTML = '<div class="card"><div class="empty"><div class="big">🧭</div>先花 5 分钟做入学测试，我会为你定级并安排每天的背词任务。<br><br><button class="btn" onclick="App.go(\'placement\')">去测试</button></div></div>';
      return;
    }
    if (session) { renderSession(el); return; }
    const news = App.newWords();
    const due = App.dueWords();
    el.innerHTML = `
      <div class="card">
        <h3>今日任务 <span class="sub">${App.today()} · 按间隔重复算法安排</span></h3>
        <div class="grid2">
          <div class="stat-card"><div class="num">${plan.newDone}<small> / ${plan.newTotal}</small></div><div class="lab">今日新词（还剩 ${plan.newTotal - plan.newDone} 个）</div></div>
          <div class="stat-card"><div class="num">${plan.revDone}<small> / ${plan.revTotal}</small></div><div class="lab">今日复习（到期 ${due.length} 个）</div></div>
        </div>
        ${news.length + due.length === 0 ? '<div class="empty" style="padding:26px">🎉 今日任务已完成！<br>可以到「词库」预习、去「速刷」巩固，或练一篇阅读。</div>' :
        `<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
          <button class="btn big" id="startAll">开始学习（新词 ${news.length} + 复习 ${due.length}）</button>
          ${due.length ? '<button class="btn ghost" id="startRev">只复习</button>' : ''}
          ${news.length ? '<button class="btn ghost" id="startNew">只学新词</button>' : ''}
        </div>`}
      </div>
      <div class="card"><h3>记忆机制</h3>
      <div class="note">每个词按 <b>认识 → 1天后 → 2天 → 4天 → 8天 → 15天 → 30天</b> 的间隔重复安排复习，答错立即回到队首重新记。新词先看卡片，再进入四种考查轮换：英译中 · 中译英 · 拼写 · 听音辨词。</div></div>`;
    const start = (mode) => {
      const q = [];
      if (mode !== 'new') due.forEach(w => q.push({ entry: App.WMAP()[w], isNew: false }));
      if (mode !== 'rev') news.forEach(e => q.push({ entry: e, isNew: true }));
      session = { queue: q, idx: 0, ok: 0, newDone: 0 };
      renderSession(el);
    };
    const b1 = el.querySelector('#startAll'); if (b1) b1.onclick = () => start('all');
    const b2 = el.querySelector('#startRev'); if (b2) b2.onclick = () => start('rev');
    const b3 = el.querySelector('#startNew'); if (b3) b3.onclick = () => start('new');
  }

  function renderSession(el) {
    const s = session;
    if (s.idx >= s.queue.length) return renderSessionDone(el);
    const item = s.queue[s.idx];
    const e = item.entry;
    const ex = window.EXAMPLES && window.EXAMPLES[e.w];
    el.innerHTML = `
      <div class="card" style="max-width:640px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span class="badge lv${e.lv}">${App.LV[e.lv].name}档 · ${item.isNew ? '新词' : '复习'} ${s.idx + 1}/${s.queue.length}</span>
          <button class="btn plain sm" id="quit">结束并保存</button>
        </div>
        <div id="cardBox"></div>
      </div>`;
    el.querySelector('#quit').onclick = () => { session = null; V.render(el); };
    const box = el.querySelector('#cardBox');

    if (item.isNew && !item.quiz) {
      // 新词学习卡
      App.speak(e.w);   // 单词第一次出现自动朗读
      box.innerHTML = `
        <div class="flashcard" style="cursor:default">
          <div class="fw">${e.w} <button class="ico-btn" id="spk">🔊</button></div>
          <div class="fi">/${e.ipa}/ · ${e.pos}</div>
          <div class="fg">${e.gloss}</div>
          ${ex ? '<div class="fe">' + App.esc(ex[0]) + '<br>' + App.esc(ex[1]) + '</div>' : ''}
          <div class="hint">记住后选择下方按钮，这个词将按间隔重复安排复习</div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
          <button class="btn" style="background:var(--ok)" id="easy">😊 认识了</button>
          <button class="btn plain" id="hard">😅 有点难</button>
        </div>`;
      box.querySelector('#spk').onclick = () => App.speak(e.w);
      box.querySelector('#easy').onclick = () => { App.srsReview(e.w, true); App.recordVocab(true, true); next(el); };
      box.querySelector('#hard').onclick = () => { App.srsReview(e.w, false); App.recordVocab(true, false); App.dict.addToBook(e.w, '新词-难记'); next(el); };
      } else {
      // ===== 复习：回忆式（看词→自评→翻面→确认）=====
      App.speak(e.w);   // 自动朗读
      const ex = window.EXAMPLES && window.EXAMPLES[e.w];
      const exHtml = ex ? `<div class="fe" style="margin-top:12px;font-style:italic">${App.esc(ex[0])}<br>${App.esc(ex[1])}</div>` : '';
      box.innerHTML = `
        <div class="flashcard" style="cursor:default">
          <div class="fw">${e.w} <button class="ico-btn" id="spk">🔊</button></div>
          <div class="fi">/${e.ipa}/ · ${e.pos}</div>
          <div class="hint" style="margin-top:10px">回忆这个词的意思，然后自评</div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:16px" id="selfRate">
          <button class="btn" style="background:var(--ok);min-width:90px" data-r="know">😊 认识</button>
          <button class="btn plain" style="min-width:90px;border-color:var(--warn);color:var(--warn)" data-r="fuzzy">🤔 模糊</button>
          <button class="btn" style="background:var(--bad);min-width:90px" data-r="forget">😅 忘记</button>
        </div>
        <div id="revealArea" style="margin-top:14px;display:none">
          <div style="background:var(--pri-soft);border-radius:12px;padding:14px 16px;text-align:center">
            <div style="font-size:20px;font-weight:700;color:var(--ink)">${App.esc(e.gloss)}</div>
            ${exHtml}
          </div>
          <div style="display:flex;gap:12px;justify-content:center;margin-top:12px">
            <button class="btn" style="background:var(--ok)" id="confirmNext">✓ 下一个</button>
            <button class="btn plain" id="confirmWrong" style="border-color:var(--bad);color:var(--bad)">✗ 我记错了</button>
          </div>
        </div>`;
      box.querySelector('#spk').onclick = () => App.speak(e.w);
      box.querySelectorAll('#selfRate [data-r]').forEach(btn => btn.onclick = () => {
        // 翻面：显示释义 + 确认按钮
        box.querySelector('#selfRate').style.display = 'none';
        const reveal = box.querySelector('#revealArea');
        reveal.style.display = 'block';
        const rate = btn.dataset.r; // know / fuzzy / forget
        // SRS 评分：know=正确升级，fuzzy=停留当前箱，forget=降回箱0
        const srsOk = rate === 'know';
        const fuzzy = rate === 'fuzzy';
        App.srsReview(e.w, srsOk, fuzzy);
        App.recordVocab(false, srsOk);
        if (!srsOk) s.queue.push({ entry: e, isNew: false }); // 忘记/模糊 → 队尾重做
        if (fuzzy) {
          box.querySelector('#confirmNext').textContent = '↻ 再看一遍';
          box.querySelector('#confirmWrong').textContent = '✓ 我记住了，下一个';
        }

      });

        const answer2 = (ok) => {
          App.srsReview(q.word, ok);

  /* ---------- 词库浏览（按档位筛选 + 自定义词导入） ---------- */
  App.importCustomCSV = function (text) {
    const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    App.store.customWords = App.store.customWords || [];
    // 先清词库缓存，确保去重基于最新词库状态
    App._words = null; App._wmap = null;
    const existing = new Set(App.store.customWords.map(c => c.w));
    // 与主词库/词典已有词去重（重复导入无意义）
    const bank = App.WMAP();
    let added = 0, dup = 0, bad = 0;
    for (const line of lines) {
      // 每行 1-4 列：单词[,音标][,词性][,释义]，支持逗号/中文逗号/Tab 分隔
      const parts = line.split(/[,\t，]/).map(s => s.trim()).filter(s => s !== '');
      if (!parts.length) continue;
      const w = parts[0].toLowerCase().replace(/[^a-z'-]/g, '');
      if (!w || w.length < 2) { bad++; continue; }
      if (existing.has(w) || bank[w]) { dup++; continue; }
      // 音标/词性/释义按列特征识别：斜杠包裹或含 ɑɪʃ 视为音标；以 n./v./adj. 等开头的为词性
      let ipa = '', pos = '', gloss = '';
      for (const p of parts.slice(1)) {
        if (!ipa && /^\/.+\/$/.test(p)) { ipa = p.replace(/\//g, ''); continue; }
        if (!pos && /^(n|v|adj|adv|prep|conj|pron|num|vt|vi|aux)\./i.test(p)) { pos = p; continue; }
        if (!gloss) { gloss = p; continue; }
        gloss += '；' + p;
      }
      App.store.customWords.push({ w, ipa, pos, gloss: gloss || '（自定义词，未附释义）' });
      existing.add(w);
      added++;
    }
    App._words = null; App._wmap = null;
    App.save();
    return { added, dup, bad };
  };

  /* ---------- 词根词缀：浏览 + 拆解推断练习 ---------- */
  let rootQuiz = null;
  function renderRoots(el) {
    const roots = window.WORD_ROOTS || [];
    if (rootQuiz) return renderRootQuiz(el);
    el.innerHTML = `<div class="card">
      <h3>🧩 词根词缀 · 单词拆解 <button class="btn ghost sm" id="rootQuizBtn" style="margin-left:auto">🎮 拆解推断练习</button></h3>
      <div class="note" style="margin:6px 0 10px">一个词根 = 一串单词。先记住词根含义，见到生词拆一拆：前缀（改意思）+ 词根（核心义）+ 后缀（改词性）。词根库共 ${roots.length} 个，前缀 ${Object.keys(window.WORD_PREFIXES || {}).length} 个，后缀 ${Object.keys(window.WORD_SUFFIXES || {}).length} 个。</div>
      <input class="txt" id="rootKw" placeholder="搜索词根/含义/派生词，如 spect、看、inspect…" style="margin-bottom:10px">
      <div class="grid3" id="rootGrid"></div>
      <div id="rootDetail" style="margin-top:14px"></div>
    </div>`;
    const grid = el.querySelector('#rootGrid');
    const detail = el.querySelector('#rootDetail');
    const kwEl = el.querySelector('#rootKw');
    const paintGrid = () => {
      const kw = (kwEl.value || '').trim().toLowerCase();
      const list = roots.filter(r => !kw || r.r.includes(kw) || r.m.includes(kw) || r.ex.some(x => x[0].includes(kw) || (x[1] || '').includes(kw)));
      grid.innerHTML = list.map(r => `<div class="topic-card" data-r="${r.r}">
        <div class="tc-title"><span style="font-family:Georgia,serif;color:var(--pri)">${r.r}</span> <span class="tag">${r.m}</span></div>
        <div class="tc-meta">${r.ex.slice(0, 3).map(x => x[0]).join(' · ')}…</div>
      </div>`).join('') || '<div class="empty">没有匹配的词根</div>';
      grid.querySelectorAll('[data-r]').forEach(c => c.onclick = () => {
        const rr = roots.find(x => x.r === c.dataset.r);
        detail.innerHTML = `<div class="card" style="margin:0">
          <h3><span style="font-family:Georgia,serif;color:var(--pri)">${rr.r}</span> = ${rr.m} <span class="sub">${rr.ex.length} 个派生词</span></h3>
          ${rr.ex.map(x => `<div class="fb-item info"><b>${x[0]}</b><span>${App.esc(x[2] || '')}<br><span class="note">${App.esc(x[1] || (App.WMAP()[x[0]] || {}).gloss || '')}</span></span></div>`).join('')}
        </div>`;
        detail.scrollIntoView({ behavior: 'smooth' });
      });
    };
    kwEl.oninput = paintGrid;
    paintGrid();
    el.querySelector('#rootQuizBtn').onclick = () => {
      const q = makeRootQuiz();
      if (!q) { App.toast('词根数据加载中'); return; }
      rootQuiz = q;
      renderRootQuiz(el);
    };
  }

  function makeRootQuiz() {
    const roots = (window.WORD_ROOTS || []).filter(r => r.ex && r.ex.length);
    if (!roots.length) return null;
    const r = roots[Math.floor(Math.random() * roots.length)];
    const target = r.ex[Math.floor(Math.random() * r.ex.length)];
    const bank = App.WMAP();
    const correct = (bank[target[0]] || {}).gloss || target[1] || '';
    const pool = shuffle2(roots.flatMap(x => x === r ? [] : x.ex)).filter(x => x[0] !== target[0]);
    const opts = shuffle2([[correct, true]].concat(pool.slice(0, 3).map(p => [(bank[p[0]] || {}).gloss || p[1], false])));
    return {
      root: r, word: target[0],
      exp: target[2] || (r.r + ' = ' + r.m),
      opts: opts.map(o => o[0]),
      answer: opts.findIndex(o => o[1])
    };
  }
  function shuffle2(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function renderRootQuiz(el) {
    const q = rootQuiz;
    el.innerHTML = `<div class="card" style="max-width:620px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <button class="btn plain sm" id="backRoots">‹ 返回词根表</button>
        <span class="tag">词根：${q.root.r} = ${q.root.m}</span>
      </div>
      <div class="flashcard" style="cursor:default">
        <div class="fw">${q.word}</div>
        <div class="hint">已知词根 <b style="color:var(--pri)">${q.root.r}</b>（${q.root.m}），推断这个词的含义</div>
      </div>
      <div id="rqOpts">${q.opts.map((o, i) => `<div class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${App.esc(o)}</span></div>`).join('')}</div>
      <div id="rqFb"></div>
    </div>`;
    el.querySelector('#backRoots').onclick = () => { rootQuiz = null; renderRoots(el); };
    el.querySelectorAll('#rqOpts .opt').forEach(o => o.onclick = () => {
      const i = +o.dataset.i;
      const ok = i === q.answer;
      el.querySelectorAll('#rqOpts .opt').forEach((oo, j) => { if (j === q.answer) oo.classList.add('right'); });
      if (!ok) o.classList.add('wrong'); else o.classList.add('right');
      el.querySelectorAll('#rqOpts .opt').forEach(x => x.style.pointerEvents = 'none');
      el.querySelector('#rqFb').innerHTML = `<div class="fb-item ${ok ? 'good' : 'bad'}"><b>${ok ? '✓ 推断正确' : '✗ 应选 ' + 'ABCD'[q.answer]}</b><span>拆解：${App.esc(q.exp)}<br><button class="btn ghost sm" id="nextQ" style="margin-top:6px">下一题 →</button></span></div>`;
      el.querySelector('#nextQ').onclick = () => { rootQuiz = makeRootQuiz(); renderRootQuiz(el); };
    });
  }

  /* ---------- 速刷 ---------- */
  function renderFlash(el) {
    if (!flash || !flash.stack.length) {
      const pool = App.shuffle(App.allWords().filter(w => App.store.srs[w.w] || App.dict.inBook(w.w)));
      el.innerHTML = `<div class="card" style="max-width:560px;margin:20px auto;text-align:center;padding:30px">
        <div style="font-size:40px">⚡</div><h2>碎片速刷</h2>
        <p style="color:var(--ink2)">从你学过和收藏的 ${pool.length} 个词里随机抽卡，点击卡片翻面自评，适合排队、通勤时快速过词。速刷结果同样计入记忆进度。</p>
        ${pool.length ? '<button class="btn big" id="go">开始速刷</button>' : '<div class="note" style="margin:14px 0">还没有可速刷的词，先去「今日任务」学几个词吧。</div>'}
      </div>`;
      const b = el.querySelector('#go'); if (b) b.onclick = () => { flash = { stack: pool.slice(0, 50), idx: 0, flipped: false, ok: 0 }; renderFlash(el); };
      return;
    }
    const f = flash;
    if (f.idx >= f.stack.length) {
      el.innerHTML = `<div class="card" style="max-width:560px;margin:26px auto;text-align:center;padding:34px">
        <div style="font-size:44px">⚡</div><h2>速刷完成</h2><p>共 ${f.stack.length} 张卡 · 自评认识 ${f.ok} 个</p>
        <button class="btn big" id="again">再来一轮</button></div>`;
      el.querySelector('#again').onclick = () => { flash = null; renderFlash(el); };
      return;
    }
    const e = f.stack[f.idx];
    const ex = window.EXAMPLES && window.EXAMPLES[e.w];
    if (!f.flipped) App.speak(e.w);   // 速刷卡正面：单词首次出现自动朗读
    el.innerHTML = `<div class="card" style="max-width:560px;margin:20px auto">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px">
        <span class="badge lv${e.lv}">${App.LV[e.lv].name}档</span><span class="note">${f.idx + 1} / ${f.stack.length}</span>
      </div>
      <div class="flashcard" id="fc">
        ${f.flipped ?
          `<div class="fg" style="font-size:22px">${e.gloss}</div><div class="fi">/${e.ipa}/ · ${e.pos}</div>${ex ? '<div class="fe">' + App.esc(ex[0]) + '<br>' + App.esc(ex[1]) + '</div>' : ''}<div class="hint">这个词你真的记住了吗？</div>` :
          `<div class="fw">${e.w}</div><div class="fi">点击卡片查看释义</div>`}
      </div>
      ${f.flipped ? `<div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
        <button class="btn" style="background:var(--ok)" id="knew">😊 认识</button>
        <button class="btn plain" id="forgot">😅 不认识</button></div>` : ''}
      <div style="text-align:center;margin-top:10px"><button class="btn plain sm" id="skip">跳过</button></div>
    </div>`;
    el.querySelector('#fc').onclick = () => { f.flipped = !f.flipped; renderFlash(el); };
    el.querySelector('#skip').onclick = () => { f.idx++; f.flipped = false; renderFlash(el); };
    const k = el.querySelector('#knew'), fo = el.querySelector('#forgot');
    if (k) k.onclick = () => { App.srsReview(e.w, true); f.ok++; f.idx++; f.flipped = false; App.save(); renderFlash(el); };
    if (fo) fo.onclick = () => { App.srsReview(e.w, false); App.dict.addToBook(e.w, '速刷-不认识'); f.idx++; f.flipped = false; App.save(); renderFlash(el); };
  }

      </div>
      <div class="grid2" style="margin-top:18px">
        <div class="card"><h3>记忆阶段分布</h3>${App.charts.bars({ data: boxes, max: Math.max(10, ...st.boxes) })}</div>
        <div class="card"><h3>今日词汇</h3>
          <div style="display:flex;gap:22px;margin:8px 0 16px">
            <div><div class="num" style="font-size:24px;font-weight:800">${today.newW || 0}</div><div class="note">新词</div></div>
            <div><div class="num" style="font-size:24px;font-weight:800">${today.revW || 0}</div><div class="note">复习</div></div>
          </div>
          <div class="note">「新学」= 刚开始记的词；「30天」= 即将长期掌握。坚持每天清空任务队列，记忆曲线会把你带到长期记忆区。</div>
        </div>
      </div>`;
  }
})();
</script>
<script>/* ===== 听力专项：真题原音播放训练 + 题型分类刷题 ===== */
App.Views.listening = App.Views.listening || {};
App.Listening = {};
(function () {
  const LTYPES = {
    cet4: [
      { key: 'news', name: '短篇新闻', icon: '📰' },
      { key: 'conversation', name: '长对话', icon: '💬' },
      { key: 'passage', name: '听力篇章', icon: '📖' }
    ],
    cet6: [
      { key: 'conversation', name: '长对话', icon: '💬' },
      { key: 'passage', name: '听力篇章', icon: '📖' },
      { key: 'lecture', name: '讲座 / 讲话', icon: '🎤' }
    ]
  };
  const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
  App.Listening.LTYPES = LTYPES;
  App.Listening.allSets = () => (window.LISTENING_CET4 || []).concat(window.LISTENING_CET6 || []);
  App.Listening.speeds = SPEEDS;
  /* 句窗口：返回 [start, end)（秒）；用于逐句循环与高亮。越界索引钳制到已校准范围 */
  App.Listening.sentenceWindow = function (calib, i, dur) {
    const c = calib || [];
    if (!c.length) return [0, dur || 6];
    const idx = Math.max(0, Math.min(i, c.length - 1));
    const start = typeof c[idx] === 'number' ? c[idx] : 0;
    const next = idx + 1 < c.length && typeof c[idx + 1] === 'number' ? c[idx + 1] : null;
    const end = next != null ? next : (dur || start + 6);
    return [start, Math.max(end, start + 0.5)];
  };
  function best(type, id) {
    const recs = (App.store.practice.listening || []).filter(r => r.type === type && r.id === id);
    return recs.length ? Math.max(...recs.map(r => Math.round(r.c / r.t * 100))) : null;
  }
  function record(type, id, c, t) {
    if (!App.store.practice.listening) App.store.practice.listening = [];
    App.store.practice.listening.push({ d: Date.now(), type, id, c, t });
    App.save();
  }

  let S = null; // 练习页状态 {set, calib, sentLoop, sentIdx, abA, abB, showText, showCn, calibMode, audioUrl, tts}

  const V = App.Views.listening;
  V.render = function (el, param) {
    if (param && param.id) return renderPractice(el, param.id);
    if (param && param.type) return renderType(el, param.type);
    renderHome(el);
  };

  function setsOf(exam, type) { return App.Listening.allSets().filter(s => s.exam === exam && s.type === type); }

  function renderHome(el) {
    const exam = App.store.profile.exam || 'cet6';
    const keys = App.audb ? [] : [];
    el.innerHTML = `<div class="card">
      <h3>🎧 听力专项 <span class="sub">${App.examName()} · 真题风格题源 + 原音精听工具</span></h3>
      <div class="note" style="margin-bottom:12px">音频说明：出于版权与离线要求，App 不内置音频。请把你持有的真题听力音频（MP3/M4A 等）通过每套题里的「导入原音」按钮导入，文件会保存在本机数据库中，重启不丢。未导入时可先用「系统朗读演练」熟悉原文（非真题原音）。</div>
      <div class="grid3" id="ltypes">
        ${LTYPES[exam].map(t => {
          const ss = setsOf(exam, t.key);
          const done = (App.store.practice.listening || []).filter(r => ss.some(s => s.id === r.id));
          const acc = done.length ? Math.round(done.reduce((a, r) => a + r.c / r.t, 0) / done.length * 100) : null;
          return `<div class="card" style="cursor:pointer;margin:0" data-type="${t.key}">
            <div style="font-size:28px">${t.icon}</div>
            <h3 style="margin:6px 0 4px">${t.name}</h3>
            <div class="note">${ss.length} 套 · 每套 3-4 题</div>
            <hr class="hr">
            <b style="font-size:13px">${acc == null ? '未开练' : '平均正确率 ' + acc + '%'}</b>
          </div>`;
        }).join('')}
      </div>
      <div class="note" style="margin-top:12px">💡 精听建议：第一遍常速盲听答题 → 第二遍 0.75× 逐句循环跟读 → 第三遍 1.25× 恢复常速检验。先点「校准句起点」把每句时间标出来，逐句循环才可用。</div>
    </div>`;
    el.querySelectorAll('[data-type]').forEach(c => c.onclick = () => V.render(el, { type: c.dataset.type }));
  }

  function renderType(el, type) {
    const exam = App.store.profile.exam || 'cet6';
    const t = LTYPES[exam].find(x => x.key === type) || { name: type, icon: '🎧' };
    const ss = setsOf(exam, type);
    el.innerHTML = `<div class="card"><h3>${t.icon} ${t.name} <button class="btn plain sm" id="back" style="margin-left:auto">‹ 返回</button></h3>
      <div class="grid2">${ss.map(s => {
        const b = best(type, s.id);
        return `<div class="topic-card" data-id="${s.id}">
          <div class="tc-title">${s.title}</div>
          <div class="tc-meta">${s.sentences.length} 句原文 · ${s.questions.length} 题</div>
          <div style="margin-top:8px">
            ${b == null ? '<span class="tag">未做过</span>' : '<span class="badge ' + (b >= 70 ? 'ok' : b >= 50 ? 'warn' : 'bad') + '">最好成绩 ' + b + '%</span>'}
            <span class="tag" data-audio="${s.id}">🔊 检查音频…</span>
          </div>
        </div>`;
      }).join('')}</div></div>`;
    el.querySelector('#back').onclick = () => V.render(el);
    el.querySelectorAll('.topic-card').forEach(c => c.onclick = () => V.render(el, { id: c.dataset.id }));
    // 音频状态标记
    App.audb.keys().then(ks => {
      ks.forEach(k => {
        const tag = el.querySelector('[data-audio="' + k.replace(/^au_/, '') + '"]');
        if (tag) tag.textContent = '✓ 已有原音';
      });
    }).catch(() => {});
  }

  /* ---------- 练习页 ---------- */
  function renderPractice(el, id) {
    const set = App.Listening.allSets().find(s => s.id === id);
    if (!set) return V.render(el);
    S = {
      set, calib: (App.store.calib && App.store.calib[id]) || [],
      sentLoop: false, sentIdx: 0, abA: null, abB: null,
      showText: true, showCn: false, calibMode: false,
      audioUrl: null, ttsOn: false
    };
    el.innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
          <button class="btn plain sm" id="back">‹ 返回</button>
          <b>${set.title}</b><span class="tag">${App.examName()}</span>
          <span class="tag">${(LTYPES[set.exam].find(t => t.key === set.type) || {}).name || set.type}</span>
          <span id="audioState" style="margin-left:auto" class="note">检查音频…</span>
        </div>
        <div id="playerZone"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
          <button class="btn ghost sm" id="tSpeed">变速</button>
          <button class="btn ghost sm" id="tSent">逐句循环：关</button>
          <button class="btn ghost sm" id="tText">原文：显示</button>
          <button class="btn ghost sm" id="tCn">译文：隐藏</button>
          <button class="btn ghost sm" id="tCalib">校准句起点：关</button>
        </div>
        <div id="sentList"></div>
      </div>
      <div class="card" id="qCard"></div>`;

    el.querySelector('#back').onclick = () => { stopAll(); V.render(el, { type: S.set.type }); };
    // 控制条
    el.querySelector('#tSpeed').onclick = cycleSpeed;
    el.querySelector('#tSent').onclick = () => { S.sentLoop = !S.sentLoop; paintBtns(); if (S.sentLoop) jumpToSentence(S.sentIdx); };
    el.querySelector('#tText').onclick = () => { S.showText = !S.showText; paintBtns(); paintSentences(); };
    el.querySelector('#tCn').onclick = () => { S.showCn = !S.showCn; paintBtns(); paintSentences(); };
    el.querySelector('#tCalib').onclick = () => { S.calibMode = !S.calibMode; paintBtns(); paintSentences(); };

    loadAudio();
    paintPlayer();
    paintSentences();
    renderQuestions();
  }

  function stopAll() {
    if (S && S.audioEl) { try { S.audioEl.pause(); } catch (e) {} }
    if (S && S.ttsOn) { try { speechSynthesis.cancel(); } catch (e) {} S.ttsOn = false; }
    if (S && S.audioUrl) { URL.revokeObjectURL(S.audioUrl); S.audioUrl = null; }
  }

  function curAudio() { return S.audioEl || null; }

  function loadAudio() {
    const state = document.getElementById('audioState');
    App.audb.get('au_' + S.set.id).then(blob => {
      if (!blob) {
        state.innerHTML = '<span class="badge warn">未导入原音</span>';
        paintPlayer();
        return;
      }
      S.audioUrl = URL.createObjectURL(blob);
      const au = new Audio(S.audioUrl);
      au.preload = 'metadata';
      au.addEventListener('timeupdate', onTime);
      au.addEventListener('ended', onEnded);
      S.audioEl = au;
      state.innerHTML = '<span class="badge ok">✓ 原音已就绪</span>';
      paintPlayer();
    }).catch(() => { state.textContent = '音频库不可用'; });
  }

  function onTime() {
    const au = curAudio(); if (!au) return;
    const bar = document.getElementById('seek'); if (bar && au.duration) bar.value = au.currentTime / au.duration * 1000;
    const t = document.getElementById('tNow'); if (t) t.textContent = App.mmss(au.currentTime) + ' / ' + (au.duration ? App.mmss(au.duration) : '--:--');
    if (S.sentLoop) {
      const [a, b] = App.Listening.sentenceWindow(S.calib, S.sentIdx, au.duration);
      if (au.currentTime >= b - 0.03 || au.currentTime < a - 0.6) au.currentTime = a;
    }
    if (S.abA != null && S.abB != null && au.currentTime >= S.abB) au.currentTime = S.abA;
    // 高亮当前句
    if (S.calib.length) {
      const rows = document.querySelectorAll('#sentList .sent-row');
      let cur = 0;
      for (let i = 0; i < S.calib.length; i++) if (au.currentTime >= S.calib[i] - 0.2) cur = i;
      rows.forEach((r, i) => r.classList.toggle('cur', i === cur && S.calib[i] != null));
    }
  }

  function onEnded() {
    const au = curAudio(); if (!au) return;
    if (S.sentLoop) { const [a] = App.Listening.sentenceWindow(S.calib, S.sentIdx, au.duration); au.currentTime = a; au.play(); }
  }

  function jumpToSentence(i) {
    const n = S.set.sentences.length;
    S.sentIdx = Math.max(0, Math.min(n - 1, i));
    const au = curAudio();
    if (au && S.calib.length) {
      const [a] = App.Listening.sentenceWindow(S.calib, S.sentIdx, au.duration);
      au.currentTime = a;
      au.play().catch(() => {});
    }
    paintSentences();
  }

  function cycleSpeed() {
    const au = curAudio();
    const cur = au ? au.playbackRate : (S.rate || 1);
    const next = SPEEDS[(SPEEDS.indexOf(Math.round(cur * 100) / 100) + 1) % SPEEDS.length] || 1;
    S.rate = next;
    if (au) au.playbackRate = next;
    paintBtns();
  }

  function paintBtns() {
    const setTxt = (id, txt, active) => { const b = document.getElementById(id); if (b) { b.textContent = txt; b.style.borderColor = active ? 'var(--pri)' : ''; b.style.color = active ? 'var(--pri)' : ''; b.style.fontWeight = active ? '700' : ''; } };
    setTxt('tSpeed', '变速 ' + (S.rate || 1) + '×', (S.rate || 1) !== 1);
    setTxt('tSent', '逐句循环：' + (S.sentLoop ? '开' : '关'), S.sentLoop);
    setTxt('tText', '原文：' + (S.showText ? '显示' : '隐藏(精听)'), !S.showText);
    setTxt('tCn', '译文：' + (S.showCn ? '显示' : '隐藏'), S.showCn);
    setTxt('tCalib', '校准句起点：' + (S.calibMode ? '开' : '关'), S.calibMode);
  }

  function paintPlayer() {
    const zone = document.getElementById('playerZone'); if (!zone) return;
    const au = curAudio();
    if (au) {
      zone.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <button class="btn" id="playBtn">▶ 播放</button>
          <input type="range" id="seek" min="0" max="1000" value="0" style="flex:1;min-width:160px">
          <span class="note mono" id="tNow">00:00 / --:--</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">
          <button class="btn plain sm" id="abA">设 A 点</button>
          <button class="btn plain sm" id="abB">设 B 点</button>
          <button class="btn plain sm" id="abClr">清除AB</button>
          <span class="note" id="abInfo">${S.abA != null ? 'AB复读已开启' : 'AB复读：先在播放中设 A 点，再设 B 点，区间将自动循环'}</span>
          <button class="btn danger sm" id="auDel" style="margin-left:auto">移除本套音频</button>
        </div>`;
      const play = zone.querySelector('#playBtn');
      play.onclick = () => {
        if (au.paused) { au.playbackRate = S.rate || 1; au.play(); play.textContent = '⏸ 暂停'; }
        else { au.pause(); play.textContent = '▶ 播放'; }
      };
      zone.querySelector('#seek').oninput = e => { if (au.duration) au.currentTime = e.target.value / 1000 * au.duration; };
      zone.querySelector('#abA').onclick = () => { S.abA = au.currentTime; S.abB = null; paintPlayer(); };
      zone.querySelector('#abB').onclick = () => { S.abB = Math.max(au.currentTime, (S.abA || 0) + 1); paintPlayer(); };
      zone.querySelector('#abClr').onclick = () => { S.abA = S.abB = null; paintPlayer(); };
      zone.querySelector('#auDel').onclick = async () => {
        if (!App.confirmBox('移除本套已导入的音频文件？')) return;
        await App.audb.del('au_' + S.set.id);
        stopAll(); App.toast('已移除'); V.render(document.getElementById('view'), { id: S.set.id });
      };
    } else {
      zone.innerHTML = `
        <div style="background:#f7f8fd;border:1.5px dashed var(--line);border-radius:12px;padding:14px">
          <b>📢 本套暂无原音</b>
          <div class="note" style="margin:6px 0 10px">导入你持有的真题听力音频（MP3/M4A/WAV），将保存在本机、重启不丢；或先用下方"系统朗读演练"熟悉原文（非真题原音）。</div>
          <input type="file" id="auFile" accept="audio/*" style="display:none">
          <button class="btn" id="auImport">⬆ 导入原音文件</button>
          <button class="btn ghost" id="ttsBtn" style="margin-left:8px">🗣 系统朗读演练</button>
          <button class="btn plain sm" id="ttsStop" style="margin-left:6px;display:none">⏹ 停止朗读</button>
        </div>`;
      const file = zone.querySelector('#auFile');
      zone.querySelector('#auImport').onclick = () => file.click();
      file.onchange = async () => {
        if (!file.files[0]) return;
        try {
          await App.audb.put('au_' + S.set.id, file.files[0]);
          App.toast('原音已导入并保存到本机');
        } catch (e) {
          App.toast('导入失败：' + (e.message || '本地音频存储不可用') + '。可改用系统朗读演练。');
          return;
        }
        V.render(document.getElementById('view'), { id: S.set.id });
      };
      const tts = zone.querySelector('#ttsBtn'), stop = zone.querySelector('#ttsStop');
      tts.onclick = () => {
        S.ttsOn = true; S.sentIdx = 0;
        tts.style.display = 'none'; stop.style.display = '';
        ttsSpeak();
      };
      stop.onclick = () => { S.ttsOn = false; try { speechSynthesis.cancel(); } catch (e) {} tts.style.display = ''; stop.style.display = 'none'; };
    }
  }

  function ttsSpeak() {
    if (!S.ttsOn) return;
    const ss = S.set.sentences;
    if (S.sentIdx >= ss.length) { S.ttsOn = false; paintPlayer(); return; }
    const u = new SpeechSynthesisUtterance(ss[S.sentIdx].en);
    u.lang = 'en-US';
    u.rate = S.rate || 1;
    u.onend = () => {
      if (!S.ttsOn) return;
      S.sentIdx = S.sentLoop ? S.sentIdx : S.sentIdx + 1;
      if (S.sentLoop && S.sentIdx >= ss.length) S.sentIdx = 0;
      paintSentences();
      setTimeout(ttsSpeak, 350);
    };
    speechSynthesis.speak(u);
  }

  function paintSentences() {
    const box = document.getElementById('sentList'); if (!box) return;
    const au = curAudio();
    box.innerHTML = '<h3 style="font-size:13.5px;margin:4px 0 8px">逐句精听 <span class="sub">' + (S.calib.length ? '已校准 ' + S.calib.filter(x => x != null).length + ' 句' : '尚未校准——打开「校准句起点」，播放中逐句点「设为起点」') + '</span></h3>' +
      S.set.sentences.map((sn, i) => {
        const t = S.calib[i] != null ? App.mmss(S.calib[i]) : '--:--';
        const isCur = S.sentLoop && i === S.sentIdx;
        return `<div class="sent-row ${isCur ? 'cur' : ''}" data-si="${i}" style="padding:8px 10px;border-bottom:1px dashed var(--line);border-radius:8px;${isCur ? 'background:var(--pri-soft)' : ''}">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <span class="note mono" style="min-width:44px">${t}</span>
            <div style="flex:1;min-width:0">
              <div class="sent-en" style="${S.showText ? '' : 'filter:blur(5px);cursor:pointer;user-select:none'}" data-i="${i}">${App.esc(sn.en)}</div>
              ${S.showCn ? '<div class="note" style="margin-top:2px">' + App.esc(sn.cn) + '</div>' : ''}
            </div>
            ${S.calibMode ? '<button class="btn plain sm" data-cal="' + i + '">设为起点</button>' :
              (au ? '<button class="btn plain sm" data-loop="' + i + '">循环此句</button>' : '')}
          </div>
        </div>`;
      }).join('');
    box.querySelectorAll('.sent-en').forEach(x => x.onclick = () => { if (!S.showText) { S.showText = true; paintBtns(); paintSentences(); } });
    box.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
      const a = curAudio();
      if (!a) { App.toast('请先导入并播放音频'); return; }
      S.calib[+b.dataset.cal] = Math.round(a.currentTime * 10) / 10;
      App.store.calib = App.store.calib || {};
      App.store.calib[S.set.id] = S.calib;
      App.save();
      paintSentences();
      // 自动播放下一句开头，方便连续校准
      if (S.calib[+b.dataset.cal + 1] == null) { a.currentTime = S.calib[+b.dataset.cal]; a.play().catch(() => {}); }
    });
    box.querySelectorAll('[data-loop]').forEach(b => b.onclick = () => { jumpToSentence(+b.dataset.loop); });
  }

  /* ---------- 模考·听力区：整段材料播放一遍 + 盲听作答 ---------- */
  App.Listening.mockQuestionCount = function (setIds) {
    const all = App.Listening.allSets();
    return setIds.reduce((n, id) => { const s = all.find(x => x.id === id); return n + (s ? s.questions.length : 0); }, 0);
  };
  App.Listening.renderMock = function (body, onSubmit, opts) {
    opts = opts || {};
    const exam = App.store.profile.exam || 'cet6';
    const sets = (opts.setIds || App.Listening.allSets().filter(s => s.exam === exam).map(s => s.id)).map(id => App.Listening.allSets().find(s => s.id === id)).filter(Boolean);
    const M = { setIdx: 0, phase: 'idle', answers: {}, played: {} };
    const totalQ = sets.reduce((n, s) => n + s.questions.length, 0);
    function counted() { return Object.keys(M.answers).length; }

    function paint() {
      const set = sets[M.setIdx];
      if (!set) return finish();
      const hasAudio = M.played[set.id] === 'audio';
      body.innerHTML = `<div class="card">
        <h3>🎧 ${set.title} <span class="sub">第 ${M.setIdx + 1}/${sets.length} 套 · 材料仅播放一遍</span></h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          ${hasAudio ? '<span class="badge ok">✓ 原音已就绪</span>' : ''}
          <button class="btn ${M.played[set.id] ? 'plain' : ''} sm" id="mPlay">${M.played[set.id] ? '↻ 重新播放本套材料' : '▶ 播放本套材料（仅一遍）'}</button>
          ${M.played[set.id] ? '' : '<button class="btn ghost sm" id="mTts">无原音？用朗读播放</button>'}
        </div>
        <div class="note" style="margin-bottom:10px">考试规则：材料连续播放一遍后作答。当前已答 <b>${counted()}</b> / ${totalQ} 题。</div>
        <div id="mQZone"></div>
      </div>`;
      body.querySelector('#mPlay').onclick = () => playSet(set);
      const tts = body.querySelector('#mTts');
      if (tts) tts.onclick = () => playTTS(set);
      paintQuestions();
    }

    function counted2() { return counted(); }

    async function playSet(set) {
      const blob = await App.audb.get('au_' + set.id).catch(() => null);
      if (blob) {
        M.played[set.id] = 'audio';
        const url = URL.createObjectURL(blob);
        const au = new Audio(url);
        M.au = au;
        paint();
        au.play().catch(() => {});
        au.onended = () => { URL.revokeObjectURL(url); unlock(set); };
        return;
      }
      playTTS(set);
    }

    function playTTS(set) {
      M.played[set.id] = M.played[set.id] || 'tts';
      M.setUnlocked = M.setUnlocked || {};
      M.setUnlocked[set.id] = true;
      paint();
      const sns = set.sentences;
      let i = 0;
      const next = () => {
        if (i >= sns.length) return;
        const u = new SpeechSynthesisUtterance(sns[i].en);
        u.lang = App.speakLang(); u.rate = 0.95;
        u.onend = () => { i++; setTimeout(next, 500); };
        try { speechSynthesis.speak(u); } catch (e) {}
      };
      next();
    }

    function unlock(set) {
      M.setUnlocked = M.setUnlocked || {};
      M.setUnlocked[set.id] = true;
      paint();
    }

    function paintQuestions() {
      const zone = body.querySelector('#mQZone');
      let html = '';
      sets.forEach((set, si) => {
        if (si > M.setIdx) return;
        const unlocked = (M.setUnlocked || {})[set.id];
        html += `<div style="margin:6px 0 10px"><b>【第 ${si + 1} 套】${set.title}</b> ${unlocked ? '' : '<span class="note">（播放本套材料后解锁作答）</span>'}</div>`;
        set.questions.forEach((q, qi) => {
          const key = set.id + '#' + qi;
          const val = M.answers[key];
          html += `<div style="margin-bottom:12px"><b>${qi + 1}. ${App.esc(q.q)}</b>` +
            q.opts.map((o, j) => `<div class="opt ${val === j ? 'sel' : ''}" data-key="${key}" data-o="${j}" style="${unlocked ? '' : 'pointer-events:none;opacity:.45'}"><span class="k">${'ABCD'[j]}</span><span>${App.esc(o)}</span></div>`).join('') +
            `</div>`;
        });
      });
      html += `<button class="btn big" id="mSubmit" ${counted() === 0 ? 'disabled' : ''}>提交听力部分（${counted()}/${totalQ}）</button>
        <span class="note" style="margin-left:10px">提交后进入下一考试区，不可返回</span>`;
      zone.innerHTML = html;
      zone.querySelectorAll('.opt').forEach(o => o.onclick = () => {
        M.answers[o.dataset.key] = +o.dataset.o;
        paintQuestions();
      });
      zone.querySelector('#mSubmit').onclick = () => {
        try { speechSynthesis.cancel(); } catch (e) {}
        if (M.au) { try { M.au.pause(); } catch (e) {} }
        finish();
      };
    }

    function finish() {
      let c = 0, t = 0;
      const detail = [];
      sets.forEach(set => {
        set.questions.forEach((q, qi) => {
          const a = M.answers[set.id + '#' + qi];
          t++;
          if (a === q.a) c++;
          detail.push({ set: set.id, q: qi, a: a == null ? null : a, correct: q.a });
        });
      });
      onSubmit({ c, t, detail, total: totalQ });
    }

    paint();
    return { forceSubmit: finish, count: () => totalQ };
  };

  function renderQuestions(reviewSaved) {
    const set = S.set;
    const card = document.getElementById('qCard');
    const locmap = (window.LISTENING_LOC || {})[set.id] || [];
    set.questions.forEach((q, i) => { q.loc = locmap[i] || null; });
    const rev = (App.store.listeningReview || {})[set.id];
    const answers = reviewSaved && rev ? rev.answers.slice() : new Array(set.questions.length).fill(null);
    const locked = !!reviewSaved;
    card.innerHTML = `<h3>听力题目 <span class="sub">${locked ? '🔒 回看模式（' + rev.date + ' · 得 ' + rev.c + '/' + rev.t + '）' : '先盲听作答，再对照解析'}</span></h3>
      ${rev && !locked ? '<button class="btn plain sm" id="seeLast" style="margin-bottom:10px">📋 回看上次作答（' + rev.date + ' · 得 ' + rev.c + '/' + rev.t + '）</button>' : ''}
      ${set.questions.map((q, i) => `<div style="margin-bottom:16px">
        <b>${i + 1}. ${App.esc(q.q)}</b>
        ${q.opts.map((o, j) => `<div class="opt ${locked && answers[i] === j ? (j === q.a ? 'right' : 'wrong') : (!locked && answers[i] === j ? 'sel' : '')}" data-q="${i}" data-o="${j}"><span class="k">${'ABCD'[j]}</span><span>${App.esc(o)}</span></div>`).join('')}
        <div class="fb-item" id="lexp${i}" style="display:none"></div>
      </div>`).join('')}
      ${locked ? `<div class="note">🔒 回看模式：你的选择与正确答案已标注。<button class="btn ghost sm" id="redoFresh">重新做一遍</button> <button class="btn ghost sm" id="locHi">高亮定位句</button></div>`
        : `<button class="btn" id="qSubmit">提交答案</button>`}`;
    // 标注正确/错误并显示解析（提交后或回看模式共用）
    const reveal = (ans) => {
      let c = 0;
      const locAll = new Set();
      set.questions.forEach((q, i) => {
        const ok = ans[i] === q.a;
        if (ok) c++;
        card.querySelectorAll('.opt[data-q="' + i + '"]').forEach(o2 => {
          o2.style.pointerEvents = 'none';
          const j = +o2.dataset.o;
          if (j === q.a) o2.classList.add('right');
          else if (ans[i] === j) o2.classList.add('wrong');
        });
        const exp = card.querySelector('#lexp' + i);
        exp.style.display = 'flex';
        exp.className = 'fb-item ' + (ok ? 'good' : 'bad');
        const locTxt = q.loc && q.loc.length ? ' · 定位句：原文第 ' + q.loc.map(x => x + 1).join('、') + ' 句' : '';
        exp.innerHTML = '<b>' + (ok ? '✓ 正确' : '✗ 你的答案：' + (ans[i] == null ? '未作答 · ' : String.fromCharCode(65 + ans[i]) + ' · ')) + '正确：' + String.fromCharCode(65 + q.a) + '</b><span>' + App.esc(q.exp) + '<span class="note">' + locTxt + '</span></span>';
        (q.loc || []).forEach(x => locAll.add(x));
      });
      // 原文定位句高亮
      document.querySelectorAll('#sentList .sent-row').forEach(r => {
        if (locAll.has(+r.dataset.si)) r.classList.add('loc-hi');
      });
      return c;
    };
    if (locked) {
      reveal(answers);
      card.querySelector('#redoFresh').onclick = () => renderQuestions(false);
      const hi = card.querySelector('#locHi');
      if (hi) hi.onclick = () => {
        document.querySelectorAll('#sentList .sent-row.loc-hi').forEach(r => r.classList.remove('loc-hi'));
        reveal(answers);
        card.scrollIntoView({ behavior: 'smooth' });
      };
      // 回看模式的选项不可再点
      card.querySelectorAll('.opt').forEach(o => o.style.pointerEvents = 'none');
      return;
    }
    card.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      const qi = +o.dataset.q;
      card.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(x => x.classList.remove('sel'));
      o.classList.add('sel');
      answers[qi] = +o.dataset.o;
    });
    const seeLast = card.querySelector('#seeLast');
    if (seeLast) seeLast.onclick = () => renderQuestions(true);
    card.querySelector('#qSubmit').onclick = () => {
      if (answers.includes(null) && !App.confirmBox('还有题目未作答，确定提交吗？')) return;
      const c = reveal(answers);
      record(set.type, set.id, c, set.questions.length);
      // 保存作答明细供回看
      App.store.listeningReview = App.store.listeningReview || {};
      App.store.listeningReview[set.id] = { answers: answers.slice(), date: App.today(), c, t: set.questions.length };
      App.save();
      const btn = card.querySelector('#qSubmit'); btn.disabled = true; btn.textContent = '已提交 ' + c + '/' + set.questions.length + '（可随时回看）';
      App.toast('听力练习已记录：' + Math.round(c / set.questions.length * 100) + '%');
    };
  }
})();
</script>
<script>/* ===== 阅读专项：仔细阅读 / 长篇匹配 / 选词填空 ===== */
App.Views.reading = App.Views.reading || {};
App.Reading = {}; // 模考复用的题型渲染器

(function () {
  const TYPES = {
    careful: { name: '仔细阅读', desc: '1 篇文章 + 5 道四选一，考细节、推理、主旨与词义', icon: '🔍' },
    matching: { name: '长篇阅读', desc: '9 段文章 + 5 句信息匹配，练定位关键词的能力', icon: '🧩' },
    cloze: { name: '选词填空', desc: '15 个备选词填 10 个空，考词性判断与上下文语义', icon: '🧪' }
  };
  const DATA = { careful: () => window.READING_CAREFUL || [], matching: () => window.READING_MATCHING || [], cloze: () => window.READING_CLOZE || [] };

  function bestScore(type, id) {
    const recs = App.store.practice.reading.filter(r => r.type === type && r.id === id);
    if (!recs.length) return null;
    return Math.max(...recs.map(r => Math.round(r.c / r.t * 100)));
  }
  function record(type, id, c, t, sec) {
    App.store.practice.reading.push({ d: Date.now(), type, id, c, t, sec: sec || 0 });
    if (App.store.practice.reading.length > 600) App.store.practice.reading = App.store.practice.reading.slice(-500);
    App.save();
  }

  /* ---------- 做题查词：先记录，交卷后统一显示释义 ---------- */
  const READING_TIME = 600; // 阅读专项每篇限时 10 分钟
  function lookupBarHtml(lookups) {
    return '<b>🔍 本次已查词 (' + lookups.length + ')</b>' + (lookups.length
      ? '：<span class="tag">' + lookups.join('</span> <span class="tag">') + '</span> <span class="note">释义将在交卷后显示</span>'
      : '<span class="note">做题时点击文章中的生词即可记录，交卷后统一显示释义</span>');
  }
  function recapHtml(lookups) {
    if (!lookups.length) return '';
    return '<div class="card" id="lookupRecap"><h3>📖 本次查词释义回顾 <span class="sub">' + lookups.length + ' 个词 · 做题时不显示，现在集中学</span></h3>'
      + lookups.map(w => {
        const e = App.dict.lookup(w);
        return '<div class="list-row"><b style="min-width:110px;font-size:15px">' + App.esc(w) + '</b>'
          + '<div style="flex:1" class="note">' + (e ? (e.ipa ? '/' + App.esc(e.ipa) + '/ ' : '') + App.esc(e.pos) + ' ' + App.esc(e.gloss)
            : '暂未收录释义') + '</div>'
          + '<button class="ico-btn ' + (App.dict.inBook(w) ? 'starred' : '') + '" data-book="' + App.esc(w) + '">' + (App.dict.inBook(w) ? '✓ 已加入' : '＋生词本') + '</button></div>';
      }).join('') + '</div>';
  }
  function mountRecap(el, lookups) {
    if (!lookups.length) return;
    el.insertAdjacentHTML('beforeend', recapHtml(lookups));
    const recap = el.querySelector('#lookupRecap');
    recap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    recap.querySelectorAll('[data-book]').forEach(b => b.onclick = () => {
      App.dict.addToBook(b.dataset.book, '阅读查词');
      b.textContent = '✓ 已加入'; b.classList.add('starred');
    });
  }

  const V = App.Views.reading;
  V.render = function (el, param) {
    if (param && param.type && param.id) return App.Reading['render_' + param.type](el, param.id, param.opts || {}, () => V.render(el, { type: param.type }));
    if (param && param.type) return renderType(el, param.type);
    if (param && param.gen) return renderGen(el);
    const supply = App.Gen.autoSupply();
    const genTotal = App.Gen.bankFor('careful').length + App.Gen.bankFor('cloze').length;
    el.innerHTML = '<div class="grid3">' + Object.keys(TYPES).map(k => {
      const t = TYPES[k];
      const sets = DATA[k]();
      const done = App.store.practice.reading.filter(r => r.type === k);
      const acc = done.length ? Math.round(done.reduce((a, r) => a + r.c / r.t, 0) / done.length * 100) : null;
      return `<div class="card" style="cursor:pointer" data-type="${k}">
        <div style="font-size:30px">${t.icon}</div>
        <h3 style="margin:8px 0 4px">${t.name}</h3>
        <div class="note" style="min-height:42px">${t.desc}</div>
        <hr class="hr">
        <div style="display:flex;justify-content:space-between;font-size:13px"><span>${sets.length} 篇题源</span><b>${acc == null ? '未开练' : '平均正确率 ' + acc + '%'}</b></div>
      </div>`;
    }).join('') + '</div>' +
    `<div class="card">
      <h3>🎯 智能出题 <span class="sub">选主题，即时生成全新文章与题目</span></h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <select class="selct" id="genType">
          <option value="careful">仔细阅读（5 题）</option>
          <option value="cloze">选词填空（15 选 10）</option>
        </select>
        <select class="selct" id="genTheme">
          ${App.Gen.themes().map(t => '<option value="' + t.key + '">' + t.label + '</option>').join('')}
        </select>
        <select class="selct" id="genLevel">
          <option value="cet6">六级难度</option>
          <option value="cet4">四级难度</option>
        </select>
        <label class="note" style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="genWordbook"> 结合我的生词本出题</label>
        <button class="btn" id="genBtn">✨ 生成新题</button>
        <span class="badge ok" id="genStock">🤖 题源库 ${genTotal} 篇${supply.careful + supply.cloze > 0 ? ' · 今日已自动补充 ' + (supply.careful + supply.cloze) + ' 篇' : ''}</span>
      </div>
      <div class="note" style="margin-top:8px">生成器按主题模板即时组装全新文章与题目（细节/词义/主旨全覆盖，选词填空自动配 15 选项与逐空解析），每次生成的文章都不同；练习成绩照常计入趋势。<b>每天打开应用会自动补充新题</b>，做完题库也不会枯竭。</div>
    </div>` +
    `<div class="card"><h3>💡 练法建议</h3><div class="note">每个题型单独训练手感和节奏：仔细阅读限时 <b>9 分钟/篇</b>，长篇阅读 <b>7 分钟/篇</b>，选词填空 <b>6 分钟/篇</b>（正式考试阅读部分共 40 分钟）。做题时<b>点击文章中的任何单词</b>即可查释义并加入生词本。</div></div>`;
    el.querySelectorAll('[data-type]').forEach(c => c.onclick = () => V.render(el, { type: c.dataset.type }));
    el.querySelector('#genBtn').onclick = () => {
      const type = el.querySelector('#genType').value;
      const theme = el.querySelector('#genTheme').value;
      const level = el.querySelector('#genLevel').value;
      const useWb = el.querySelector('#genWordbook').checked;
      let seedWords = [];
      if (useWb) {
        seedWords = Object.keys(App.store.wordbook).filter(w => App.WMAP()[w] && App.WMAP()[w].gloss).slice(0, 6);
        if (seedWords.length < 2) seedWords = [];
      }
      const genOpts = { level, seedWords };
      const set = type === 'cloze' ? App.Gen.makeCloze(theme, genOpts) : App.Gen.makeCareful(theme, genOpts);
      if (!set) { App.toast('生成失败，请重试'); return; }
      App.store.genBank.push({ id: set.id, type, theme, date: App.today(), set });
      App.save();
      App.Reading['render_' + type](el, set.id, { set }, () => V.render(el));
    };
  }

  function renderGen(el) { /* 预留 */ }

  function renderType(el, type) {
    const t = TYPES[type];
    const sets = DATA[type]();
    const genSets = App.Gen.bankFor(type);
    el.innerHTML = `<div class="card"><h3>${t.icon} ${t.name} <button class="btn plain sm" id="back" style="margin-left:auto">‹ 返回</button></h3>
      <div class="note" style="margin-bottom:12px">${t.desc}</div>
      <div class="grid3">${sets.map((s, i) => {
        const best = bestScore(type, s.id);
        return `<div class="topic-card" data-id="${s.id}">
          <div class="tc-title">${s.title}</div>
          <div class="tc-meta">第 ${i + 1} 篇 · ${type === 'careful' ? '5 题' : type === 'matching' ? s.paras.length + ' 段 5 题' : '15 选 10'}</div>
          <div style="margin-top:8px">${best == null ? '<span class="tag">未做过</span>' : '<span class="badge ' + (best >= 70 ? 'ok' : best >= 50 ? 'warn' : 'bad') + '">最好成绩 ' + best + '%</span>'}</div>
        </div>`;
      }).join('')}</div>
      ${genSets.length ? `<hr class="hr"><h3 style="font-size:14px">🤖 智能生成题源 <span class="sub">${genSets.length} 篇 · 自动补充</span></h3>
      <div class="grid3">${genSets.map(g => {
        const best = bestScore(type, g.set.id);
        return `<div class="topic-card" data-gen="${g.id}">
          <div class="tc-title">${App.esc(g.set.title)} <span class="badge lv2">🤖</span></div>
          <div class="tc-meta">${g.date} · ${(window.GEN_THEMES[g.theme] || {}).label || ''}</div>
          <div style="margin-top:8px">${best == null ? '<span class="tag">未做过</span>' : '<span class="badge ' + (best >= 70 ? 'ok' : best >= 50 ? 'warn' : 'bad') + '">最好成绩 ' + best + '%</span>'}</div>
        </div>`;
      }).join('')}</div>` : ''}
    </div>`;
    el.querySelector('#back').onclick = () => V.render(el);
    el.querySelectorAll('.topic-card').forEach(c => c.onclick = () => {
      if (c.dataset.gen) {
        const g = App.Gen.bankFor(type).find(x => x.set.id === c.dataset.gen);
        if (g) return App.Reading['render_' + type](el, g.set.id, { set: g.set }, () => V.render(el, { type }));
      }
      V.render(el, { type, id: c.dataset.id });
    });
  }

  /* ---------- 计时器工具 ---------- */
  function startTimer(el, limitSec, onEnd) {
    let left = limitSec;
    const paint = () => { const t = el.querySelector('.timer'); if (t) { t.textContent = App.mmss(left); if (left <= 60) t.classList.remove('cool'); } };
    paint();
    const timer = setInterval(() => {
      left--;
      if (left <= 0) { clearInterval(timer); onEnd(); return; }
      paint();
    }, 1000);
    return { stop: () => clearInterval(timer), elapsed: limitSec - left, left: () => left };
  }

  /* ---------- 仔细阅读 ---------- */
  App.Reading.render_careful = function (el, id, opts, onBack) {
    const set = opts.set || (window.READING_CAREFUL || []).find(s => s.id === id);
    if (!set) { el.innerHTML = '<div class="card">题库未加载</div>'; return; }
    const answers = new Array(set.questions.length).fill(null);
    const lookups = [];
    el.innerHTML = `<div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <button class="btn plain sm" id="back">‹ 返回</button><b>${set.title}</b>
        <span style="margin-left:auto" class="timer cool">--:--</span>
        <button class="btn sm" id="submit">交卷</button>
      </div>
      <div class="passage" data-src="仔细阅读" data-defer="1">${set.text.split(/\n+/).map(p => '<p>' + App.esc(p) + '</p>').join('')}</div>
      <div id="lookupBar" class="note" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h3>题目</h3>
      <div id="qList">${set.questions.map((q, i) => `
        <div style="margin-bottom:18px">
          <b>${i + 1}. ${App.esc(q.q)}</b>
          ${q.opts.map((o, j) => `<div class="opt" data-q="${i}" data-o="${j}"><span class="k">${'ABCD'[j]}</span><span>${App.esc(o)}</span></div>`).join('')}
          <div class="exp" id="exp${i}" style="display:none"></div>
        </div>`).join('')}</div>
    </div>`;
    const pass = el.querySelector('.passage');
    App.dict.wrapWords(pass);
    const bar = el.querySelector('#lookupBar');
    bar.innerHTML = lookupBarHtml(lookups);
    App.dict.onDeferredLookup = w => { if (!lookups.includes(w)) { lookups.push(w); bar.innerHTML = lookupBarHtml(lookups); } };
    el.querySelector('#back').onclick = onBack;
    el.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      const qi = +o.dataset.q;
      el.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(x => x.classList.remove('sel'));
      o.classList.add('sel');
      answers[qi] = +o.dataset.o;
    });
    const t = startTimer(el, opts.timeLimit || READING_TIME, () => doSubmit(true));
    function doSubmit(auto) {
      if (answers.includes(null) && !auto && !App.confirmBox('还有题目没作答，确定交卷吗？')) return;
      t.stop();
      pass.removeAttribute('data-defer');
      const c = answers.filter((a, i) => a === set.questions[i].a).length;
      record('careful', id, c, set.questions.length, t.elapsed);
      el.querySelectorAll('.opt').forEach(o => {
        const qi = +o.dataset.q, oi = +o.dataset.o;
        o.style.pointerEvents = 'none';
        if (oi === set.questions[qi].a) o.classList.add('right');
        else if (answers[qi] === oi) o.classList.add('wrong');
      });
      set.questions.forEach((q, i) => {
        const exp = el.querySelector('#exp' + i);
        exp.style.display = 'block';
        exp.className = 'fb-item ' + (answers[i] === q.a ? 'good' : 'bad');
        exp.innerHTML = '<b>' + (answers[i] === q.a ? '✓ 正确' : '✗ 你的答案：' + (answers[i] == null ? '未作答 · ' : String.fromCharCode(65 + answers[i]) + ' · ')) + '正确：' + String.fromCharCode(65 + q.a) + '</b><span>' + App.esc(q.exp) + '</span>';
      });
      const sub = el.querySelector('#submit'); sub.disabled = true; sub.textContent = '已交卷';
      const acc = Math.round(c / set.questions.length * 100);
      el.querySelector('.timer').outerHTML = '<span class="badge ' + (acc >= 70 ? 'ok' : acc >= 50 ? 'warn' : 'bad') + '" style="font-size:14px;padding:4px 14px">得分 ' + c + '/' + set.questions.length + '（' + acc + '%）</span>';
      bar.innerHTML = '<b>🔍 本次已查词 (' + lookups.length + ')</b>：<span class="note">释义见下方回顾</span>';
      mountRecap(el, lookups);
      el.querySelector('#qList').scrollIntoView({ behavior: 'smooth' });
      App.toast(auto ? '⏰ 时间到，已自动交卷' : '交卷成功：' + acc + '%');
      if (opts.onSubmit) opts.onSubmit({ c, t: set.questions.length });
    }
    el.querySelector('#submit').onclick = () => doSubmit(false);
  };

  /* ---------- 长篇匹配 ---------- */
  App.Reading.render_matching = function (el, id, opts, onBack) {
    const set = (window.READING_MATCHING || []).find(s => s.id === id);
    if (!set) { el.innerHTML = '<div class="card">题库未加载</div>'; return; }
    const letters = set.paras.map(p => p[0]);
    const picks = new Array(set.items.length).fill(null);
    const lookups = [];
    el.innerHTML = `<div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <button class="btn plain sm" id="back">‹ 返回</button><b>${set.title}</b>
        <span style="margin-left:auto" class="timer cool">--:--</span><button class="btn sm" id="submit">交卷</button>
      </div>
      <div class="passage" data-src="长篇阅读" data-defer="1" style="max-height:480px">${set.paras.map(([L, txt]) => '<div class="par-row"><span class="pl">' + L + '</span><p style="margin:0">' + App.esc(txt) + '</p></div>').join('')}</div>
      <div id="lookupBar" class="note" style="margin-top:10px"></div>
    </div>
    <div class="card"><h3>把下列句子与原文段落匹配</h3>
      ${set.items.map((it, i) => `<div style="margin-bottom:14px">
        <b>${i + 1}. ${App.esc(it.stmt)}</b>
        <div style="margin-top:6px">
          <select class="selct" data-i="${i}"><option value="">选择段落…</option>${letters.map(L => '<option value="' + L + '">' + L + '</option>').join('')}</select>
          <span class="note" id="note${i}" style="display:none;margin-left:8px"></span>
        </div>
        <div class="fb-item" id="exp${i}" style="display:none"></div>
      </div>`).join('')}
    </div>`;
    App.dict.wrapWords(el.querySelector('.passage'));
    const mBar = el.querySelector('#lookupBar');
    mBar.innerHTML = lookupBarHtml(lookups);
    App.dict.onDeferredLookup = w => { if (!lookups.includes(w)) { lookups.push(w); mBar.innerHTML = lookupBarHtml(lookups); } };
    el.querySelector('#back').onclick = onBack;
    const t = startTimer(el, opts.timeLimit || READING_TIME, () => doSubmit(true));
    function doSubmit(auto) {
      if (picks.includes(null) && !auto && !App.confirmBox('还有题目没作答，确定交卷吗？')) return;
      t.stop();
      el.querySelector('.passage').removeAttribute('data-defer');
      let c = 0;
      set.items.forEach((it, i) => {
        const sel = el.querySelector('select[data-i="' + i + '"]');
        sel.disabled = true;
        const ok = picks[i] === it.a;
        if (ok) c++;
        const note = el.querySelector('#note' + i);
        note.style.display = 'inline';
        note.innerHTML = ok ? '<span class="badge ok">✓ ' + it.a + '</span>' : '<span class="badge bad">✗ 你的答案 ' + (picks[i] || '未答') + ' · 正确 ' + it.a + '</span>';
        const exp = el.querySelector('#exp' + i);
        exp.style.display = 'flex';
        exp.innerHTML = '<b>解析</b><span>' + App.esc(it.exp) + '</span>';
      });
      record('matching', id, c, set.items.length, t.elapsed);
      const sub = el.querySelector('#submit'); sub.disabled = true; sub.textContent = '已交卷';
      const acc = Math.round(c / set.items.length * 100);
      el.querySelector('.timer').outerHTML = '<span class="badge ' + (acc >= 70 ? 'ok' : acc >= 50 ? 'warn' : 'bad') + '" style="font-size:14px;padding:4px 14px">得分 ' + c + '/' + set.items.length + '（' + acc + '%）</span>';
      mBar.innerHTML = '<b>🔍 本次已查词 (' + lookups.length + ')</b>：<span class="note">释义见下方回顾</span>';
      mountRecap(el, lookups);
      App.toast(auto ? '⏰ 时间到，已自动交卷' : '交卷成功：' + acc + '%');
      if (opts.onSubmit) opts.onSubmit({ c, t: set.items.length });
    }
    el.querySelector('#submit').onclick = () => doSubmit(false);
    el.querySelectorAll('select[data-i]').forEach(sel => sel.onchange = () => { picks[+sel.dataset.i] = sel.value || null; });
  };

  /* ---------- 选词填空 ---------- */
  App.Reading.render_cloze = function (el, id, opts, onBack) {
    const set = opts.set || (window.READING_CLOZE || []).find(s => s.id === id);
    if (!set) { el.innerHTML = '<div class="card">题库未加载</div>'; return; }
    const N = 10;
    const picks = new Array(N).fill(null);
    const lookups = [];
    const paras = set.text.split(/\n+/);
    el.innerHTML = `<div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <button class="btn plain sm" id="back">‹ 返回</button><b>${set.title}</b>
        <span style="margin-left:auto" class="timer cool">--:--</span><button class="btn sm" id="submit">交卷</button>
      </div>
      <div style="background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px">
        <b>备选词（A–O）：</b>
        <span data-src="选词填空" data-defer="1">${set.options.map((o, i) => '<span class="dict-word" data-w="' + o + '"><b>' + String.fromCharCode(65 + i) + '</b>. ' + o + '</span>').join('　')}</span>
      </div>
      <div class="passage" data-src="选词填空" data-defer="1" id="pass">${paras.map(p => '<p>' + App.esc(p) + '</p>').join('')}</div>
      <div id="lookupBar" class="note" style="margin-top:10px"></div>
    </div>`;
    // 把 {n} 替换成下拉框（在转义后的文本上处理）
    const pass = el.querySelector('#pass');
    pass.innerHTML = pass.innerHTML.replace(/\((\d+)\)____/g, '($1)____').replace(/\{(\d+)\}/g, (m, n) => {
      const i = +n - 1;
      let opts2 = '<option value="">?'+n+'</option>';
      set.options.forEach((o, j) => { opts2 += '<option value="' + j + '">' + String.fromCharCode(65 + j) + '. ' + o + '</option>'; });
      return '<select class="selct blank-sel" data-b="' + i + '">' + opts2 + '</select>';
    });
    App.dict.wrapWords(pass);
    const kBar = el.querySelector('#lookupBar');
    kBar.innerHTML = lookupBarHtml(lookups);
    App.dict.onDeferredLookup = w => { if (!lookups.includes(w)) { lookups.push(w); kBar.innerHTML = lookupBarHtml(lookups); } };
    el.querySelector('#back').onclick = onBack;
    el.querySelectorAll('select[data-b]').forEach(sel => sel.onchange = () => { picks[+sel.dataset.b] = sel.value === '' ? null : +sel.value; });
    const t = startTimer(el, opts.timeLimit || READING_TIME, () => doSubmit(true));
    function doSubmit(auto) {
      if (picks.includes(null) && !auto && !App.confirmBox('还有空没填，确定交卷吗？')) return;
      t.stop();
      pass.removeAttribute('data-defer');
      el.querySelector('[data-src="选词填空"]').removeAttribute('data-defer');
      let c = 0;
      set.a.forEach((ai, i) => {
        const sel = el.querySelector('select[data-b="' + i + '"]');
        sel.disabled = true;
        const ok = picks[i] === ai;
        if (ok) c++;
        sel.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
        sel.style.background = ok ? 'var(--ok-soft)' : 'var(--bad-soft)';
        if (!ok) sel.style.borderColor = 'var(--bad)';
      });
      record('cloze', id, c, N, t.elapsed);
      const sub = el.querySelector('#submit'); sub.disabled = true; sub.textContent = '已交卷';
      const acc = Math.round(c / N * 100);
      el.querySelector('.timer').outerHTML = '<span class="badge ' + (acc >= 70 ? 'ok' : acc >= 50 ? 'warn' : 'bad') + '" style="font-size:14px;padding:4px 14px">得分 ' + c + '/' + N + '（' + acc + '%）</span>';
      kBar.innerHTML = '<b>🔍 本次已查词 (' + lookups.length + ')</b>：<span class="note">释义见下方回顾</span>';
      mountRecap(el, lookups);
      // 解析
      const expCard = document.createElement('div');
      expCard.className = 'card';
      expCard.innerHTML = '<h3>逐空解析</h3>' + set.a.map((ai, i) => {
        const ok = picks[i] === ai;
        return '<div class="fb-item ' + (ok ? 'good' : 'bad') + '"><b>' + (i + 1) + '. ' + (ok ? '✓ ' : '✗ 正确 ') + String.fromCharCode(65 + ai) + '. ' + set.options[ai] + '</b><span>' + App.esc(set.exp[i]) + '</span></div>';
      }).join('');
      el.appendChild(expCard);
      expCard.scrollIntoView({ behavior: 'smooth' });
      App.toast(auto ? '⏰ 时间到，已自动交卷' : '交卷成功：' + acc + '%');
      if (opts.onSubmit) opts.onSubmit({ c, t: N });
    }
    el.querySelector('#submit').onclick = () => doSubmit(false);
  };
})();
</script>
<script>/* ===== 写作专项：智能批改 / 范文 / 模板 / 句式 / 过渡 ===== */
App.Views.writing = App.Views.writing || {};
(function () {
  let tab = 'grade';
  let curTopic = null, curFeedback = null;

  const V = App.Views.writing;
  V.reset = function () { tab = 'grade'; };
  V.render = function (el, param) {
    if (param && param.topicId) { tab = 'grade'; curTopic = (window.WRITING_TOPICS || []).find(t => t.id === param.topicId) || curTopic; }
    el.innerHTML = '<div class="tabs">' +
      [['grade', '🤖 AI 批改'], ['models', '📚 真题范文'], ['tpl', '🧱 高分模板'], ['sent', '✒️ 进阶句式'], ['trans', '🔗 万能过渡']]
        .map(([k, t]) => '<button class="tab ' + (tab === k ? 'active' : '') + '" data-t="' + k + '">' + t + '</button>').join('') + '</div><div id="wBody"></div>';
    el.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; V.render(el); });
    const body = el.querySelector('#wBody');
    if (tab === 'grade') renderGrade(body);
    else if (tab === 'models') renderModels(body);
    else if (tab === 'tpl') renderTpl(body);
    else if (tab === 'sent') renderSent(body);
    else renderTrans(body);
  };

  /* ---------- 批改 ---------- */
  function renderGrade(el) {
    const topics = window.WRITING_TOPICS || [];
    if (!curTopic) curTopic = topics[0];
    const essays = App.store.essays.slice().reverse();
    el.innerHTML = `
      <div class="card">
        <h3>选择题目 <span class="sub">按话题分类</span></h3>
        <div class="grid3" style="grid-template-columns:repeat(4,1fr)">
          ${topics.map(t => `<div class="topic-card ${curTopic && t.id === curTopic.id ? '' : 'no-dict'}" data-t="${t.id}" style="${curTopic && t.id === curTopic.id ? 'border-color:var(--pri);background:var(--pri-soft)' : ''}">
            <span class="tag">${t.cat}</span>
            <div class="tc-title" style="margin-top:6px;font-size:12.5px;line-height:1.5">${App.esc(t.title.replace(/^Directions:.*?essay\s*(related to|commenting on|on|to state your view[^.]*\.)?/i, '').slice(0, 60))}…</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px">
          <div style="flex:1;min-width:260px"><b>题目：</b><span class="note">${App.esc(curTopic ? curTopic.title : '')}</span></div>
          <button class="btn ghost sm" id="showHint">💡 审题提示</button>
        </div>
        <div id="hintBox" style="display:none;background:var(--teal-soft);border-radius:10px;padding:10px 14px;margin-bottom:10px" class="note">${curTopic ? App.esc(curTopic.hint) : ''}</div>
