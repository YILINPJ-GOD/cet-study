<script>/* ===== 工具层：全局对象、通用函数、词库装配 ===== */
const App = window.App = {};
App.VERSION = '1.8.1';

/* ---------- 日期与格式 ---------- */
App.today = function (d) {
  const t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
};
App.endOfToday = function () { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); };
App.fmtSec = function (s) {
  s = Math.round(s || 0);
  if (s < 60) return s + '秒';
  const m = Math.floor(s / 60);
  if (m < 60) return m + '分钟';
  return Math.floor(m / 60) + '小时' + (m % 60 ? (m % 60) + '分' : '');
};
App.mmss = function (s) {
  s = Math.max(0, Math.round(s || 0));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
App.esc = function (s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
App.debounce = function (fn, ms) {
  let t = null;
  return function () { clearTimeout(t); const a = arguments, self = this; t = setTimeout(() => fn.apply(self, a), ms); };
};
App.shuffle = function (arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
App.randPick = function (arr, n, exclude) {
  const pool = App.shuffle(arr.filter(x => !exclude || !exclude.includes(x)));
  return pool.slice(0, n);
};
App.hash = function (str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
};
App.toast = function (msg, ms) {
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, ms || 2200);
};
App.speak = function (text) {
  try {
    if (App.speakHook) return App.speakHook(text, App.speakLang());   // 测试/扩展钩子
    if (!window.speechSynthesis) { App.toast('当前浏览器不支持发音'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = App.speakLang();
    // 按所选口音优先挑选匹配的语音包
    const want = u.lang;
    const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
    const v = voices.find(x => x.lang === want) || voices.find(x => x.lang && x.lang.replace('_', '-').startsWith(want.slice(0, 2)));
    if (v) u.voice = v;
    u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch (e) { /* 忽略 */ }
};
/* 发音口音：美音(默认)/英音，可在首页设置 */
App.speakLang = function () {
  return (App.store && App.store.profile && App.store.profile.voice === 'uk') ? 'en-GB' : 'en-US';
};
App.confirmBox = function (msg) { return window.confirm(msg); };

/* ---------- 词库装配（四六级 × 档位 × 专项） ---------- */
App.LV = {
  1: { name: '常用', cls: 'lv1', color: '#0d9488', dailyNew: 8 },
  2: { name: '高频', cls: 'lv2', color: '#4f46e5', dailyNew: 12 },
  3: { name: '冲刺', cls: 'lv3', color: '#c2610a', dailyNew: 15 }
};
/* 档位注册表：exam 决定词库组成；goal 为目标词量（可分批补齐） */
App.TIERS = {
  custom: { label: '我的词库', short: '我的', exam: 'both', lv: 2, order: 0, goal: null },
  t4c: { label: '四级常用', short: '常用', exam: 'cet4', lv: 1, order: 1, goal: 5000 },
  t4h: { label: '四级高频', short: '高频', exam: 'cet4', lv: 2, order: 2, goal: 2500 },
  t4s: { label: '四级冲刺', short: '冲刺', exam: 'cet4', lv: 3, order: 3, goal: 800 },
  t6h: { label: '六级高频', short: '高频', exam: 'cet6', lv: 2, order: 2, goal: 2500 },
  t6s: { label: '六级冲刺', short: '冲刺', exam: 'cet6', lv: 3, order: 3, goal: 800 },
  zt: { label: '翻译写作主题词', short: '专项', exam: 'both', lv: 2, order: 4, goal: null },
  tl: { label: '听力场景词', short: '专项', exam: 'both', lv: 2, order: 5, goal: null }
};
App.BANKS = {
  t4c: { vars: ['BANK_T4C'] },
  t4h: { vars: ['BANK_T4H'] },
  t4s: { vars: ['BANK_T4S'] },
  t6h: { vars: ['BANK_T6H', 'BANK_T6H2'] },
  t6s: { vars: ['BANK_T6S'] },
  zt: { vars: ['BANK_ZT'] },
  tl: { vars: ['BANK_TL'] }
};
App.banksOf = function (exam) {
  return exam === 'cet4' ? ['t4c', 't4h', 't4s', 'zt', 'tl']
    : exam === 'cet6' ? ['t4c', 't4h', 't4s', 't6h', 't6s', 'zt', 'tl']
    : ['t4c', 't4h', 't4s', 't6h', 't6s', 'zt', 'tl'];
};
/* 定级档位 → 该级别下的起始档名称 */
App.lvTierLabel = function (lv) {
  const exam = (App.store && App.store.profile && App.store.profile.exam) || 'cet6';
  return exam === 'cet4'
    ? ({ 1: '四级常用', 2: '四级高频', 3: '四级冲刺' })[lv]
    : ({ 1: '四级常用（基础）', 2: '六级高频', 3: '六级冲刺' })[lv];
};
/* 常考释义优先（熟词僻义）：覆盖词库默认释义，考试义放第一位 */
App.SENSE_OVERRIDES = window.SENSE_OVERRIDES || {};

App.allWords = function (exam) {
  exam = exam || (App.store && App.store.profile && App.store.profile.exam) || 'cet6';
  if (App._words && App._wordsExam === exam) return App._words;
  const seen = {}, out = [];
  // 自定义词（导入的生词表）优先
  for (const cw of (App.store && App.store.customWords) || []) {
    if (!cw || !cw.w || seen[cw.w]) continue;
    seen[cw.w] = 1;
    out.push({ w: cw.w, ipa: cw.ipa || '', pos: cw.pos || '', gloss: cw.gloss || '', tier: 'custom', lv: 2 });
  }
  for (const tier of App.banksOf(exam)) {
    const meta = App.TIERS[tier];
    for (const vn of App.BANKS[tier].vars) {
      const arr = window[vn] || [];
      for (const it of arr) {
        if (!it || !it[0]) continue;
        const w = String(it[0]).trim().toLowerCase();
        if (!w || seen[w]) continue;
        seen[w] = 1;
        const ov = App.SENSE_OVERRIDES[w];
        out.push({
          w, ipa: it[1] || '', pos: it[2] || '',
          gloss: ov || it[3] || '',
          tier, lv: meta.lv,
          examSense: !!ov
        });
      }
    }
  }
  App._words = out;
  App._wordsExam = exam;
  return out;
};
App.WMAP = function () {
  if (App._wmap && App._wmapExam === (App.store && App.store.profile && App.store.profile.exam)) return App._wmap;
  const m = {};
  // 两个级别的词都进词典（点击查词全覆盖）
  for (const ex of ['cet4', 'cet6']) {
    for (const e of App.allWords(ex)) if (!m[e.w]) m[e.w] = e;
  }
  const extra = window.EXTRA_DICT || {};
  Object.keys(extra).forEach(k => {
    const v = extra[k];
    if (!m[k]) m[k] = { w: k, ipa: v[0] || '', pos: v[1] || '', gloss: v[2] || '', lv: 0, tier: 'dict' };
    else if (!m[k].ipa && v[0]) { m[k].ipa = v[0]; m[k].pos = m[k].pos || v[1]; }
  });
  App._wmap = m;
  App._wmapExam = App.store && App.store.profile && App.store.profile.exam;
  return m;
};
/* 释义干扰项（同档位优先） */
App.glossDistractors = function (entry, n) {
  const pool = App.allWords().filter(x => x.w !== entry.w && x.gloss !== entry.gloss);
  const same = pool.filter(x => x.lv === entry.lv);
  const picks = App.randPick(same, n);
  if (picks.length < n) picks.push(...App.randPick(pool, n - picks.length, picks.map(p => p.w).concat(entry.w)));
  return picks;
};

/* ---------- 学习计时（打卡/时长） ---------- */
App.dayStat = function (date) {
  const t = App.today(date);
  if (!App.store.days[t]) App.store.days[t] = { sec: 0, newW: 0, revW: 0 };
  return App.store.days[t];
};
App.streak = function () {
  let n = 0;
  const d = new Date();
  // 今天未打卡时从昨天起算，保持已有连续记录
  if (!(App.store.days[App.today(d)] && App.store.days[App.today(d)].sec >= App.CHECKIN_SEC)) d.setDate(d.getDate() - 1);
  while (App.store.days[App.today(d)] && App.store.days[App.today(d)].sec >= App.CHECKIN_SEC) { n++; d.setDate(d.getDate() - 1); }
  return n;
};

/* ---------- 单词拆解（词根词缀）：App.morph(word) → {prefix, root, suffix, text} 或 null ---------- */
App.morph = function (word) {
  const w = String(word || '').toLowerCase();
  if (!w || w.length < 4) return null;
  const P = window.WORD_PREFIXES || {}, S = window.WORD_SUFFIXES || {}, R = window.WORD_ROOTS || [];
  let prefix = null, suffix = null, root = null;
  for (const p of Object.keys(P).sort((a, b) => b.length - a.length)) {
    if (w.startsWith(p) && w.length - p.length >= 3) { prefix = { p, m: P[p] }; break; }
  }
  for (const s of Object.keys(S).sort((a, b) => b.length - a.length)) {
    if (w.endsWith(s) && w.length - s.length >= 3) { suffix = { s, m: S[s] }; break; }
  }
  const mid = w.slice(prefix ? prefix.p.length : 0, suffix ? w.length - suffix.s.length : w.length);
  for (const r of R) {
    const key = r.r.split('/')[0];
    const alt = r.r.split('/')[1] || '';
    if ((key && mid.includes(key)) || (alt && mid.includes(alt))) { root = { r: r.r, m: r.m }; break; }
  }
  const parts = [];
  if (prefix) parts.push(prefix.p + '（' + prefix.m + '）');
  if (root) parts.push((root.r.split('/')[0]) + '（' + root.m + '）');
  if (!root && mid && mid.length >= 3) parts.push(mid);
  if (suffix) parts.push(suffix.s + '（' + suffix.m + '）');
  if (parts.length < 2) return null;
  return { prefix, root, suffix, text: parts.join(' + ') };
};

/* ---------- 简易 DOM 助手 ---------- */
App.el = function (html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
App.$ = function (sel, root) { return (root || document).querySelector(sel); };
App.$$ = function (sel, root) { return Array.from((root || document).querySelectorAll(sel)); };
</script>
<script>/* ===== 存储层：localStorage 持久化 + 备份导入导出 ===== */
App.STORE_KEY = 'cet6app_v1';
App.CHECKIN_SEC = 600; // 当日学习满10分钟记为打卡
App.store = null;

App.defaultStore = function () {
  return {
    version: 1,
    createdAt: Date.now(),
    profile: { placed: false, startLevel: 1, dailyNew: 8, reviewCap: 60 },
    srs: {},            // word -> {b:box, due:时间戳, c:对, w:错, t:最后时间}
    wordbook: {},       // word -> {d:加入日期, src:来源}
    days: {},           // 'YYYY-MM-DD' -> {sec, newW, revW}
    practice: { reading: [], listening: [], vocab: [] },
    genBank: [],        // 智能生成的题源库 [{id,type,theme,date,set}]
    realExams: [],      // 本地导入的真题文件元数据 [{key,kind,level,year,month,name,size,label,date}]
    realScores: [],     // 真题刷题记录 [{id,level,label,total,sub,date}]
    essays: [],
    translations: [],
    mocks: [],
    exprs: []           // 翻译常用表达积累本
  };
};

App.load = function () {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(App.STORE_KEY) || 'null'); } catch (e) { data = null; }
  const def = App.defaultStore();
  if (data && typeof data === 'object') {
    App.store = Object.assign(def, data);
    App.store.profile = Object.assign(def.profile, data.profile || {});
    App.store.practice = Object.assign(def.practice, data.practice || {});
    for (const k of ['srs', 'wordbook', 'days']) if (!App.store[k] || typeof App.store[k] !== 'object') App.store[k] = {};
    for (const k of ['essays', 'translations', 'mocks', 'exprs']) if (!Array.isArray(App.store[k])) App.store[k] = [];
    // practice 子键归一化（防止旧版/部分备份缺数组导致崩溃）
    for (const k of ['reading', 'listening', 'vocab']) if (!Array.isArray(App.store.practice[k])) App.store.practice[k] = [];
    if (!Array.isArray(App.store.genBank)) App.store.genBank = [];
    if (!Array.isArray(App.store.realExams)) App.store.realExams = [];
    if (!Array.isArray(App.store.realScores)) App.store.realScores = [];
  } else {
    App.store = def;
  }
};

App._saveNow = function () {
  if (App._noSave) return;   // 测试/特殊场景下暂停自动持久化
  try { localStorage.setItem(App.STORE_KEY, JSON.stringify(App.store)); }
  catch (e) { console.warn('保存失败', e); App.toast('⚠️ 本地存储失败，请检查浏览器设置'); }
};
App.save = App.debounce(App._saveNow, 400);

App.exportBackup = function () {
  const blob = new Blob([JSON.stringify(App.store, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '六级智学备份_' + App.today() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  App.store.lastBackupAt = Date.now();
  App.save();
  App.toast('备份已导出到下载目录');
};

/* 深度校验备份文件结构，返回 null 或错误原因 */
App.validateBackup = function (data) {
  if (!data || typeof data !== 'object') return '不是有效的 JSON 对象';
  if (typeof data.version !== 'number') return '缺少 version 字段';
  if (!data.profile || typeof data.profile !== 'object') return '缺少 profile';
  if (!data.srs || typeof data.srs !== 'object') return '缺少 srs（词汇记忆记录）';
  if (!data.days || typeof data.days !== 'object') return '缺少 days（学习时长记录）';
  for (const k of ['essays', 'translations', 'mocks', 'exprs']) {
    if (data[k] !== undefined && !Array.isArray(data[k])) return k + ' 应为数组';
  }
  if (data.practice !== undefined && (typeof data.practice !== 'object' || Array.isArray(data.practice))) return 'practice 结构错误';
  let badSrs = 0;
  for (const w of Object.keys(data.srs)) {
    const r = data.srs[w];
    if (!r || typeof r !== 'object' || typeof r.b !== 'number') badSrs++;
  }
  if (badSrs > 0) return 'srs 中有 ' + badSrs + ' 条记录结构异常';
  return null;
};

App.importBackup = function (file, cb) {
  const reader = new FileReader();
  reader.onload = function () {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (e) { App.toast('导入失败：文件不是有效的 JSON'); return; }
    const err = App.validateBackup(data);
    if (err) { App.toast('导入失败：' + err); return; }
    if (!App.confirmBox('导入备份将覆盖当前全部学习数据（覆盖前会自动导出当前数据作应急备份）。确定继续吗？')) return;
    try { App.exportBackup(); } catch (e) { /* 应急备份失败不阻断导入 */ }
    try {
      localStorage.setItem(App.STORE_KEY, JSON.stringify(data));
    } catch (e) { App.toast('导入失败：本地存储写入出错'); return; }
    App.load();
    App.toast('导入成功');
    if (cb) cb();
  };
  reader.readAsText(file);
};

App.resetAll = function () {
  if (!App.confirmBox('确定要清空所有学习数据吗？此操作不可恢复！')) return;
  if (!App.confirmBox('再次确认：真的要清空吗？（建议先导出备份）')) return;
  localStorage.removeItem(App.STORE_KEY);
  location.reload();
};
</script>
<script>/* ===== SRS 间隔重复 + 每日计划 + 考查题生成 ===== */
App.SRS_INTERVALS = [0, 1, 2, 4, 8, 15, 30]; // box -> 下次复习间隔（天），box0 当天再来一次
App.DAY = 86400000;

App.srsGet = function (w) { return App.store.srs[w] || null; };

/* 记录一次作答。ok=true 升箱，false 退回 box0 立即复习 */
App.srsReview = function (w, ok, fuzzy) {
  const rec = App.store.srs[w] || { b: 0, due: 0, c: 0, w: 0 };
  if (fuzzy) {
    rec.due = Date.now() + 5 * 60 * 1000;
  } else if (ok) {
    rec.b = Math.min((rec.b || 0) + 1, 6); rec.c++;
    rec.due = Date.now() + App.SRS_INTERVALS[rec.b] * App.DAY;
  } else {
    rec.b = 0; rec.w++;
    rec.due = Date.now() + 10 * 60 * 1000;
  }
  rec.t = Date.now();
  App.store.srs[w] = rec;
  return rec;
};

App.srsStatus = function (w) {
  const rec = App.srsGet(w);
  if (!rec) return { label: '未学', cls: '' };
  if (rec.b >= 4) return { label: '已掌握', cls: 'ok' };
  if (rec.b >= 1) return { label: '学习中', cls: 'warn' };
  return { label: '待巩固', cls: 'bad' };
};

/* 今日待复习（到期未超过每日上限） */
App.dueWords = function () {
  const cap = App.store.profile.reviewCap || 60;
  const done = (App.dayStat().revW) || 0;
  const list = Object.keys(App.store.srs)
    .filter(w => App.store.srs[w].due <= Date.now() && App.WMAP()[w])
    .sort((a, b) => App.store.srs[a].due - App.store.srs[b].due);
  return list.slice(0, Math.max(0, cap - done));
};

/* 今日新词：按所选档位顺序取；到期复习多时自动减半新词（艾宾浩斯新旧配比） */
App.newWords = function () {
  const exam = App.store.profile.exam || 'cet6';
  const dueCount = App.dueWords().length;
  const daily = App.store.profile.dailyNew || 8;
  const done = (App.dayStat().newW) || 0;
  if (done >= daily) return [];
  // 新旧比例自动安排：到期复习超过 20 个时，新词减半，优先清复习
  let quota = daily - done;
  if (dueCount > 20) quota = Math.ceil(quota / 2);
  const lv = App.store.profile.startLevel || 1;
  const tierOrder = exam === 'cet4'
    ? (App.store.customWords && App.store.customWords.length ? ['custom'] : []).concat(['t4c', 't4h', 't4s'])
    : (App.store.customWords && App.store.customWords.length ? ['custom'] : []).concat(lv === 3 ? ['t6h', 't6s', 't4c'] : lv === 2 ? ['t6h', 't4c', 't6s'] : ['t4c', 't6h', 't6s']);
  const pool = [];
  for (const t of tierOrder) pool.push(...App.allWords().filter(e => e.tier === t && !App.store.srs[e.w]));
  return pool.slice(0, quota);
};

/* 今日计划概览 */
App.planToday = function () {
  const due = Object.keys(App.store.srs).filter(w => App.store.srs[w].due <= Date.now() && App.WMAP()[w]).length;
  const cap = App.store.profile.reviewCap || 60;
  const doneRev = App.dayStat().revW || 0;
  const doneNew = App.dayStat().newW || 0;
  const daily = App.store.profile.dailyNew || 8;
  return {
    newTotal: daily, newDone: doneNew,
    revTotal: Math.min(due, cap), revDone: doneRev,
    needTest: !App.store.profile.placed
  };
};

App.recordVocab = function (isNew, ok) {
  const d = App.dayStat();
  if (isNew) d.newW = (d.newW || 0) + 1; else d.revW = (d.revW || 0) + 1;
  App.store.practice.vocab.push({ d: App.today(), new: !!isNew, ok: !!ok });
  if (App.store.practice.vocab.length > 2000) App.store.practice.vocab = App.store.practice.vocab.slice(-1500);
  App.save();
};

/* ---- 考查题生成（五种记忆模式）---- */
App.quizMode = function (w) { return ['e2c', 'c2e', 'spell', 'listen', 'c2et'][App.hash(w) % 5]; };

/* 英译中四选一 */
App.quizE2C = function (entry) {
  const ds = App.glossDistractors(entry, 3);
  const opts = App.shuffle([entry].concat(ds)).map(e => ({ w: e.w, text: e.gloss }));
  return { mode: 'e2c', word: entry.w, opts, answer: opts.findIndex(o => o.w === entry.w) };
};
/* 中译英四选一 */
App.quizC2E = function (entry) {
  const ds = App.glossDistractors(entry, 3);
  const opts = App.shuffle([entry].concat(ds)).map(e => ({ w: e.w, text: e.w }));
  return { mode: 'c2e', word: entry.w, opts, answer: opts.findIndex(o => o.w === entry.w) };
};
/* 拼写默写（给中文提示和首尾字母） */
App.quizSpell = function (entry) {
  return { mode: 'spell', word: entry.w, gloss: entry.gloss, hint: entry.w[0] + '…' + entry.w[entry.w.length - 1] };
};
/* 中英互译·打字模式（只给中文释义，完整默写） */
App.quizC2ET = function (entry) {
  return { mode: 'c2et', word: entry.w, gloss: entry.gloss, pos: entry.pos };
};
/* 听音辨词四选一 */
App.quizListen = function (entry) {
  const ds = App.glossDistractors(entry, 3);
  const opts = App.shuffle([entry].concat(ds)).map(e => ({ w: e.w, text: e.w }));
  return { mode: 'listen', word: entry.w, opts, answer: opts.findIndex(o => o.w === entry.w) };
};
App.quizFor = function (entry) {
  switch (App.quizMode(entry.w)) {
    case 'c2e': return App.quizC2E(entry);
    case 'spell': return App.quizSpell(entry);
    case 'listen': return App.quizListen(entry);
    case 'c2et': return App.quizC2ET(entry);
    default: return App.quizE2C(entry);
  }
};

/* ---- 词汇统计 ---- */
App.vocabStats = function () {
  const total = App.allWords().length;
  let learning = 0, mastered = 0, accC = 0, accW = 0;
  const boxes = [0, 0, 0, 0, 0, 0, 0];
  for (const w of Object.keys(App.store.srs)) {
    const r = App.store.srs[w];
    if (!App.WMAP()[w]) continue;
    boxes[r.b || 0]++;
    if (r.b >= 1) learning++;
    if (r.b >= 4) mastered++;
    accC += r.c || 0; accW += r.w || 0;
  }
  return { total, learning, mastered, boxes, acc: (accC + accW) ? Math.round(accC / (accC + accW) * 100) : null };
};

/* 各题型正确率序列（最近 n 个日期） */
App.typeTrend = function (n) {
  const types = { careful: '仔细阅读', matching: '长篇匹配', cloze: '选词填空', listening: '听力', vocab: '词汇' };
  const byDate = {};
  for (const r of (App.store.practice.reading || [])) {
    const t = App.today(r.d ? new Date(r.d) : undefined);
    (byDate[t] = byDate[t] || {})[r.type] = byDate[t][r.type] || [0, 0];
    byDate[t][r.type][0] += r.c; byDate[t][r.type][1] += r.t;
  }
  for (const r of (App.store.practice.listening || [])) {
    const t = App.today(r.d ? new Date(r.d) : undefined);
    (byDate[t] = byDate[t] || {})['listening'] = byDate[t]['listening'] || [0, 0];
    byDate[t]['listening'][0] += r.c; byDate[t]['listening'][1] += r.t;
  }
  for (const r of (App.store.practice.vocab || []).filter(v => !v.new)) {
    const t = App.today(r.d ? new Date(r.d) : undefined);
    (byDate[t] = byDate[t] || {})['vocab'] = byDate[t]['vocab'] || [0, 0];
    byDate[t]['vocab'][0] += r.ok ? 1 : 0; byDate[t]['vocab'][1] += 1;
  }
  const dates = Object.keys(byDate).sort().slice(-n);
  const series = {};
  for (const k of Object.keys(types)) series[k] = dates.map(t => {
    const p = byDate[t][k];
    return p ? Math.round(p[0] / p[1] * 100) : null;
  });
  return { dates, series, types };
};

/* 最弱题型（练习≥1次的，正确率最低） */
App.weakestType = function () {
  const agg = {};
  for (const r of App.store.practice.reading) {
    agg[r.type] = agg[r.type] || [0, 0];
    agg[r.type][0] += r.c; agg[r.type][1] += r.t;
  }
  let worst = null, worstRate = 2;
  for (const k of Object.keys(agg)) {
    if (agg[k][1] < 3) continue;
    const rate = agg[k][0] / agg[k][1];
    if (rate < worstRate) { worstRate = rate; worst = k; }
  }
  return worst;
};
App.TYPE_NAMES = { careful: '仔细阅读', matching: '长篇阅读', cloze: '选词填空' };
</script>
<script>/* ===== 本地智能批改引擎（写作 + 翻译）===== */
App.grader = {};

/* ---------- 基础资源 ---------- */
const G_STOP = new Set(('a an the and or but of to in on at for with by from as is are was were be been am do does did have has had will would can could may might must should this that these those it its there here not no so than then too very s t d ll re ve m o y our your my his her their we you they he she i us them me him if when while which who whom whose what where why how all any both each few more most other some such only own same upon into over under about after before between during through against above below up down out off again further once also just now'.split(' ')));

  ['in conclusion', '总结'], ['to sum up', '总结'], ['in summary', '总结'], ['overall', '总结'], ['in short', '总结']
];

const G_PATTERNS = [
  { re: /with the (rapid|fast|increasing|constant) (development|growth|advancement|progress) of/i, name: 'With the rapid development of...' },
  { re: /there is no denying that/i, name: 'There is no denying that...' },
  { re: /it is universally acknowledged that/i, name: 'It is universally acknowledged that...' },
  { re: /as far as i am concerned/i, name: 'As far as I am concerned...' },
  { re: /when it comes to/i, name: 'When it comes to...' },
  { re: /only (by|in this way|through)[^,.]{0,40} can we/i, name: 'Only by... can we...（倒装）' },
  { re: /it is high time (that|for)/i, name: 'It is high time...（虚拟）' },
  { re: /not only (does|is|are|can|will|has|have)\b/i, name: 'Not only 倒装' },
  { re: /hardly\b[^.]{0,60}\bwhen\b/i, name: 'Hardly... when...（倒装）' },

  { re: /\bplay(s|ed)? an (increasingly )?(important|vital|crucial|essential|indispensable) (role|part)\b/i, name: 'play an important role in...' },
  { re: /\bit is .{3,40} that\b/i, name: 'It is... that（强调/形式主语）' },
  { re: /\bnowadays\b|\bcurrently\b|\bin recent years\b|\bwith the age of\b|\bin an age when\b/i, name: '时代引入语（Nowadays/In recent years...）' }
];

const G_SYNONYMS = {
  important: 'crucial / vital / essential / indispensable',
  good: 'beneficial / favorable / positive',
  bad: 'detrimental / adverse / negative',
  many: 'numerous / a wealth of / a multitude of',
  much: 'a great deal of / substantial',
  think: 'argue / maintain / contend / hold the view that',
  'more and more': 'an increasing number of / a growing number of',
  very: 'exceedingly / remarkably / considerably',
  big: 'considerable / substantial / enormous',
  get: 'obtain / acquire / gain',
  help: 'facilitate / contribute to / assist',
  show: 'demonstrate / indicate / reveal',
  use: 'utilize / employ / adopt',
  thing: 'aspect / factor / element',
  people: 'individuals / the public / citizens',
  so: 'therefore / consequently / as a result',
  but: 'however / nevertheless / yet',
  also: 'furthermore / moreover / in addition',
  problem: 'issue / challenge / dilemma',
  because: 'owing to / due to / in that',
  now: 'currently / at present / nowadays'
};

const G_IRREG = { went: 'go', gone: 'go', better: 'good', best: 'good', worse: 'bad', worst: 'bad', more: 'much', most: 'much', less: 'little', least: 'little', felt: 'feel', thought: 'think', taught: 'teach', brought: 'bring', took: 'take', taken: 'take', made: 'make', wrote: 'write', written: 'write', said: 'say', saw: 'see', seen: 'see', grew: 'grow', grown: 'grow', knew: 'know', known: 'know', gave: 'give', given: 'give', found: 'find', told: 'tell', held: 'hold', kept: 'keep', left: 'leave', met: 'meet', paid: 'pay', ran: 'run', won: 'win', spoke: 'speak', spent: 'spend', understood: 'understand', wore: 'wear', children: 'child', men: 'man', women: 'woman', feet: 'foot', teeth: 'tooth', people: 'person' };

/* ---------- 分词与形态处理 ---------- */
App.grader.tokenize = function (text) {
  return (text.toLowerCase().match(/[a-z][a-z'-]*/g) || []);
};
/* 词形还原：给出候选链；若提供 dict 则返回词典中存在的首个候选 */
App.grader.lemmaCandidates = function (w) {
  const cands = [w];
  const push = x => { if (x && x.length >= 2 && !cands.includes(x)) cands.push(x); };
  if (w.length <= 3) return cands;
  if (w.endsWith('ies') && w.length > 4) push(w.slice(0, -3) + 'y');
  if (w.endsWith('sses') || w.endsWith('shes') || w.endsWith('ches') || w.endsWith('xes')) push(w.slice(0, -2));
  else if (w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us') && !w.endsWith('is')) push(w.slice(0, -1));
  if (w.endsWith('ied') && w.length > 4) push(w.slice(0, -3) + 'y');
  if (w.endsWith('ed')) {
    push(w.slice(0, -1));            // hated -> hate
    push(w.slice(0, -2));            // walked -> walk
    const b2 = w.slice(0, -2);
    if (b2.length >= 3 && b2[b2.length - 1] === b2[b2.length - 2]) push(b2.slice(0, -1)); // stopped -> stop
  }
  if (w.endsWith('ing')) {
    push(w.slice(0, -3) + 'e');      // making -> make
    push(w.slice(0, -3));            // reading -> read
    const b3 = w.slice(0, -3);
    if (b3.length >= 3 && b3[b3.length - 1] === b3[b3.length - 2]) push(b3.slice(0, -1)); // running -> run
  }
  if (w.endsWith('ly') && w.length > 4) push(w.slice(0, -2));
  if (w.endsWith('er') && w.length > 4) { push(w.slice(0, -1)); push(w.slice(0, -2)); }
  if (w.endsWith('est') && w.length > 5) { push(w.slice(0, -3) + 'y'); push(w.slice(0, -3)); }
  return cands;
};
App.grader.lemma = function (w, dict) {
  if (G_IRREG[w]) return G_IRREG[w];
  const cands = App.grader.lemmaCandidates(w);
  if (dict) { for (const c of cands) if (dict[c]) return c; return w; }
  return cands[cands.length - 1] !== w ? cands[1] || w : w;
};

/* 拼写检查：不在词典中的词（含形态还原尝试） */
App.grader.spellCheck = function (text) {
  const dict = App.WMAP();
  const unknown = new Set();
  for (const tok of App.grader.tokenize(text)) {
    const w = tok.replace(/['-]/g, '');
    if (!w || w.length < 3 || G_STOP.has(w)) continue;
    if (dict[w]) continue;
    const hit = App.grader.lemmaCandidates(w).some(c => dict[c]);
    if (!hit) unknown.add(tok);
  }
  return Array.from(unknown).slice(0, 12);
};

/* ---------- 写作批改 ---------- */
App.grader.gradeWriting = function (text) {
  const items = [];
  const add = (type, title, detail) => items.push({ type, title, detail });
  let score = 70;
  const dims = {};   // 六维度分（0-100）：篇幅/结构/衔接/句式/用词/拼写规范
  let hits = [];     // 命中的高级句式

  const words = App.grader.tokenize(text);
  const wc = words.length;
  const paras = text.split(/\n\s*\n|\n/).map(p => p.trim()).filter(p => p.length > 20);
  const sentences = text.split(/[.!?]+/).map(s => s.trim()).filter(s => App.grader.tokenize(s).length > 2);
  const sLens = sentences.map(s => App.grader.tokenize(s).length);

  // 1 词数
  if (wc < 100) { score -= 14; dims['篇幅'] = 35; add('bad', '篇幅不足', '全文仅 ' + wc + ' 词。六级要求 150–200 词，字数不足会直接拉低内容分。把每个分论点补一句解释或例证。'); }
  else if (wc < 150) { score -= 4; dims['篇幅'] = 60; add('warn', '篇幅偏短', '目前 ' + wc + ' 词，距 150 词下限还差一点，建议再扩展一个例证或让步段。'); }
  else if (wc <= 200) { score += 8; dims['篇幅'] = 95; add('good', '篇幅达标', '全文 ' + wc + ' 词，正好落在 150–200 词的理想区间。'); }
  else if (wc <= 230) { score += 2; dims['篇幅'] = 88; add('good', '篇幅合适', '全文 ' + wc + ' 词，内容充实，注意誊写时间即可。'); }
  else { score -= 3; dims['篇幅'] = 65; add('warn', '篇幅偏长', '全文 ' + wc + ' 词，超出上限较多，考场写不完反而丢分，学会精炼例证。'); }

  // 2 结构
  if (paras.length === 3) { score += 4; dims['结构'] = 92; add('good', '结构清晰', '全文三段，符合「引入—论证—总结」的经典结构。'); }
  else if (paras.length >= 2) { dims['结构'] = 70; add('info', '段落提示', '检测到 ' + paras.length + ' 个自然段。六级作文建议三段式：引出话题 → 展开论证 → 总结升华。'); }
  else { score -= 5; dims['结构'] = 40; add('bad', '缺少分段', '全文只有一段。请按「开头—主体—结尾」分段，阅卷老师非常看重结构分。'); }

  // 3 衔接词
  const lower = text.toLowerCase();
  const usedConn = G_CONNECTIVES.filter(([c]) => lower.includes(c));
  const distinct = new Set(usedConn.map(c => c[1])).size;
  if (usedConn.length >= 6 && distinct >= 3) { score += 8; dims['衔接'] = 92; add('good', '衔接丰富', '使用了 ' + usedConn.length + ' 处衔接词（如 ' + usedConn.slice(0, 4).map(c => c[0]).join('、') + '），逻辑连贯性好。'); }
  else if (usedConn.length >= 3) { score += 3; dims['衔接'] = 75; add('info', '衔接尚可', '检测到 ' + usedConn.length + ' 处衔接词。试着增加 However / Moreover / As a result 等不同类别的衔接，让段落内逻辑更顺。'); }
  else { score -= 6; dims['衔接'] = 50; add('warn', '衔接不足', '几乎没检测到衔接词。句子之间建议补充 However（转折）、Moreover（递进）、As a result（因果）等过渡。'); }

  // 4 句式多样性
  dims['句式'] = 70;
  if (sLens.length >= 3) {
    const avg = sLens.reduce((a, b) => a + b, 0) / sLens.length;
    const sd = Math.sqrt(sLens.reduce((a, b) => a + (b - avg) ** 2, 0) / sLens.length);
    const longS = sLens.filter(l => l > 32).length;
    if (sd >= 6.5) { score += 6; dims['句式'] += 12; add('good', '长短句结合', '句子长度富于变化（平均 ' + avg.toFixed(1) + ' 词/句），读起来有节奏感。'); }
    else { score -= 4; dims['句式'] -= 14; add('warn', '句长单一', '各句长度接近（平均 ' + avg.toFixed(1) + ' 词/句）。试着把某些短句合并成定语从句，或用 Only by.../Not until... 倒装句打破节奏。'); }
    if (longS > 0) { score -= Math.min(longS, 4); dims['句式'] -= Math.min(longS * 3, 15); add('warn', '存在过长句', longS + ' 个句子超过 32 词，容易产生语法错误。建议用逗号拆分或改为两句。'); }
    if (avg < 9) { score -= 2; dims['句式'] -= 8; add('warn', '句式过短', '平均每句不到 9 词，多为简单句。用 with 复合结构、定语从句、分词短语升级其中两三句。'); }
    // 6 句式/模板命中（并入句式维度）
    hits = G_PATTERNS.filter(p => p.re.test(text)).map(p => p.name);
    if (hits.length >= 3) { score += 6; dims['句式'] += 10; add('good', '亮点句式', '检测到 ' + hits.length + ' 处高级句式：' + hits.slice(0, 3).join('；') + '。'); }
    else if (hits.length >= 1) { add('info', '句式提示', '检测到 ' + hits.length + ' 处高级句式（' + hits[0] + '）。再埋入一个倒装或强调句，作文档次会明显提升。'); }
    else { score -= 2; dims['句式'] -= 8; add('warn', '句式保守', '未检测到倒装、强调、虚拟等亮点句式。参考「进阶句式」库，至少套用 1–2 个。'); }
  }

  // 5 高级词汇
  const advWords = words.filter(w => G_ADV.has(w) || (w.length >= 9 && !G_STOP.has(w)));
  const advRatio = wc ? advWords.length / wc : 0;
  if (advRatio >= 0.08) { score += 6; dims['用词'] = 92; add('good', '用词地道', '高级词汇占比约 ' + Math.round(advRatio * 100) + '%（如 ' + advWords.slice(0, 5).join('、') + '），词汇多样性出色。'); }
  else if (advRatio >= 0.04) { dims['用词'] = 75; add('info', '词汇提示', '高级词汇占比约 ' + Math.round(advRatio * 100) + '%。把部分基础词替换为更精准的表达会更有亮点。'); }
  else { score -= 2; dims['用词'] = 55; add('warn', '词汇平淡', '全文以基础词汇为主。尝试替换：important→crucial、think→argue、more and more→a growing number of。'); }

  // 7 拼写
  dims['拼写规范'] = 100;
  const unknown = App.grader.spellCheck(text);
  if (unknown.length) { score -= Math.min(unknown.length * 3, 12); dims['拼写规范'] -= Math.min(unknown.length * 8, 40); add('bad', '疑似拼写问题', '以下单词不在词库中，请核对拼写：' + unknown.join('、') + '。（专有名词可忽略）'); }

  // 8 用词重复（并入用词维度）
  const freq = {};
  for (const w of words) if (!G_STOP.has(w) && w.length >= 4) freq[w] = (freq[w] || 0) + 1;
  const overused = Object.keys(freq).filter(w => freq[w] >= 5).sort((a, b) => freq[b] - freq[a]).slice(0, 3);
  for (const w of overused) {
    score -= 2;
    dims['用词'] -= 4;
    const syn = G_SYNONYMS[w];
    add('warn', '「' + w + '」重复 ' + freq[w] + ' 次', syn ? '建议交替使用：' + syn + '。' : '尝试用同义词或代词替换，避免用词单调。');
  }

  // 9 格式与硬伤（并入拼写规范维度）
  const cn = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  if (cn > 5) { score -= 15; dims['拼写规范'] -= 40; add('bad', '混入中文', '检测到 ' + cn + ' 个中文字符——写作时记得切换输入法，中文词阅卷时按错误处理。'); }
  const badCaps = (text.match(/[.!?]\s+[a-z]/g) || []).length;
  const startLower = /^[a-z]/.test(text.trim());
  if (badCaps || startLower) { score -= Math.min(2 * (badCaps + (startLower ? 1 : 0)), 6); dims['拼写规范'] -= Math.min((badCaps + (startLower ? 1 : 0)) * 5, 20); add('warn', '句首未大写', '检测到 ' + (badCaps + (startLower ? 1 : 0)) + ' 处句首小写。每个句子的首字母务必大写。'); }
  const noSpace = (text.match(/[,;][A-Za-z]/g) || []).length + (text.match(/[a-z]\.[A-Z]/g) || []).length;
  if (noSpace > 2) { add('warn', '标点后缺空格', '检测到 ' + noSpace + ' 处逗号/句号后直接接单词，标点后应空一格。'); }
  const aAnErr = (text.match(/\ba\s+[aeiou]\w+/gi) || []).filter(t => !/^an? hour/i.test(t)).length;
  if (aAnErr) { add('warn', '冠词 a/an', '检测到 ' + aAnErr + ' 处「a + 元音开头单词」，元音前应用 an。'); }
  if (!/[.!?]\s*$/.test(text.trim())) { add('info', '结尾标点', '全文结尾似乎缺句号，记得收尾补上。'); }

  score = Math.max(40, Math.min(96, Math.round(score)));
  const dimList = ['篇幅', '结构', '衔接', '句式', '用词', '拼写规范'].map(n => ({ name: n, score: Math.max(25, Math.min(100, Math.round(dims[n] || 70))) }));
  const grade = score >= 90 ? '优秀' : score >= 80 ? '良好' : score >= 70 ? '中等' : score >= 60 ? '基本合格' : '待提高';
  const band = score >= 90 ? '13–14 分档' : score >= 80 ? '11–12 分档' : score >= 70 ? '9–10 分档' : score >= 60 ? '7–8 分档' : '6 分档以下';
  const summary = '综合评分 ' + score + '/100（预估 ' + band + '），等级：' + grade + '。全文 ' + wc + ' 词、' + sentences.length + ' 句、' + paras.length + ' 段。';
  return { score, grade, band, summary, items, wc, hits, unknown, dims: dimList };
};

/* ---------- 翻译批改 ---------- */
App.grader.lemmaSet = function (text) {
  const s = new Set();
  for (const tok of App.grader.tokenize(text)) {
    s.add(tok);
    if (G_IRREG[tok]) s.add(G_IRREG[tok]);
    for (const c of App.grader.lemmaCandidates(tok)) s.add(c);
  }
  return s;
};
App.grader.gradeTranslation = function (userText, passage) {
  const items = [];
  const add = (type, title, detail) => items.push({ type, title, detail });
  let score = 50;
  const userLemmas = App.grader.lemmaSet(userText);
  const refWords = App.grader.tokenize(passage.ref).length;
  const userWords = App.grader.tokenize(userText).length;
  const ratio = refWords ? userWords / refWords : 0;

  // 关键表达命中：关键词的任一形态出现在译文候选集合中即算命中
  let hits = 0;
  const detail = [];
  for (const k of passage.keys) {
    const kws = App.grader.tokenize(k.en).filter(t => !G_STOP.has(t) && t.length > 2);
    const ok = kws.length ? kws.every(t => App.grader.lemmaCandidates(t).some(c => userLemmas.has(c))) : false;
    if (ok) hits++; else detail.push(k);
  }
  const ratio2 = passage.keys.length ? hits / passage.keys.length : 0;
  score = 45 + ratio2 * 40;
  if (ratio2 >= 0.8) add('good', '关键表达到位', '核心表达命中 ' + hits + '/' + passage.keys.length + '，主要信息点基本覆盖。');
  else if (ratio2 >= 0.5) add('info', '关键表达尚可', '命中 ' + hits + '/' + passage.keys.length + '。对照下方未命中的表达，练习时要有意识地积累对应译法。');
  else add('warn', '关键表达缺失较多', '仅命中 ' + hits + '/' + passage.keys.length + '。翻译先抓核心表达（四六级常考中国文化/社会/科技固定译法），再看通顺。');

  // 长度
  if (ratio < 0.55) { score -= 8; add('bad', '译文过短', '你的译文 ' + userWords + ' 词，参考译文 ' + refWords + ' 词。大量信息点可能漏译，逐句核对中文原文。'); }
  else if (ratio < 0.8) { score -= 3; add('warn', '译文偏短', '约为参考译文的 ' + Math.round(ratio * 100) + '%，检查是否有整句漏译。'); }
  else if (ratio <= 1.35) { score += 6; add('good', '篇幅匹配', '译文长度约为参考译文的 ' + Math.round(ratio * 100) + '%，信息量适中。'); }
  else { score -= 3; add('warn', '译文偏长', '约为参考译文的 ' + Math.round(ratio * 100) + '%，可能存在过度增译或重复，汉语多短句，英文注意合并。'); }

  // 句子数
  const userS = userText.split(/[.!?]+/).filter(s => App.grader.tokenize(s).length > 2).length;
  const refS = passage.ref.split(/[.!?]+/).filter(s => App.grader.tokenize(s).length > 2).length;
  if (Math.abs(userS - refS) <= 1) { score += 4; add('info', '断句合理', '你的译文 ' + userS + ' 句，参考译文 ' + refS + ' 句。汉译英常需合并中文短句，用分词、从句衔接。'); }
  else if (userS > refS + 1) add('info', '断句提示', '你译成 ' + userS + ' 句（参考 ' + refS + ' 句）。中文多流水句，英译时尝试把两三个短句合并成一个带连接词或分词的长句。');
  else add('info', '断句提示', '你译成 ' + userS + ' 句（参考 ' + refS + ' 句）。长句堆砌容易出错，必要时拆分为两句。');

  // 拼写与硬伤
  const unknown = App.grader.spellCheck(userText);
  if (unknown.length) { score -= Math.min(unknown.length * 3, 12); add('bad', '疑似拼写问题', '请核对：' + unknown.join('、')); }
  const cn = (userText.match(/[\u4e00-\u9fff]/g) || []).length;
  if (cn > 3) { score -= 15; add('bad', '混入中文', '译文中有 ' + cn + ' 个中文字符，记得切换输入法。'); }
  const startLower = /^[a-z]/.test(userText.trim());
  if (startLower) { score -= 2; add('warn', '句首未大写', '译文开头小写了，英文每句首字母要大写。'); }

  score = Math.max(35, Math.min(96, Math.round(score)));
  const grade = score >= 90 ? '优秀' : score >= 80 ? '良好' : score >= 70 ? '中等' : score >= 60 ? '基本合格' : '待提高';
  const band = score >= 90 ? '13–14 分档' : score >= 80 ? '11–12 分档' : score >= 70 ? '9–10 分档' : score >= 60 ? '7–8 分档' : '6 分档以下';
  const dimList = [
    { name: '关键表达', score: Math.max(25, Math.min(100, Math.round(45 + ratio2 * 55))) },
    { name: '篇幅信息', score: ratio < 0.55 ? 40 : ratio < 0.8 ? 62 : ratio <= 1.35 ? 90 : 62 },
    { name: '断句衔接', score: Math.abs(userS - refS) <= 1 ? 88 : 68 },
    { name: '拼写规范', score: Math.max(30, 100 - unknown.length * 8 - (cn > 0 ? 40 : 0) - (startLower ? 5 : 0)) }
  ];
  return {
    score, grade, band,
    estCET: Math.round(score / 100 * 106.5),
    summary: '综合评分 ' + score + '/100（预估 ' + band + '），关键表达命中 ' + hits + '/' + passage.keys.length + '。',
    missedKeys: detail, items, ratio, dims: dimList
  };
};

/* ---------- 句子翻译评分 ---------- */
App.grader.gradeSentence = function (userText, item) {
  const items = [];
  const add = (type, title, detail) => items.push({ type, title, detail });
  const userLemmas = App.grader.lemmaSet(userText);
  const refWords = App.grader.tokenize(item.ref).length;
  const userWords = App.grader.tokenize(userText).length;
  let hits = 0;
  const missed = [];
  for (const k of item.keys) {
    const kws = App.grader.tokenize(k).filter(t => !G_STOP.has(t) && t.length > 2);
    const ok = kws.length ? kws.every(t => App.grader.lemmaCandidates(t).some(c => userLemmas.has(c))) : false;
    if (ok) hits++; else missed.push(k);
  }
  const ratio = item.keys.length ? hits / item.keys.length : 0;
  let score = 40 + ratio * 50;
  const lenRatio = refWords ? userWords / refWords : 0;
  if (lenRatio >= 0.6 && lenRatio <= 1.7) score += 8;
  else if (lenRatio < 0.4) { score -= 10; add('bad', '信息量不足', '你的译文 ' + userWords + ' 词，参考 ' + refWords + ' 词，可能漏译了部分信息。'); }
  if (/^[a-z]/.test(userText.trim())) { score -= 3; add('warn', '句首未大写', '英文句首字母应大写。'); }
  if (!/[.!?]\s*$/.test(userText.trim())) { add('info', '句末标点', '句末建议补上标点符号。'); }
  if ((userText.match(/[\u4e00-\u9fff]/g) || []).length > 0) { score -= 12; add('bad', '混入中文', '译文里混入了中文字符，注意切换输入法。'); }
  const unknown = App.grader.spellCheck(userText);
  if (unknown.length) { score -= Math.min(unknown.length * 4, 12); add('warn', '疑似拼写问题', '请核对：' + unknown.join('、')); }
  if (ratio === item.keys.length) add('good', '关键表达全部命中', '核心信息点完整，译文质量高。');
  else add(ratio >= 0.5 ? 'info' : 'warn', '关键表达命中 ' + hits + '/' + item.keys.length, missed.length ? '未译出的表达：' + missed.join('；') : '');
  if (lenRatio >= 0.6 && lenRatio <= 1.7) add('info', '篇幅匹配', '译文长度与参考译文相当（' + Math.round(lenRatio * 100) + '%）。');
  score = Math.max(30, Math.min(98, Math.round(score)));
  const grade = score >= 90 ? '优秀' : score >= 80 ? '良好' : score >= 70 ? '中等' : score >= 60 ? '基本合格' : '待提高';
  return {
    score, grade,
    summary: '关键表达命中 ' + hits + '/' + item.keys.length + '，译文 ' + userWords + ' 词（参考 ' + refWords + ' 词）。',
    hits, missed, items
  };
};
</script>
<script>/* ===== SVG 图表：折线图 / 柱状图 / 打卡日历 ===== */
App.charts = {};

/* 折线图 series: [{name,color,data:[{x,y}]}] */
App.charts.line = function (opts) {
  const W = 620, H = 250, PL = 40, PR = 14, PT = 16, PB = 30;
  const max = opts.max || 100, min = opts.min || 0;
  const xLabels = [];
  for (const s of opts.series) for (const p of s.data) if (!xLabels.includes(p.x)) xLabels.push(p.x);
  if (!xLabels.length) return '<div class="empty">暂无数据，快去练习吧</div>';
  const n = xLabels.length;
  const X = i => PL + (n === 1 ? (W - PL - PR) / 2 : i * (W - PL - PR) / (n - 1));
  const Y = v => PT + (1 - (v - min) / (max - min)) * (H - PT - PB);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">';
  for (const g of [0, 0.25, 0.5, 0.75, 1]) {
    const y = PT + g * (H - PT - PB);
    svg += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="#e6e9f2" stroke-width="1"/>';
    svg += '<text x="' + (PL - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="#8b93ab">' + Math.round(max - g * (max - min)) + (opts.yUnit || '') + '</text>';
  }
  const step = Math.ceil(n / 10);
  xLabels.forEach((lab, i) => {
    if (i % step === 0 || i === n - 1) svg += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="#8b93ab">' + lab.slice(5) + '</text>';
  });
  for (const s of opts.series) {
    const pts = s.data.map((p, i) => ({ x: X(xLabels.indexOf(p.x)), y: Y(p.y), v: p.y, lab: p.x }));
    let d = '', started = false;
    for (const p of pts) {
      if (p.y == null || p.v == null) { started = false; continue; }
      d += (started ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' ';
      started = true;
    }
    svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.2" stroke-linejoin="round"/>';
    for (const p of pts) {
      if (p.v == null) continue;
      svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.2" fill="' + s.color + '"><title>' + s.name + ' ' + p.lab + '：' + p.v + (opts.yUnit || '') + '</title></circle>';
    }
  }
  svg += '</svg>';
  let legend = '<div class="chart-legend">';
  for (const s of opts.series) legend += '<span><i class="dot" style="background:' + s.color + '"></i>' + s.name + '</span>';
  legend += '</div>';
  return svg + legend;
};

/* 雷达图 dims: [{name, score(0-100)}] */
App.charts.radar = function (dims) {
  const n = dims.length;
  if (n < 3) return '';
  const W = 240, H = 200, cx = W / 2, cy = H / 2 + 4, R = 72;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:280px;height:auto;display:block;margin:0 auto">';
  for (const g of [0.25, 0.5, 0.75, 1]) {
    let d = '';
    for (let i = 0; i < n; i++) { const [x, y] = pt(i, R * g); d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' '; }
    svg += '<path d="' + d + 'Z" fill="none" stroke="#e6e9f2" stroke-width="1"/>';
  }
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, R); svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#e6e9f2"/>'; }
  let d = '';
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, R * Math.max(0.05, dims[i].score / 100)); d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' '; }
  const col = dims.every(x => x.score >= 80) ? '#16a34a' : dims.some(x => x.score < 55) ? '#d97706' : '#6366f1';
  svg += '<path d="' + d + 'Z" fill="' + col + '22" stroke="' + col + '" stroke-width="2"/>';
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R * Math.max(0.05, dims[i].score / 100));
    svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="' + col + '"><title>' + dims[i].name + '：' + dims[i].score + '</title></circle>';
  }
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R + 16);
    svg += '<text x="' + x.toFixed(1) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="middle" font-size="10" fill="#5a6480">' + dims[i].name + ' ' + dims[i].score + '</text>';
  }
  svg += '</svg>';
  return svg;
};

/* 柱状图 data: [{label,value,color}] */
App.charts.bars = function (opts) {
  const W = 620, H = 210, PL = 40, PR = 10, PT = 14, PB = 26;
  const max = opts.max || Math.max(1, ...opts.data.map(d => d.value));
  const n = opts.data.length;
  if (!n) return '<div class="empty">暂无数据</div>';
  const bw = (W - PL - PR) / n;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">';
  for (const g of [0, 0.5, 1]) {
    const y = PT + g * (H - PT - PB);
    svg += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="#e6e9f2"/>';
    svg += '<text x="' + (PL - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="#8b93ab">' + Math.round(max - g * max) + (opts.yUnit || '') + '</text>';
  }
  opts.data.forEach((d, i) => {
    const h = (d.value / max) * (H - PT - PB);
    const x = PL + i * bw + bw * 0.18;
    svg += '<rect x="' + x.toFixed(1) + '" y="' + (H - PB - h).toFixed(1) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + Math.max(h, d.value > 0 ? 2 : 0).toFixed(1) + '" rx="5" fill="' + (d.color || '#6366f1') + '"><title>' + d.label + '：' + (opts.fmt ? opts.fmt(d.value) : d.value) + '</title></rect>';
    svg += '<text x="' + (PL + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="#8b93ab">' + d.label + '</text>';
    if (d.value > 0) svg += '<text x="' + (PL + i * bw + bw / 2).toFixed(1) + '" y="' + (H - PB - h - 4).toFixed(1) + '" text-anchor="middle" font-size="9.5" fill="#5a6480">' + (opts.fmt ? opts.fmt(d.value) : d.value) + '</text>';
  });
  svg += '</svg>';
  return svg;
};

/* 打卡日历（月视图）el 为容器 */
App.charts.calendar = function (el, base) {
  let cur = base ? new Date(base) : new Date();
  const render = () => {
    const y = cur.getFullYear(), m = cur.getMonth();
    const first = new Date(y, m, 1);
    const startPad = first.getDay();
    const daysIn = new Date(y, m + 1, 0).getDate();
    const todayStr = App.today();
    let html = '<div class="cal-nav"><button class="btn plain sm" data-act="prev">‹ 上月</button><b>' + y + '年' + (m + 1) + '月</b><button class="btn plain sm" data-act="next" ' + (App.today(cur) >= todayStr ? 'disabled' : '') + '>下月 ›</button></div>';
    html += '<div class="cal">';
    for (const h of ['日', '一', '二', '三', '四', '五', '六']) html += '<div class="h">' + h + '</div>';
    for (let i = 0; i < startPad; i++) html += '<div class="d off"></div>';
    for (let d = 1; d <= daysIn; d++) {
      const dt = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const st = App.store.days[dt];
      const sec = st ? st.sec : 0;
      let cls = 'd';
      if (sec >= App.CHECKIN_SEC) cls += ' on';
      else if (sec >= 120) cls += ' mid';
      if (dt === todayStr) cls += ' today';
      html += '<div class="' + cls + '" title="' + dt + (sec ? ' 学习 ' + App.fmtSec(sec) : ' 未学习') + '">' + d + '</div>';
    }
    html += '</div><div class="note" style="margin-top:8px">深色=达标打卡（≥' + App.CHECKIN_SEC / 60 + '分钟）· 浅色=有学习 · 悬停查看时长</div>';
    el.innerHTML = html;
    el.querySelector('[data-act=prev]').onclick = () => { cur = new Date(y, m - 1, 1); render(); };
    const nx = el.querySelector('[data-act=next]');
    if (nx && !nx.disabled) nx.onclick = () => { cur = new Date(y, m + 1, 1); render(); };
  };
  render();
};
</script>
<script>/* ===== 智能出题生成器 App.Gen =====
   按主题+题型程序化生成全新文章与题目，产出的 set 对象直接复用
   阅读专项的渲染器（render_careful / render_cloze）与练习记录。 */
App.Gen = {};
(function () {
  /* 可复现随机：mulberry32 */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let counter = 0;
  function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }
  function shuffle(r, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  App.Gen.themes = function () {
    const t = window.GEN_THEMES || {};
    return Object.keys(t).map(k => ({ key: k, label: t[k].label }));
  };

  function fill(text, nps, r) {
    // {np} 槽位依次从名词短语池取（不重复），首字母大写若在句首
    let i = 0;
    const used = new Set();
    return {
      text: text.replace(/\{np\}/g, () => {
        if (i >= nps.length) i = 0;
        let tries = 0, idx = Math.floor(r() * nps.length);
        while (used.has(idx) && tries < nps.length) { idx = Math.floor(r() * nps.length); tries++; }
        used.add(idx); i++;
        return nps[idx][0];
      }),
      used
    };
  }

  /* ---------- 仔细阅读生成（支持个性化：难度 + 生词本植入） ---------- */
  App.Gen.makeCareful = function (themeKey, opts) {
    opts = opts || {};
    const theme = (window.GEN_THEMES || {})[themeKey];
    if (!theme) return null;
    const seed = (Date.now() % 100000000) + (counter++);
    const r = rng(seed);
    const nps = shuffle(r, theme.nps);
    const facts = shuffle(r, theme.fact).slice(0, 6);
    const f0 = fill(facts[0].s, nps, r).text;
    const f1 = fill(facts[1].s, nps, r).text;
    const f2 = fill(facts[2].s, nps, r).text;
    const f3 = fill(facts[3].s, nps, r).text;
    const f4 = fill(facts[4].s, nps, r).text;
    const f5 = fill(facts[5].s, nps, r).text;
    const intro1 = fill(theme.intro[0], nps, r).text;
    const intro2 = fill(theme.intro[1], nps, r).text;
    const stance = fill(theme.stance, nps, r).text;
    const title = pick(r, theme.titles);

    // 词义猜测题：优先植入个性化词（生词本/我的词库），否则用主题目标词
    let tws = [];
    if (opts.seedWords && opts.seedWords.length >= 2) {
      tws = opts.seedWords.slice(0, 2).map(w => {
        const e = App.WMAP()[w];
        return [w, e ? e.gloss : ''];
      }).filter(x => x[1]);
    }
    if (tws.length < 2) tws = shuffle(r, theme.twPool).slice(0, 2);
    const otherTw = shuffle(r, Object.keys(window.GEN_THEMES).filter(k => k !== themeKey)
      .flatMap(k => window.GEN_THEMES[k].twPool).filter(x => !tws.some(t2 => t2[0] === x[0])));
    const sent1 = pick(r, ["To many observers, the change feels utterly {tw}.", "Yet the results have been remarkably {tw} so far.", "Some early attempts proved surprisingly {tw}."]).replace('{tw}', tws[0][0]);
    const sent2 = pick(r, ["Researchers describe the trend as {tw} for at least another decade.", "Officials called the progress {tw}, urging patience.", "Without support, such gains may remain {tw} for many families."]).replace('{tw}', tws[1][0]);

    const text = [
      intro1 + " " + intro2 + " " + f0,
      f1 + " " + sent1 + " " + f2 + " " + f3,
      sent2 + " " + f4 + " " + f5 + " " + stance
    ].join("\n\n");

    // 题目：2 细节 + 2 词义 + 1 主旨
    const qs = [];
    [[f0, facts[0]], [f1, facts[1]]].forEach(([sen, ft]) => {
      const npForQ = ft.q.includes('{np}') ? (sen.match(/(?:[A-Z][a-z]+ ?){1,3}/) || ['the trend'])[0] : '';
      qs.push({
        q: ft.q.replace(/\{np\}/g, npForQ || 'the change'),
        opts: shuffle(r, [ft.a, "It has no effect on ordinary people", "It disappeared after a short period", "Only large companies benefit from it"]),
        a: 0, // 占位，下面重算
        exp: "细节题。定位句：" + sen,
        _a: ft.a
      });
    });
    tws.forEach((tw, i) => {
      const ds = shuffle(r, otherTw).slice(0, 3).map(x => x[1]);
      const opts = shuffle(r, [tw[1]].concat(ds));
      qs.push({
        q: "The word \"" + tw[0] + "\" in the passage is closest in meaning to ______.",
        opts, a: opts.indexOf(tw[1]),
        exp: "词义猜测题。结合上下文与构词法推断，" + tw[0] + " 意为「" + tw[1] + "」；其余选项为词库中其他词的释义。"
      });
    });
    const summaries = shuffle(r, Object.keys(window.GEN_THEMES).filter(k => k !== themeKey))
      .slice(0, 3)
      .map(k => ({ k, s: "It discusses how " + window.GEN_THEMES[k].summary + "." }));
    summaries.push({ k: themeKey, s: "It discusses how " + theme.summary + "." });
    const mainOpts = shuffle(r, summaries.map(x => x.s));
    qs.push({
      q: "Which of the following best states the main idea of the passage?",
      opts: mainOpts, a: mainOpts.indexOf(summaries.find(x => x.k === themeKey).s),
      exp: "主旨题。全文围绕「" + theme.label + "」展开；其余选项偷换主题，文中并未论述。"
    });
    // 重算细节题答案索引
    qs.forEach(q => { if (q._a != null) { q.a = q.opts.indexOf(q._a); delete q._a; } });
    qs.forEach((q, i) => { q.q = (i === qs.length - 1 ? "" : "") + q.q; });

    return {
      id: 'gen-c-' + seed,
      title: title + '（智能生成 · ' + theme.label + '）',
      text,
      questions: qs.slice(0, 5),
      gen: true, theme: themeKey
    };
  };

  /* ---------- 选词填空生成 ---------- */
  const CLOZE_FRAMES = [
    { s: "Whether such policies can {b} the inequalities they inherit remains sharply contested among researchers.", pos: 'v', cue: "whether 主语从句后缺谓语动词原形，与 inequalities 搭配" },
    { s: "What looks like a purely {b} shift often carries consequences that reach far beyond its original context.", pos: 'adj', cue: "纯修饰语位置需要形容词，与 shift 搭配" },
    { s: "Underlying the debate is a deeper {b}: who bears the cost when circumstances change?", pos: 'n', cue: "形容词 deeper 后需要名词，冒号后为解释" },
    { s: "Officials responded to the evidence {b}, adjusting their targets only after the damage had been done.", pos: 'adv', cue: "修饰 responded 需要副词，与 after 从句语义呼应" },
    { s: "The committee has urged ministers to {b} rules that were drafted for conditions that no longer exist.", pos: 'v', cue: "不定式 to 后缺动词原形，与 rules 搭配" },
    { s: "What appears {b} in theory frequently proves far harder to deliver in practice.", pos: 'adj', cue: "系动词 appears 后需要形容词作表语" },
    { s: "Behind the statistics lies a {b} question: whether the gains are shared fairly across generations.", pos: 'adj', cue: "名词 question 前需要形容词作定语" },
    { s: "Several cities have tried to {b} the model, only to discover that copying a policy is easier than copying its conditions.", pos: 'v', cue: "不定式 to 后缺动词原形，与 only to 发现搭配" },
    { s: "The pace at which such arrangements are being {b} has caught many observers off guard.", pos: 'v', cue: "被动语态 be + 过去分词，与 arrangements 搭配" },
    { s: "Critics concede the ambition is admirable, yet question whether the {b} justifies the expense.", pos: 'n', cue: "定冠词 the 后需要名词，与 expense 并列对照" },
    { s: "The evidence, though still fragmentary, {b} that early intervention matters more than later correction.", pos: 'v', cue: "主语 evidence 为单数，缺谓语动词，与 that 从句搭配" },
    { s: "Few institutions are willing to {b} practices that have long defined their public identity.", pos: 'v', cue: "不定式 to 后缺动词原形，与 practices 搭配" }
  ];

  App.Gen.makeCloze = function (themeKey, opts) {
    opts = opts || {};
    const theme = (window.GEN_THEMES || {})[themeKey];
    if (!theme) return null;
    const seed = (Date.now() % 100000000) + 5000 + (counter++);
    const r = rng(seed);
    const exam = opts.level || (App.store.profile.exam || 'cet6');
    const tiers = exam === 'cet4' ? ['t4c', 't4h'] : ['t6h', 't6s', 't4h'];
    const bank = App.allWords().filter(w => tiers.includes(w.tier));
    const pool = pos => bank.filter(w => w.tier !== 'custom' && w.gloss && w.gloss.length <= 12 &&
      (pos === 'v' ? w.pos.startsWith('v') : pos === 'adj' ? w.pos.startsWith('adj') : pos === 'n' ? w.pos.startsWith('n') : w.pos.startsWith('adv')));
    const frames = shuffle(r, CLOZE_FRAMES).slice(0, 10);
    const nps = shuffle(r, theme.nps);

    const answers = [], exps = [], usedWords = new Set();
    let npIdx = 0;
    const sentTexts = frames.map((f, i) => {
      // 选正确词：先按词性从主题相关池抽（全局词库）
      let pool2 = pool(f.pos).filter(w => !usedWords.has(w.w));
      if (pool2.length < 4) pool2 = pool(f.pos).filter(w => !usedWords.has(w.w));
      const word = pool2[Math.floor(r() * pool2.length)] || pool(f.pos)[0];
      usedWords.add(word.w);
      answers.push(word);
      exps.push("第" + (i + 1) + "空需要" + ({ v: '动词', adj: '形容词', n: '名词', adv: '副词' }[f.pos]) +
        "（" + f.cue + "），结合语义选 " + word.w + "（" + word.gloss + "）。");
      let s = f.s.replace('{b}', '{' + (i + 1) + '}');
      // 嵌入主题名词短语（若句中有可替换的泛指名词短语）
      if (s.includes('the trend')) s = s.replace('the trend', nps[npIdx++ % nps.length][0] === undefined ? 'the trend' : pick(r, theme.nps)[0]);
      if (s.includes('the new situation')) s = s.replace('the new situation', pick(r, theme.nps)[0]);
      if (s.includes('the {b} of new technology')) s = s.replace('new technology', pick(r, theme.nps)[0]);
      return s;
    });
    const intro = fill(pick(r, theme.intro), nps, r).text;
    const stance = fill(pick(r, theme.stance), nps, r).text;
    const text = intro + "\n\n" + sentTexts.slice(0, 5).join(" ") + "\n\n" + sentTexts.slice(5).join(" ") + " " + stance;

    // 15 选项 = 10 答案 + 5 干扰（不同词性的库内词）
    const distractors = shuffle(r, bank.filter(w => !usedWords.has(w.w) && w.gloss && w.gloss.length <= 12)).slice(0, 5);
    const options = shuffle(r, answers.map(a => a.w).concat(distractors.map(d => d.w)));
    const a = answers.map(ans => options.indexOf(ans.w));
    const title = pick(r, theme.titles) + '（智能生成 · 15选10）';
    return {
      id: 'gen-k-' + seed,
      title, text, options, a, exp: exps,
      gen: true, theme: themeKey
    };
  };
  /* ---------- 题源自动补给 ----------
     规则：① 每天首次打开自动补充 1 篇仔细阅读 + 1 篇选词填空；
     ② 未做过的库存低于下限（各 2 篇）时自动补齐；
     ③ 生成题持久化保存、可回看重做；已做过的不再计入库存；
     ④ 总量超过 60 篇时自动裁剪最旧的已做题。 */
  App.Gen.MIN_STOCK = 2;
  App.Gen.GEN_CAP = 60;
  App.Gen.autoSupply = function (nowMs) {
    const today = App.today(new Date(nowMs || Date.now()));
    const st = App.store;
    if (!Array.isArray(st.genBank)) st.genBank = [];
    const seenIds = new Set((st.practice.reading || []).filter(r => String(r.id || '').indexOf('gen-') === 0).map(r => r.id));
    const isFresh = g => !seenIds.has(g.set.id);
    const newDay = st.genLastDate !== today;
    const themes = App.Gen.themes().map(t => t.key);
    let idx = st.genThemeIdx || 0;
    const added = { careful: 0, cloze: 0, themes: [] };

    const addFor = (type) => {
      const fresh = () => st.genBank.filter(g => g.type === type && isFresh(g)).length;
      const need = Math.max(0, App.Gen.MIN_STOCK - fresh()) + (newDay ? 1 : 0);
      let made = 0;
      for (let k = 0; k < need; k++) {
        const themeKey = themes[(idx + k) % themes.length];
        const set = type === 'careful' ? App.Gen.makeCareful(themeKey) : App.Gen.makeCloze(themeKey);
        if (!set) continue;
        st.genBank.push({ id: set.id, type, theme: themeKey, date: today, set });
        added.themes.push(themeKey);
        made++;
      }
      idx += Math.max(need, 1);
      return made;
    };
    added.careful = addFor('careful');
    added.cloze = addFor('cloze');
    st.genThemeIdx = idx;
    st.genLastDate = today;

    // 裁剪：超过上限时优先删除最旧的已做题
    while (st.genBank.length > App.Gen.GEN_CAP) {
      const doneIdx = st.genBank.findIndex(g => !isFresh(g));
      if (doneIdx >= 0) st.genBank.splice(doneIdx, 1);
      else st.genBank.shift();
    }
    if (added.careful + added.cloze > 0) App.save();
    return { careful: added.careful, cloze: added.cloze, newDay, stock: { careful: st.genBank.filter(g => g.type === 'careful' && isFresh(g)).length, cloze: st.genBank.filter(g => g.type === 'cloze' && isFresh(g)).length } };
  };
  /* 供界面展示：某题型的生成题列表 */
  App.Gen.bankFor = function (type) {
    return (App.store.genBank || []).filter(g => g.type === type);
  };
})();
</script>
<script>/* ===== 音频本地库（IndexedDB）：存放用户导入的真题原音 =====
   兼容性说明：以 file:// 方式双击打开时，部分浏览器会禁用 IndexedDB。
   本模块保证在不可用时优雅降级：查询返回空、写入给出友好错误，页面不崩溃。 */
App.audb = {
  _db: null,
  _broken: false,
  available() { return !this._broken; },
  open() {
    if (this._db) return Promise.resolve(this._db);
    if (this._broken) return Promise.reject(new Error('IndexedDB 不可用'));
    return new Promise((res, rej) => {
      let req;
      try {
        if (!window.indexedDB) throw new Error('浏览器未提供 IndexedDB');
        req = indexedDB.open('cet_audio', 1);
      } catch (e) {
        this._broken = true;
        rej(new Error('音频存储不可用（file:// 直开模式下浏览器会禁用本地数据库），听力音频导入功能暂不可用，其余功能不受影响'));
        return;
      }
      req.onupgradeneeded = e => { e.target.result.createObjectStore('audio'); };
      req.onsuccess = e => { this._db = e.target.result; res(this._db); };
      req.onerror = () => {
        this._broken = true;
        rej(new Error('音频存储打开失败，已降级运行（不影响其他功能）'));
      };
    });
  },
  async put(id, blob) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('audio', 'readwrite');
      tx.objectStore('audio').put(blob, id);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error || new Error('写入失败'));
    });
  },
  async get(id) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const req = db.transaction('audio').objectStore('audio').get(id);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => rej(req.error);
    });
  },
  async del(id) {
    const db = await this.open();
    return new Promise(res => {
      const tx = db.transaction('audio', 'readwrite');
      tx.objectStore('audio').delete(id);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
  },
  async keys() {
    try {
      const db = await this.open();
      return await new Promise(res => {
        const req = db.transaction('audio').objectStore('audio').getAllKeys();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    } catch (e) {
      return [];
    }
  }
};
</script>

/* 真题库工具：kind 识别与打开 */
App.retx = {
  kindOf(name) {
    const n = String(name || '').toLowerCase();
    if (/\.(mp3|wav|m4a|aac|ogg)$/.test(n)) return 'audio';
    if (/\.(pdf|doc|docx)$/.test(n)) return 'paper';
    return null;
  },
  async openFile(key, name) {
    const blob = await App.retdb.get(key).catch(() => null);
    if (!blob) { App.toast('文件不存在或已被清理'); return false; }
    const url = URL.createObjectURL(blob);
    if (this.kindOf(name) === 'audio') return { url, inline: true };
    const w = window.open(url, '_blank');
    if (!w) {
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return { opened: true };
  }
};

<script>/* ===== 即点即查词典 + 生词本 ===== */
App.dict = {};

/* 查词：词库 + 词典补充词 + 形态还原 */
App.dict.lookup = function (word) {
  const wm = App.WMAP();
  const w = String(word || '').toLowerCase().replace(/['-]/g, '');
  if (!w) return null;
  if (wm[w]) return wm[w];
  for (const c of App.grader.lemmaCandidates(w)) if (wm[c]) return wm[c];
  return null;
};

/* 把容器内的英文单词包上可点击 span */
App.dict.wrapWords = function (root) {
  const skipTags = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1, SELECT: 1, OPTION: 1, BUTTON: 1, TITLE: 1 };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (node) {
      const p = node.parentElement;
      if (!p || skipTags[p.tagName] || p.closest('.no-dict')) return NodeFilter.FILTER_REJECT;
      return /[A-Za-z]{2,}/.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const frag = document.createDocumentFragment();
    let last = 0;
    const text = node.nodeValue;
    const re = /[A-Za-z][A-Za-z'-]*[A-Za-z]|[A-Za-z]/g;
    let m;
    while ((m = re.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'dict-word';
      span.dataset.w = m[0];
      span.textContent = m[0];
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
};

App.dict.inBook = function (w) { return !!App.store.wordbook[w.toLowerCase()]; };

/* 纯功能词：点击只做友好提示，不进词典也不收藏 */
App.dict.SKIP = new Set(('the a an and or but of to in on at for with by from as is are was were be been being am do does did have has had will would can could may might must shall should if when while which who whom whose what where why how not no nor so than then too very it its this that these those there here we you they he she i us them me him my your our their his her hers mine yours ours theirs ourselves themselves itself myself yourself'.split(' ')));

App.dict.addToBook = function (w, src) {
  w = w.toLowerCase();
  if (App.store.wordbook[w]) { App.toast('已在生词本中'); return; }
  App.store.wordbook[w] = { d: App.today(), src: src || '查词' };
  if (!App.store.srs[w]) App.store.srs[w] = { b: 0, due: Date.now(), c: 0, w: 0 };
  App.save();
  App.toast('「' + w + '」已加入生词本，将进入今日复习队列');
};

App.dict.removeFromBook = function (w) {
  w = w.toLowerCase();
  delete App.store.wordbook[w];
  App.save();
};

/* 浮层 */
App.dict.init = function () {
  const pop = document.getElementById('dictPop');
  let curWord = null;

  function hide() { pop.style.display = 'none'; curWord = null; }

  function show(word, x, y, src, deferred) {
    const wl = word.toLowerCase();
    if (App.dict.SKIP.has(wl)) {
      pop.innerHTML = '<div class="dw">' + App.esc(word) + '</div><div class="dg">常用功能词（冠词/代词/助动词等），无需查询</div>';
      pop.style.display = 'block';
      const r0 = pop.getBoundingClientRect();
      pop.style.left = Math.min(Math.max(8, x - 20), window.innerWidth - r0.width - 12) + 'px';
      pop.style.top = Math.min(y + 18, window.innerHeight - r0.height - 10) + 'px';
      return;
    }
    if (deferred) {
      // 考试模式：先记录，交卷后统一显示释义
      if (App.dict.onDeferredLookup) App.dict.onDeferredLookup(wl);
      pop.innerHTML = '<div class="dw">' + App.esc(word) + ' <button class="ico-btn" data-act="speak2">🔊</button></div>'
        + '<div class="dg">已记录本次查词。<b>释义将在交卷后统一显示</b>（做题模式不分心）。可先加入生词本。</div>'
        + '<button class="ico-btn ' + (App.dict.inBook(wl) ? 'starred' : '') + '" data-act="book">' + (App.dict.inBook(wl) ? '✓ 已在生词本' : '＋ 加入生词本') + '</button>';
      pop.style.display = 'block';
      const rect = pop.getBoundingClientRect();
      pop.style.left = Math.min(Math.max(8, x - 20), window.innerWidth - rect.width - 12) + 'px';
      pop.style.top = Math.min(y + 18, window.innerHeight - rect.height - 10) + 'px';
      const sp2 = pop.querySelector('[data-act=speak2]');
      if (sp2) sp2.onclick = e2 => { e2.stopPropagation(); App.speak(wl); };
      pop.querySelector('[data-act=book]').onclick = e2 => {
        e2.stopPropagation();
        if (App.dict.inBook(wl)) { App.dict.removeFromBook(wl); App.toast('已从生词本移除'); }
        else App.dict.addToBook(wl, src || '做题查词');
        show(word, x, y, src, deferred);
      };
      return;
    }
    const entry = App.dict.lookup(word);
    curWord = word.toLowerCase();
    const inBook = App.dict.inBook(curWord);
    let html;
    if (entry) {
      const tierMeta = App.TIERS[entry.tier];
      const lvBadge = tierMeta
        ? '<span class="badge lv' + (tierMeta.lv || 2) + '">' + tierMeta.label + (entry.examSense ? ' · 常考义' : '') + '</span>'
        : (entry.lv ? '<span class="badge lv' + entry.lv + '">' + App.LV[entry.lv].name + '档</span>' : '<span class="tag">词典</span>');
      html = '<div class="dw">' + App.esc(entry.w) + ' <button class="ico-btn" data-act="speak">🔊 发音</button></div>'
        + '<div class="dp">' + (entry.ipa ? '<span>/' + App.esc(entry.ipa) + '/</span>' : '')
        + '<span>' + App.esc(entry.pos) + '</span>'
        + lvBadge
        + '</div><div class="dg">' + App.esc(entry.gloss) + '</div>'
        + (App.morph && entry.w.length >= 5 ? (function () {
            const mo = App.morph(entry.w);
            return mo ? '<div class="note" style="margin-bottom:8px">🧩 词根拆解：' + App.esc(mo.text) + '</div>' : '';
          })() : '')
        + '<button class="ico-btn ' + (inBook ? 'starred' : '') + '" data-act="book">' + (inBook ? '✓ 已在生词本' : '＋ 加入生词本') + '</button>'
        + (window.EXAMPLES && window.EXAMPLES[entry.w] ? '<div class="note" style="margin-top:9px;font-style:italic">' + App.esc(window.EXAMPLES[entry.w][0]) + '<br>' + App.esc(window.EXAMPLES[entry.w][1]) + '</div>' : '');
    } else {
      html = '<div class="dw">' + App.esc(word) + '</div>'
        + '<div class="dg">「' + App.esc(word.toLowerCase()) + '」暂未收录于内置词典</div>'
        + '<button class="ico-btn ' + (inBook ? 'starred' : '') + '" data-act="book">' + (inBook ? '✓ 已在生词本' : '＋ 仍要加入生词本') + '</button>';
    }
    pop.innerHTML = html;
    pop.style.display = 'block';
    const rect = pop.getBoundingClientRect();
    let left = Math.min(Math.max(8, x - 20), window.innerWidth - rect.width - 12);
    let top = y + 18;
    if (top + rect.height > window.innerHeight - 10) top = Math.max(8, y - rect.height - 12);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    pop.querySelector('[data-act=speak]') && (pop.querySelector('[data-act=speak]').onclick = e => { e.stopPropagation(); App.speak(entry.w); });
    pop.querySelector('[data-act=book]').onclick = e => {
      e.stopPropagation();
      if (App.dict.inBook(curWord)) { App.dict.removeFromBook(curWord); App.toast('已从生词本移除'); }
      else App.dict.addToBook(curWord, src);
      show(word, x, y, src);
      if (App.currentView === 'wordbook') App.go('wordbook');
    };
  }

  document.addEventListener('click', function (e) {
    const t = e.target.closest('.dict-word');
    if (t) {
      e.preventDefault();
      e.stopPropagation();
      // 考试模式：做题容器标记 data-defer 时，点击只记录、不显示释义
      const deferred = !!t.closest('[data-defer]');
      show(t.dataset.w || t.textContent, e.clientX, e.clientY, t.closest('[data-src]') ? t.closest('[data-src]').dataset.src : '练习页面', deferred);
      return;
    }
    if (!pop.contains(e.target)) hide();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  // 供其他视图（如词库列表行）直接打开弹层
  App.dict.open = show;
  App.dict.hide = hide;
};
</script>
