{id:"c1",title:"The Paradox of Automation and the Erosion of Deep Work",text:"Two centuries ago, English textile workers known as Luddites smashed the mechanical looms they blamed for their poverty. Their fears proved half right and half wrong: the machines did destroy their trades, but industrialization ultimately generated far more employment than it swept away. Economists have since treated the episode as reassurance that technological progress, though disruptive, is on balance beneficial to labor markets. \n\nThe rise of artificial intelligence has revived the debate with fresh urgency. Unlike earlier waves of automation, which replaced routine manual tasks, AI now performs cognitive work once considered secure: drafting legal documents, screening medical images, writing routine code. Surveys of firms that have adopted these tools report modest job losses so far, but a noticeable slowdown in hiring for entry-level positions; junior lawyers and customer-service representatives appear most exposed. The technology, one researcher observes, may be hollowing out career ladders rather than eliminating jobs outright. \n\nOptimists counter that such fears repeat an old mistake. Productivity gains lower the cost of goods and services, and the savings are spent elsewhere, stimulating demand in sectors that barely existed a decade ago; the app economy already employs millions of people whose job titles would have baffled a dictionary of the 1990s. What is genuinely new, skeptics reply, is the pace of change: an algorithm can spread across an entire industry overnight, whereas a displaced worker may need years to retrain. \n\nThe emerging consensus among labor economists is neither utopian nor apocalyptic. Mass unemployment is unlikely, but the transition costs will fall unevenly, concentrating on young and less experienced workers whose skills depreciate fastest. Whether artificial intelligence enriches or impoverishes the average citizen will depend less on the technology itself than on whether retraining programs, education systems and social insurance can adapt to a labor market that now changes faster than people do. History offers comfort, but it is not a policy. Nor is the adjustment machinery that exists equal to the task: public retraining schemes frequently steer the displaced toward occupations scheduled for automation in the very next cycle, unemployment insurance was architected for layoffs measured in weeks rather than years of requalification, and community colleges â the institutions best placed to reskill adults â remain among the most chronically underfunded links in the entire system. The result is a labor market that churns skilled people through short courses and then calls the output a transition.",questions:[
 {q:"The author introduces the Luddites in the first paragraph in order to ______.",opts:["provide a historical parallel whose incomplete lesson still shapes thinking today","blame English textile workers for delaying technological progress","illustrate how violently early protests against machines were suppressed","suggest that modern workers share the Luddites' occupational skills"],a:0,"exp":"目的题。作者以卢德分子开篇，是为引出经济学家从中得到的宽慰——技术进步虽有破坏但总体有利于就业市场，而后文将论证这一类比的不足。故A（提供一个教训并不完整、却仍影响今日思考的历史平行案例）正确。B、D曲解人物立场；C无中生有。"},
 {q:"The phrase \"a cottage industry of productivity applications\" suggests applications that are ______.",opts:["developed by a small-scale sector promising relief from distraction","produced by factories to industrialise cognitive work","officially certified to regulate platform notifications","designed by platform firms to raise engagement"],a:0,"exp":"词义猜测题。cottage industry 本义为小规模行业，此处修饰承诺隔离干扰的生产力应用，即小团队开发的防打扰应用；D 与文中其通知同样参与竞争相悖。"},
 {q:"What can be inferred about productivity applications from Paragraph 2?",opts:["Their developers profit from the very attention market they promise to fix.","They have restored engineers' capacity for sustained concentration.","They are required by field studies of workplace interruption.","They rarely deliver any feature users are willing to pay for."],a:0,"exp":"推断题。定位：其开发者很少承认自己的通知也在同一市场里竞争——可推知开发者本身从注意力经济中获利，A 正确；B、C 无据，D 偷换为收费话题。"},
 {q:"The author cites Europe's regulatory approach primarily to ______.",opts:["illustrate remedies that leave the underlying business model untouched","praise regulators for dismantling the attention market","contrast European and American attitudes to privacy","prove that focus modes have already become obsolete"],a:0,"exp":"推断题。末段将法规与付费专注模式归入 such remedies，而它们只是舀出船舱积水的权宜之计——作者举欧洲例子意在说明治标不治本，A 正确。"},
 {q:"Which of the following best summarises the passage?",opts:["Attention has become a commodity, and current fixes barely touch the incentive structure that exhausts it.","Knowledge workers should abandon productivity applications altogether.","The history of media panics proves that fears about attention are groundless.","Platform firms will inevitably reform their models under regulatory pressure."],a:0,"exp":"主旨题。全文链条：注意力成为商品→激励错位伤害深度工作→现有应用是同一市场玩家→监管与付费模式仍是权宜之计，A 概括最完整。"},

{id:"c2",title:"Sponges in the City",text:"For most of the twentieth century, cities treated rainwater as a nuisance: collect it in gutters, bury it in pipes, and expel it as quickly as possible. That logic produced impressive engineering, from vast underground tunnels to powerful pumping stations, and for decades it worked. But as climate change makes storms more violent and unpredictable, even cities with world-class drainage are drowning. When a single downpour can exceed what pipes designed for a calmer era were built to carry, the obvious response, laying bigger pipes, is becoming ruinously expensive. \n\nA growing number of planners argue that the wiser strategy is to stop fighting water and start absorbing it. The sponge city approach spreads many small interventions across the urban landscape: pavements that let rain seep through, gardens planted on rooftops, wetlands restored at the edges of districts, and roadside trenches filled with vegetation that catch runoff. Each measure is modest on its own; together they aim to make a city behave less like plastic wrap and more like a forest floor. \n\nThe benefits extend beyond flood control. Vegetated surfaces cool overheated streets, filtered rainwater refills underground aquifers, and the new green space doubles as public parkland. Yet the approach has critics. Sponge measures absorb moderate showers well but can be overwhelmed by the extreme storms that are becoming ever more common. Environmentalists also warn of green gentrification: attractive parks raise nearby property values, quietly pushing out the lower-income residents whom such projects were supposed to serve. \n\nThe most sensible conclusion is that green and gray infrastructure are complements, not rivals. Pipes remain indispensable for the heaviest downpours, while spongy surfaces absorb the ordinary rain between them. What determines success, however, is less the technology than the governance behind it: sustained maintenance budgets, cooperation among municipal departments that rarely speak to one another, and residents who feel ownership of the green spaces at their doorstep. Recent history supplies a cautionary footnote: one pioneering city slashed maintenance budgets within two years of celebrating its first sponge district, and the following summer's storms found the permeable pavements clogged and the rain gardens waterlogged beyond function. Infrastructure, sponge advocates now concede, is less a project than a promise renewed annually â a discipline that applies with equal force to pipes, parks and the people hired to tend them.",questions:[
 {q:"The first paragraph suggests that cities' traditional approach to rainwater failed because ______.",opts:["it was conceived for a climate that no longer exists","municipal governments stopped funding drainage long ago","engineers favored pumping stations over tunnels","residents objected to underground construction"],a:0,"exp":"推断题。定位首段：旧逻辑为更温和的年代而设计，而气候变化使暴雨更猛烈更难预测，一场降雨即可超过设计输送量——可见失效根源在于设计所依据的气候前提已不复存在。故A正确。"},
 {q:"The word modest in Paragraph 2 most probably means",opts:["limited in scale","cautious in attitude","cheap in price","friendly to the environment"],a:0,"exp":"定位第二段末：每项措施本身规模有限，合起来却能让城市像森林地表一样吸水，故modest此处指规模小。C利用其可表价格低之义偷换概念。"},
 {q:"The author quotes the sponge city advocates' concession about maintenance in order to ______.",opts:["underscore that sustaining infrastructure is a continuing commitment rather than a one-off project","mock the movement for abandoning its earliest achievement","shift responsibility for flooding from planners to residents","prove that permeable pavements never function as designed"],a:0,"exp":"目的题。定位末段：拥护者承认维护预算被削减后透水铺装堵塞、雨水花园失效——举此例强调海绵设施需要年年续约式的持续投入，A正确。"},
 {q:"What is the author's attitude toward the sponge city approach?",opts:["Uncritically enthusiastic.","Favorable yet aware of its limits.","Strongly skeptical of its feasibility.","Indifferent to its social side effects."],a:1,"exp":"第三段先列举益处，再指出极端暴雨下可能失效及绿色绅士化的隐忧；末段主张绿色与灰色互补。作者总体赞同而有所保留，故B正确。"},
 {q:"It can be learned from the last paragraph that the success of urban water management ultimately depends on ______.",opts:["complementary infrastructure combined with sustained governance","a complete replacement of pipes by sponge measures","the frequency of extreme storms in a given year","the speedy expansion of green space alone"],a:2,"exp":"末段点明：绿色与灰色基建互补，而成败更取决于治理——持续的维护预算、跨部门协作与居民认同。故C概括最完整。"},

{id:"c3",title:"The Loneliness of the Connected Generation",text:"Young adults in most developed countries now report higher rates of loneliness and anxiety than any other age group, a finding that has hardened into a public-health concern. The puzzle is that this is the most connected generation in history: messages flow constantly, social media profiles are meticulously maintained, and yet the sense of isolation deepens. Something in the texture of modern social life, researchers suspect, is failing to nourish what loneliness measures. \n\nOne explanation concerns the quality of attention. Digital communication is efficient, but it is thin: a stream of brief messages and quick reactions demands little and offers less. Psychologists note that a sense of belonging grows from slower, unplanned, face-to-face interaction, precisely the kind that scheduling apps and status updates have squeezed out. Economic pressures compound the problem: young people working irregular hours or juggling several jobs have neither the time nor the money for the clubs, teams and shared meals where friendships once formed. \n\nWhat actually helps? The evidence does not simply favor digital abstinence. Strict detox experiments often fail because they remove contact without replacing it. More promising are programs that rebuild low-stakes in-person rituals: university courses organized around shared meals, community workshops, sports leagues open to beginners. Therapists add a caution: treating every ordinary worry as a disorder can persuade people that they are fragile, when some anxiety is a proportionate response to genuinely difficult circumstances. \n\nThe deeper lesson may be that loneliness is not a private failing but a design problem. Workplaces, campuses, neighborhoods and even the platforms themselves can be arranged either to isolate people or to bring them together. If the roots of the epidemic are architectural and social, then blaming individuals for their screen time misreads the situation. The task is not to log off but to rebuild the settings in which connection used to happen. A quiet corollary is spreading through the research: measurement itself has become part of the problem. When a university counts volunteer hours to prove its students are engaged, engagement turns into a box to tick; when a hospital logs loneliness as a diagnosis, the diagnosis begins to stand in for the conversation it should have prompted. The instruments designed to detect the epidemic are quietly teaching institutions to respond to the paperwork rather than to the person.",questions:[
 {q:"The paradox presented in Paragraph 1 consists in the fact that ______.",opts:["the generation with the densest digital contact reports the deepest isolation","older adults have begun to outnumber the young on social platforms","loneliness among the young has declined while anxiety has risen","messages flow constantly but are rarely answered in time"],a:0,"exp":"细节题。定位首段：报告孤独与焦虑比例最高的恰是史上联系最紧密的一代——联系密度与孤独程度并置构成悖论。故A正确。"},
 {q:"The word thin in Paragraph 2 most probably means",opts:["physically slim","unreliable in transmission","lacking in depth and substance","costly to maintain"],a:2,"exp":"定位第二段：数字交流高效却单薄，即简短消息与快速反应要求少、给予也少，与下文面对面互动形成对照，故thin指缺乏深度与实质。C正确。"},
 {q:"What can be inferred about strict digital detox experiments?",opts:["Their failure shows that willpower matters most.","They may fail because they cut off contact without offering substitutes.","They prove that social media does more good than harm.","They work best when combined with professional therapy."],a:1,"exp":"定位第三段：严格戒断实验往往失败，因为它们切断了现有的联系方式却未提供任何替代渠道——可见问题不在于使用数字工具本身，而在于缺少有意义的面对面互动来取代它。故B正确。"},

<script>window.READING_MATCHING=[
{id:"m1",title:"The Office Is Dead—Long Live Work",paras:[
["A","When the pandemic swept across the globe in 2020, millions of office workers suddenly packed their laptops and went home. What began as an emergency measure has turned into a lasting transformation of how, where and when we work. Four years later, companies around the world are still arguing about whether the office will ever return to its old form — and the answer, increasingly, seems to be that it will not."],
["B","The most visible change is the rise of hybrid work, in which employees split their week between home and the office. Surveys of large firms show that a majority of knowledge workers now expect at least two remote days per week, and many say they would consider changing jobs if forced back full time. For employers, the office is no longer the default workplace but one option among several."],
["C","Not every job can be done from a kitchen table, of course. Nurses, factory workers, drivers and chefs cannot telecommute, and economists worry that a two-tier workforce is emerging: one group enjoying flexibility and shorter commutes, another tied to fixed shifts and locations. Several governments are experimenting with policies — such as the right to request flexible hours — to spread those benefits more evenly."],
["D","Cities are quietly adapting to the new normal. In downtown districts that once bustled at noon, cafes and sandwich shops have seen sales fall by a third, while suburban high streets report the opposite. Some city governments are converting empty office towers into apartments, hoping to revive neighborhoods that emptied out almost overnight."],
["E","Employers, for their part, have discovered that remote work can widen the talent pool. A software firm in London can now hire a programmer living three time zones away, and parents who once dropped out of the labor force are returning on flexible schedules. Hiring managers report that job candidates now routinely ask about remote options before they ask about salary."],
["F","Yet the shift has a darker side. Studies of remote teams find that junior staff learn less when senior colleagues are not nearby to mentor them, and that spontaneous conversations — the ones that often spark new ideas — largely disappear. Some firms have responded by redesigning offices around collaboration, cutting the number of desks and adding meeting lounges, whiteboard walls and quiet booths."],
["G","Trust is the new currency of management. When managers cannot see their teams, many have replaced close supervision with clear goals and measured results. Employees who deliver are given more freedom; those who miss targets face conversations that are less about hours logged and more about outcomes. Not every manager welcomes this change, but few can ignore it."],
["H","Technology firms have rushed to meet the demand for virtual collaboration. Video-conferencing platforms, shared documents and chat tools now form the digital office where much of the actual work happens. Critics point to endless video calls as a poor substitute for face-to-face contact, and psychologists have coined the phrase video-call fatigue to describe the exhaustion many workers report."],
["I","Whatever the final balance between home and office turns out to be, few observers expect a full return to the pre-pandemic pattern. Work has been untethered from a single place, and both employers and employees have discovered new degrees of freedom. The challenge for the coming decade is to keep the flexibility while rebuilding the trust, mentoring and shared purpose that offices once provided."]
],items:[
{stmt:"Remote work enables companies to recruit employees from much wider geographic areas.",a:"E",exp:"E段提到雇主发现远程办公能扩大人才库（widen the talent pool），软件公司可跨时区招聘，与该句匹配。"},
{stmt:"Some junior employees may receive less guidance from experienced colleagues when working from home.",a:"F",exp:"F段指出初级员工在资深同事不在身边时学到的更少（junior staff learn less...mentor），对应远程办公的负面影响。"},
{stmt:"Local food businesses in city centers have suffered as fewer workers commute daily.",a:"D",exp:"D段描述市中心咖啡馆和三明治店销售额下降三分之一，对应城市商业因通勤减少而受冲击。"},
{stmt:"Managers are learning to evaluate staff by results rather than by direct observation.",a:"G",exp:"G段提出信任成为管理新货币，管理者以目标和结果取代近距离监督（less about hours logged and more about outcomes）。"},
{stmt:"A growing number of workers now expect to divide their working week between home and the office.",a:"B",exp:"B段介绍混合办公的兴起，多数知识型员工希望每周至少两天远程，与该句直接对应。"}
]},
{id:"m2",title:"Big Data: Convenience at a Price",paras:[
["A","Every time you unlock a smartphone with your face, stream a song or pay for coffee with a tap, you leave behind a trail of data. Collected at enormous scale, such traces have become one of the most valuable resources of the modern economy — and one of the least understood by the people who generate them."],
["B","The commercial power of data is easy to illustrate. Retailers analyze purchase histories to predict what shoppers will want next week; navigation apps merge millions of drivers' locations to forecast traffic; streaming services claim to know our tastes better than we do. Personalized services, once a novelty, are now the price of admission to the digital marketplace."],
["C","For consumers, the bargain usually looks attractive: free apps, tailored recommendations and faster service in exchange for information about habits, preferences and movements. But the terms of that bargain are rarely spelled out. Lengthy privacy policies are written for lawyers rather than ordinary readers, and researchers find that most users simply click 'agree' without understanding what they have surrendered."],
["D","The risks extend well beyond targeted advertising. Data breaches at major companies have exposed the personal details of hundreds of millions of people, fueling fraud and identity theft on an industrial scale. Criminals no longer need to steal your wallet when they can buy your birth date, address and password history online for a few dollars."],
["E","Governments have begun to respond. Europe's General Data Protection Regulation, introduced in 2018, gave citizens new rights to inspect and delete their data and imposed heavy fines on companies that mishandle it. Similar frameworks have since appeared across Asia and Latin America, though enforcement varies widely and global platforms often comply with the letter of the law rather than its spirit."],
["F","Meanwhile, the technology itself keeps evolving. Machine-learning systems can now infer sensitive facts — health conditions, political leanings, even emotional states — from data as ordinary as typing speed or shopping baskets. People who have never shared such information directly can nonetheless have it inferred about them, a possibility that traditional privacy rules never anticipated."],
["G","Some firms argue that strong privacy rules slow innovation and hand advantages to giants with legal teams. They point to features such as fraud detection and epidemic tracking that depend on broad access to data. Privacy advocates reply that protecting citizens is precisely what forces companies to design better, more careful systems."],
["H","A quieter change is happening inside companies themselves. A growing number of businesses now appoint data-protection officers, encrypt information by default and collect only what a service genuinely needs — a principle known as data minimization. Some see this as an expensive burden; others report a surprising side effect, namely that smaller, cleaner datasets often improve the quality of their analysis."],
["I","The debate over data is ultimately a debate about power. Whoever controls information about billions of daily actions can shape prices, opinions and even elections. Finding a balance between the convenience that data delivers and the autonomy it quietly takes away may prove one of the defining challenges of the digital age."]
],items:[
{stmt:"Most users accept privacy agreements without actually reading them.",a:"C",exp:"C段指出隐私条款为律师而写，研究表明多数用户只是点'同意'（click 'agree' without understanding），与该句对应。"},
{stmt:"Machine-learning systems can now predict personal traits from everyday behavior data.",a:"F",exp:"F段说明机器学习能从打字速度、购物篮等普通数据推断健康、政治倾向等敏感信息，即传统规则未预料到的推断能力。"},
{stmt:"Advocates of strict regulation argue it leads to better-designed systems.",a:"G",exp:"G段末尾隐私倡导者回应称，保护公民隐私恰恰会迫使企业设计更好、更严谨的系统。"},
{stmt:"Large-scale data leaks have turned personal information into a resource for criminals.",a:"D",exp:"D段提到重大数据泄露事件暴露数亿人信息，助长产业化诈骗；罪犯可在网上低价买到他人信息。"},
{stmt:"Several businesses find that collecting less data can actually improve their analysis.",a:"H",exp:"H段提到数据最小化原则的意外副作用——更小更干净的数据集反而提升了分析质量。"}
]},
{id:"m3",title:"Learning Should Never Graduate",paras:[
["A","For most of the twentieth century, education followed a simple script: school, then university, then a lifetime of work with the occasional training course. That script is rapidly going out of print. Accelerating technological change, longer careers and the erosion of the job-for-life ideal are pushing learning into every corner of adult life."],
["B","The scale of reskilling now required is enormous. A widely cited estimate suggests that a large share of workers will need significant retraining within a decade as automation reshapes their roles. Truck drivers, accountants, radiologists — few occupations will escape some form of transformation, and the skills that protect a career today may not protect it in five years."],
["C","Employers have noticed. Where companies once recruited fully formed graduates and left further development to the individual, many now run internal academies, partner with online platforms and treat learning budgets as strategic investments. Some firms have begun hiring for potential rather than credentials, arguing that the ability to learn quickly outweighs any fixed stock of knowledge."],
["D","Universities face uncomfortable questions about their role. Enrollments in traditional degree programs have stagnated in several countries, while demand for short, stackable certificates keeps growing. Institutions that once guarded the gates of knowledge are experimenting with lifelong alumni accounts, subscription models and courses aimed squarely at mid-career professionals."],
["E","The online-education boom, supercharged by the pandemic, lowered the barriers dramatically. Anyone with a phone can now audit lectures from world-class universities, join global study groups and earn certificates at little or no cost. Completion rates remain low, and skeptics question the value of many free credentials, but the direction of travel is unmistakable."],
["F","Companies also report a shift in what they look for. Memorized facts depreciate quickly in the age of instant search, so recruiters increasingly test for judgment, communication and the capacity to absorb new tools quickly. In interviews, evidence that a candidate has taught himself a new programming language or analytics platform often counts for more than a list of certificates."],
["G","Governments are joining in as well. Singapore's SkillsFuture program gives every adult citizen a credit account for approved courses; France has created an individual learning account that workers carry between jobs. The idea spreading through ministries is that training should be treated like infrastructure — funded continuously rather than as a one-off emergency measure."],
["H","Psychologists add a warning: adults do not learn like teenagers. Motivation, confidence and prior beliefs shape outcomes as much as course quality does. Programs that work treat learners as busy adults, offering bite-sized units, immediate application to real tasks and visible progress, rather than the lecture-and-exam format many adults still associate with being judged."],
["I","The phrase lifelong learning has been a cliché for decades. The difference today is that it has become an economic necessity rather than a slogan. The individuals, companies and countries that build habits and institutions around continuous learning will define the next era; those that treat education as a phase of life may find the future arriving without them."]
],items:[
{stmt:"Many employers now value a person's ability to learn over their existing qualifications.",a:"C",exp:"C段提到一些公司以潜力而非文凭招人（hiring for potential rather than credentials），认为快速学习能力比固定知识储备更重要。"},
{stmt:"Some governments now finance adult education continuously through personal credit accounts.",a:"G",exp:"G段列举新加坡SkillsFuture和法国个人学习账户，说明政府把培训当作持续性基础设施来投入。"},
{stmt:"Demand for traditional university degrees has weakened in some countries.",a:"D",exp:"D段指出多国传统学位课程入学人数停滞（stagnated），而短期可累积证书需求增长。"},
{stmt:"Recruiters increasingly emphasize judgment and adaptability rather than memorized knowledge.",a:"F",exp:"F段说明即时搜索时代记忆的事实迅速贬值，招聘者更看重判断力、沟通力和快速吸收新工具的能力。"},
{stmt:"A large proportion of the workforce is expected to need retraining because of automation.",a:"B",exp:"B段开头引用广被引用的估计：未来十年大量劳动者需再培训，因为自动化正在重塑岗位。"}
]}
];

{id:"k1",title:"Why Sleep Matters for Learning",text:"Students often sacrifice sleep to squeeze in more study hours, but research suggests this strategy may backfire. Sleep plays an (1)____ role in memory formation: while we rest, the brain replays and strengthens the neural patterns formed during the day. Experiments consistently show that people who sleep after learning a new task (2)____ significantly better on later tests than those who stay awake all night.\n\nThe reason lies in what neuroscientists call memory (3)____. During deep sleep, the brain transfers fragile new memories into long-term storage, a process that cannot be rushed. Cutting the night short interrupts this transfer, leaving memories weak and easily forgotten. Even a single night of (4)____ sleep can measurably lower attention and problem-solving (5)____ the following day.\n\nPoor rest also has indirect effects. Tired students find it harder to concentrate in class, so they absorb less material in the first place. Over time a vicious cycle develops: late nights produce daytime fatigue, fatigue produces inefficient study, and inefficient study produces yet more late nights. Researchers now warn that chronic sleep (6)____ among teenagers should be treated as a public-health concern rather than a private choice.\n\nThe good news is that the solution costs nothing. Experts recommend a (7)____ bedtime, a cool and dark bedroom, and a break from screens before sleep. Caffeine, though genuinely helpful in the morning, (8)____ the brain's natural sleep chemicals if consumed in the afternoon. Above all, students should treat sleep as part of the study plan rather than its enemy. A well-rested brain learns faster, remembers longer and makes fewer mistakes — which means the (9)____ way to earn better grades may be, paradoxically, to spend more hours (10)____.",
options:["asleep","blocks","consistent","consolidation","decline","deprivation","efficiency","essential","evidence","inadequate","perform","recovery","schedule","smartest","thrive"],

{id:"k2",title:"Social Media and the Teenage Mind",text:"Teenagers now spend an average of nearly five hours a day on social media, and psychologists are only beginning to understand what this means for their development. The effects are neither uniformly good nor uniformly bad; they (1)____ depending on how, when and why young people use these platforms.\n\nPositive uses are easy to find. Shy teenagers may (2)____ lasting friendships online that they struggle to form in person. Young artists and musicians can (3)____ their work with a global audience instead of waiting for a talent scout. Some researchers even argue that online communities (4)____ vital support for teenagers who feel (5)____ among their classmates at school.\n\nBut heavy use carries real risks. Notifications are deliberately designed to be (6)____: each new like delivers a small reward that keeps users checking their phones dozens of times an hour. Studies link late-night scrolling to poor sleep, and poor sleep to lower grades and darker moods. More troubling is the (7)____ problem: when teenagers endlessly view carefully edited images of other people's holidays, parties and achievements, many conclude that their own lives (8)____ short by comparison.\n\nWhat can parents actually do? Banning phones outright rarely works and often (9)____, driving the habit underground rather than ending it. Experts recommend quieter strategies: setting phone-free hours for the whole family, talking openly about how images are edited, and encouraging teenagers to (10)____ on how each app makes them feel. The goal is not to eliminate social media but to raise users who control the tool rather than being controlled by it.",

a:[14,4,13,10,8,0,2,6,1,12],
exp:["第1空：主语 they 指代 effects，缺谓语动词，与 depending on 呼应，选 vary（因情况而异）。","第2空：情态动词 may 后缺动词原形，与 friendships 搭配，选 discover（发现/结下友谊）。","第3空：情态动词 can 后缺动词原形，与 work with a global audience 搭配，选 share（分享）。","第4空：that 从句缺谓语，与 vital support 搭配，选 provide（提供支持）。","第5空：feel 后需要形容词作表语，与 among classmates 呼应，选 isolated（感到孤立的）。","第6空：be (6)____ 作表语，说明通知的设计目的，与后文 tiny reward 呼应，选 addictive（令人上瘾的）。","第7空：the (7)____ problem，需要名词，由后文 view edited images of others' lives 可知是比较问题，选 comparison。","第8空：主语 their own lives 缺谓语，与 short by comparison 搭配，选 fall（fall short 不及、达不到）。","第9空：主语动名词短语 Banning phones 缺谓语，且由 often 修饰，选 backfires（事与愿违）。","第10空：encourage sb to (10)____，缺动词原形，与 on how each app makes them feel 搭配，选 reflect（反思）。"]},
{id:"k3",title:"Greening the Concrete Jungle",text:"Cities are usually described as concrete jungles, yet planners around the world are working hard to make that phrase obsolete by (1)____ green space at every opportunity. Rooftop gardens, pocket parks and planted sidewalks are appearing from Singapore to Milan, and the benefits are turning out to be far greater than mere beauty.\n\nUrban trees directly (2)____ summer temperatures by casting shade and releasing moisture, and on hot days a tree-lined street can be several degrees (3)____ than a bare one nearby. Green roofs and gardens also absorb rainwater during storms, easing the pressure on city (4)____ that were built decades ago for a smaller population. Leaves meanwhile trap airborne dust and absorb harmful gases, cutting urban air (5)____ in the streets below.\n\nThe benefits reach beyond the physical environment. Hospital studies have found that patients with windows facing (6)____ recover faster and need less pain medication than those staring at walls. Surveys of city residents report lower levels of (7)____ among people who live within a short walk of a park, and schools surrounded by trees show measurably calmer playgrounds.\n\nUrban trees, however, endure (8)____ conditions: soil compacted by feet and machines, little room for roots, and winter salt sprayed from icy roads. Careful (9)____ of species therefore matters more than it might seem — a tree that thrives in one climate may struggle in another. Once regarded as simple (10)____, street trees are now recognized as serious infrastructure, as vital to a healthy city as pipes and pavements.",

<script>window.WRITING_TOPICS=[
{id:"w1",cat:"科技与人工智能",title:"Directions: For this part, you are allowed 30 minutes to write an essay on the impact of artificial intelligence on the job market. You should write at least 150 words but no more than 200 words.",
hint:"抓关键词 impact（影响）：既要写 AI 对就业的冲击（替代重复性岗位），也要写它创造的新机会，结尾给出应对之道——终身学习。三段式：现象+双面影响+建议。",
sample:"With the rapid advancement of artificial intelligence, machines are increasingly capable of performing tasks once regarded as exclusively human. While some fear that robots will eventually steal our jobs, I would argue that AI is transforming the job market rather than destroying it.\n\nAdmittedly, the impact of automation on routine work is undeniable. Assembly-line workers, cashiers and data-entry clerks have already seen their positions shrink, and low-skill occupations remain most exposed to this trend. However, history shows that technological revolutions tend to create more jobs than they eliminate: the rise of AI has given birth to data analysts, algorithm engineers and AI ethics consultants — careers that did not exist two decades ago. Moreover, by taking over repetitive tasks, intelligent machines free human workers to focus on creativity, judgment and emotional communication, areas where humans still hold a decisive advantage.\n\nTherefore, what matters is not whether AI will change our jobs but whether we are prepared for the change. Only by embracing lifelong learning and constantly upgrading our skills can we turn this technological wave into an opportunity rather than a threat.",
sampleNote:"范文三段：首段引出争议并亮明观点（AI 是重塑而非毁灭就业）；中段先让步承认冲击，再用历史经验与新兴职业反驳，并指出 AI 解放人力去从事创造性工作；尾段用倒装句 Only by...can we 升华，强调终身学习。",
patterns:["With the rapid advancement of [technology], ... |套用句型：随着…的飞速发展，引出话题首选","Admittedly, ... However, ... |让步转折组合：先承认对立面合理，再亮出己方论点","Only by [doing sth] can we [turn ... into ...] |倒装句收尾：只有通过…我们才能…，气势强"]},
{id:"w2",cat:"教育与个人成长",title:"Directions: For this part, you are allowed 30 minutes to write an essay commenting on the saying 'The expert in anything was once a beginner.' You should write at least 150 words but no more than 200 words.",
hint:"引语评述题：先解释这句话的内涵（人人从新手起步、成长需要过程），再举正反例证，结尾落到对大学生的启示——不怕试错、坚持积累。",
sample:"The saying that the expert in anything was once a beginner reveals a simple but often forgotten truth: mastery is never born; it is built through patient accumulation.\n\nExamples abound in every field. Thomas Edison conducted thousands of unsuccessful experiments before inventing the practical light bulb; the celebrated pianist Lang Lang spent his childhood practicing scales for hours every day. What distinguishes these figures is not extraordinary talent alone but the willingness to remain a humble beginner and to learn from repeated failures. By contrast, many students give up a new skill simply because early progress is slow, forgetting that every expert once struggled with the same basic steps. This fear of being a beginner, rather than lack of ability, is often the real barrier to growth.\n\nFor college students in particular, the implication is clear. We should embrace the uncomfortable stage of being a novice, whether we are learning a foreign language, a programming tool or a research method. After all, the distance between beginner and expert, which no shortcut can bridge, is covered not by a single leap but by countless small steps taken with patience and persistence. Only by embracing that distance can we hope to cross it.",
sampleNote:"范文三段：首段解读名言——精通靠积累而非天生；中段用爱迪生、郎朗正例与半途而废者反例对比，指出真正的障碍是怕当新手；尾段落到大学生应拥抱新手阶段，用 not...but 句式收束。",
patterns:["The saying that ... reveals a simple but often forgotten truth: ... |引语题首段模板：这句话揭示了一个简单却常被遗忘的真相","Examples abound in every field. |举例过渡句：例证俯拾皆是，替代呆板的 For example","The distance between A and B is covered not by a single leap but by ... |对比收尾：从A到B的距离不是一跃而成，而是…"]},
{id:"w3",cat:"社会现象与责任",title:"Directions: For this part, you are allowed 30 minutes to write an essay on the importance of social responsibility for young people. You should write at least 150 words but no more than 200 words.",
hint:"观点论证题：论证青年承担社会责任的重要性。可从个人成长、社会进步两个层面展开，结尾呼吁行动。注意用排比和让步句增强说服力。",
sample:"When asked about their plans, many young people today talk exclusively about personal success — a well-paid job, an apartment, overseas travel. While such ambitions are understandable, a fulfilling life requires more than private gains; it also demands a sense of social responsibility.\n\nTo begin with, individual growth and social contribution are never separable. The knowledge, skills and opportunities we enjoy are products of a society that educated us, and repaying that debt is both a duty and a source of meaning. Furthermore, no major challenge of our time — climate change, public health, an aging population — can be solved by governments alone; each calls for the energy, creativity and idealism of the young. History has repeatedly shown that when young people commit themselves to public causes, society moves forward.\n\nSome may object that students are too busy or too powerless to change anything. Yet responsibility does not necessarily mean grand sacrifice: volunteering on weekends, respecting public rules, or simply offering a seat on the bus all count. A sense of responsibility, once planted, grows with us — and a society of responsible individuals is one in which everyone, including ourselves, ultimately thrives.",
sampleNote:"范文三段：首段由现象引入（青年只谈个人成功）并提出观点；中段两个分论点（成长与贡献不可分；时代挑战需要青年力量）；尾段让步反驳，把责任落到日常小事，结尾强调共赢。",
patterns:["While such ambitions are understandable, ... requires more than ...; it also demands ... |让步+递进：先承认再指出不足，自然引出主题","No major challenge ... can be solved by ... alone; each calls for ... |双重否定强调：…无法仅靠…解决，每一项都需要…","..., once planted, grows with us — and ... |分词插入+破折号升华：让结尾句有画面感和递进感"]},
{id:"w4",cat:"校园与就业",title:"Directions: For this part, you are allowed 30 minutes to write an essay on why an increasing number of college graduates choose to work in smaller cities. You should write at least 150 words but no more than 200 words.",
hint:"现象解释题：解释'越来越多毕业生选择小城市就业'的原因。首段描述现象，中段从生活成本、发展机会、政策红利等角度分析，尾段表态或展望。",
sample:"For decades, big cities were the default destination for Chinese college graduates, who endured crowded subways and sky-high rents in exchange for career opportunities. Recently, however, a noticeable shift has taken place: a growing number of graduates are choosing to begin their careers in smaller cities.\n\nSeveral factors account for this change. First, the cost of living in metropolises has climbed so steeply that an ordinary salary barely covers rent, whereas smaller cities offer affordable housing and a more comfortable pace of life. Second, the rise of the digital economy means that good jobs are no longer concentrated in a few megacities; remote work and e-commerce have enabled young professionals to thrive almost anywhere. Finally, many smaller cities now provide generous incentives — subsidized housing, start-up grants and fast-tracked household registration — precisely to attract educated talent.\n\nIn my view, this trend is a healthy sign of a more balanced society. When talent flows beyond a handful of super-cities, regional development accelerates and graduates gain access to a wider range of fulfilling lives. Where to start a career matters less than whether the choice matches one's own definition of a good life.",
sampleNote:"范文三段：首段对比过去与现在（默认去大城市→转向小城市）；中段 First/Second/Finally 三点归因（成本、数字经济、人才政策）；尾段表态——这是社会更均衡的健康信号，落脚个人选择标准。",
patterns:["Recently, however, a noticeable shift has taken place: ... |现象转折句：然而最近出现了显著变化，引出核心现象","Several factors account for this change. |归因总起句：以下解释原因，后接 First/Second/Finally","Where to ... matters less than whether ... |对比句式：在哪里…不如是否…重要，适合结尾表态"]},
{id:"w5",cat:"健康与生活方式",title:"Directions: For this part, you are allowed 30 minutes to write an essay on how college students can maintain a healthy lifestyle. You should write at least 150 words but no more than 200 words.",
hint:"问题解决型：先指出大学生健康问题（熬夜、外卖、久坐、压力），再给出可操作的解决方案（作息、运动、饮食、心理），结尾总结。",
sample:"Campus life is often romanticized, yet the reality behind many dormitory doors is less rosy: students scrolling on phones until 2 a.m., living on takeout food, and sitting for ten hours a day. Such habits may seem harmless in youth, but they quietly erode both physical and mental health.\n\nFortunately, a healthy lifestyle asks for discipline rather than money. The first step is a regular sleep schedule, because no supplement can replace the repair work the brain performs at night. Equally important is daily movement: thirty minutes of jogging, swimming or even brisk walking between classes can sharpen memory and lift mood more effectively than any energy drink. A balanced diet matters as well; choosing the canteen over fried takeout several times a week is a small change with large returns. Finally, mental fitness deserves equal attention — talking with friends, limiting social media and seeking counseling when overwhelmed are signs of strength, not weakness.\n\nIn essence, health is the quiet foundation on which every other ambition stands. By managing sleep, exercise, diet and emotions as seriously as we manage our grades, we can leave campus not only smarter but stronger.",
sampleNote:"范文三段：首段用白描手法呈现问题（熬夜、外卖、久坐）；中段四个解决方案（作息、运动、饮食、心理），每条都给出理由或对比；尾段一句点题——健康是所有雄心的隐形地基。",
patterns:["..., yet the reality behind ... is less rosy: ... |欲抑先扬：表面光鲜，然而现实并不那么美好，冒号后白描列举","The first step is ... Equally important is ... |递进列举：The first step is / Equally important is 交替使用，条理清晰","In essence, ... is the quiet foundation on which ... |下定义式收尾：本质上，…是…的隐形地基"]},
{id:"w6",cat:"传统文化",title:"Directions: For this part, you are allowed 30 minutes to write an essay on the revival of traditional culture among young Chinese. You should write at least 150 words but no more than 200 words.",
hint:"现象+意义题：描述传统文化在年轻人中复兴的现象（汉服、国风音乐、博物馆热），分析原因（认同感、创造力、政策与新媒体），结尾展望。",
sample:"Walk through any Chinese city on a weekend and you may see young people in flowing Hanfu taking photos beside ancient walls; scroll through short-video platforms and traditional music, calligraphy and folk crafts flood the screen. Traditional culture, long perceived as the taste of the older generation, is experiencing an unexpected revival among the young.\n\nThis renaissance is no accident. Growing up in a prosperous and confident China, today's youth view their heritage not as a burden from the past but as a source of identity and pride. New media have also played a decisive role: a ten-minute video can turn an obscure craft into a national sensation overnight. Meanwhile, creative adaptations — traditional melodies fused with pop rhythms, museums selling witty cultural products — have proven that heritage can be both authentic and fashionable.\n\nThe significance of this revival extends far beyond aesthetics. A generation that understands and loves its own culture will carry it forward with creativity rather than nostalgia. In this sense, the young people wearing Hanfu today are not simply admiring the past; they are deciding what their civilization will look like in the future.",
sampleNote:"范文三段：首段用画面感场景引出传统文化复兴现象；中段双因分析（文化自信+新媒体推波助澜）并给出创新例证；尾段升华——复兴的意义在于用创造力传承文明。",
patterns:["..., long perceived as ..., is experiencing an unexpected revival |分词插入描述转变：曾经被认为…的…正在经历复兴","This renaissance is no accident. |短句强调：这绝非偶然，独立成段引导原因分析","not simply admiring the past; they are deciding ... |not...but 变体收尾：不只是…，更是在决定…"]},
{id:"w7",cat:"环境与可持续发展",title:"Directions: For this part, you are allowed 30 minutes to write an essay on the role of individuals in environmental protection. Some people say individual efforts are insignificant; others believe everyone can make a difference. Write an essay to state your view. You should write at least 150 words but no more than 200 words.",
hint:"二选一观点题：面对'个人环保无足轻重 vs 人人皆可改变'，选边并论证。可用数字类比法论证聚合效应，结尾回扣观点。",
sample:"Whenever environmental problems are discussed, a familiar excuse appears: what difference can one person possibly make? Admittedly, a single reusable shopping bag cannot save the planet. Yet the belief that individual action is insignificant, however common, does not survive careful examination.\n\nEnvironmental change is, in essence, the arithmetic of millions of small acts multiplied. The recycling programs that now operate in most Chinese cities began with scattered households sorting garbage when nobody required them to; the explosion of shared bicycles started with a handful of commuters choosing to ride. Every large market, moreover, responds to signals sent by consumers: when enough people refuse over-packaged goods, companies redesign their products. Individual choices, in other words, are not isolated gestures but votes for the kind of world we wish to inhabit.\n\nTo be sure, individuals alone cannot replace government regulation and corporate responsibility. But these forces reinforce rather than exclude one another. A society of citizens who conserve energy, refuse single-use plastics and demand greener policies will find its laws easier to pass and its innovations faster to spread. The planet does not need a few perfect environmentalists; it needs billions of imperfect ones.",
sampleNote:"范文三段：首段引出对立观点并让步后反驳；中段用算术类比和共享单车、垃圾分类例证个人行为的聚合效应；尾段承认个人不能替代制度，但强调二者互补，金句收尾（地球不需要完美的环保主义者，需要数十亿不完美的）。",
patterns:["..., a familiar excuse appears: ... |引出对立观点：每当讨论…，总会出现一种熟悉的借口","..., in essence, the arithmetic of ... |类比定义：本质上是…的算术，把抽象问题具体化","The planet does not need a few perfect ...; it needs billions of imperfect ones. |金句结尾：not a few...but billions 对比强烈，易于记忆"]},
{id:"w8",cat:"哲理与人生",title:"Directions: For this part, you are allowed 30 minutes to write an essay on the relationship between comfort zone and personal growth. You should write at least 150 words but no more than 200 words.",
hint:"关系论证题：论证走出舒适区与成长的关系。首段界定概念，中段论证为何成长发生在不适区（并用适度挑战的辩证观），尾段建议如何行动。",
sample:"A comfort zone is a beautiful place, but nothing ever grows there. This popular saying captures a paradox of human development: the very safety we cherish can quietly become the wall that confines us.\n\nGrowth, whether physical or mental, happens at the edge of difficulty. Muscles strengthen only when challenged by heavier loads; likewise, the mind develops only when it wrestles with unfamiliar problems — a new language, a demanding project, an unfamiliar city. Remaining within familiar routines may feel efficient, yet years of repetition without challenge lead to a plateau, and eventually to regret. It is no coincidence that the experiences people describe as most transformative are almost always the ones that once terrified them: studying abroad, speaking in public, starting over.\n\nThis does not mean recklessness. Leaping too far beyond one's abilities produces panic rather than progress; the ideal zone lies just beyond the edge of comfort, where difficulty is demanding but not crushing. True courage, therefore, is not the absence of fear but the willingness to expand one's boundaries step by step. Growth never comes to those who wait inside the walls; it belongs to those who keep moving the walls outward.",
sampleNote:"范文三段：首段引名言界定悖论（舒适即牢笼）；中段肌肉类比论证成长发生在困难边缘，并举例佐证；尾段辩证补充——不是鲁莽，而是适度挑战，结尾 wall 意象呼应首段。",
patterns:["A comfort zone is a beautiful place, but nothing ever grows there. |名言开头：直接引用流行语引出话题","..., whether physical or mental, happens at the edge of difficulty. |whether...or 插入：无论…还是…都…，概括性强","Growth never comes to those who ...; it belongs to those who ... |对仗收尾：…不会降临于…，它属于…"]}
];

window.WRITING_SENTENCES=[
{pat:"Only by [doing sth] can we [achieve sth].",cn:"倒装句：只有通过…我们才能…。放段首或结尾，气势足",eg:"Only by embracing lifelong learning can we survive the AI era."},
{pat:"Not until [时间/事件] did sb realize [道理].",cn:"倒装句：直到…才意识到…。叙事后点题很加分",eg:"Not until the exam did he realize the importance of regular review."},
{pat:"It is [sth] that [shapes/defines/distinguishes] ..., rather than ...",cn:"强调句：正是…（而不是…）塑造了…",eg:"It is persistence that distinguishes winners from dreamers, rather than mere talent."},
{pat:"[Doing sth], sb can not only [benefit 1] but also [benefit 2].",cn:"现在分词开头 + not only...but also：一举两得",eg:"Exercising regularly, students can not only sharpen their minds but also relieve stress."},
{pat:"With [名词] [doing sth], [主句].",cn:"with 复合结构作状语：随着…，主句",eg:"With technology reshaping every industry, the demand for adaptable minds has never been greater."},
{pat:"It is high time that sb [did sth].",cn:"虚拟语气：是时候…了（从句用过去式）",eg:"It is high time that we took mental health as seriously as physical fitness."},
{pat:"Were it not for [sth], [主句 would...].",cn:"虚拟倒装：若非…，就会…。书面语亮点",eg:"Were it not for volunteers, the old man would have spent the winter alone."},
{pat:"The past decade has witnessed [名词/名词化].",cn:"无灵主语：过去十年见证了…，比 In the past ten years 高级",eg:"The past decade has witnessed an explosive growth of short-video platforms."},
{pat:"Nothing is more [adj] than [doing sth].",cn:"否定比较：没有什么比…更…。观点句万金油",eg:"Nothing is more precious than time for a graduate student."},

{pat:"[名词], which [定语从句补充说明], [主句其余部分].",cn:"非限制性定语从句：把两个短句合成高级长句",eg:"Online courses, which allow anyone to learn from top universities, have changed the landscape of education."},
{pat:"[Doing sth] means [doing sth]; [doing sth] means [doing sth].",cn:"平行排比：两个动名词对举，节奏感强",eg:"Reading means talking with the wisest people; traveling means reading the widest book."},
{pat:"So [adj] is [sth] that [结果].",cn:"so...that 倒装：某物如此…以至于…",eg:"So fierce is the competition that students begin preparing years in advance."},
{pat:"Compared with A, B [优势], which explains why [结论].",cn:"对比 + which 解释：一句顶两句",eg:"Compared with rote memorization, spaced repetition doubles retention, which explains why it is widely adopted."},
{pat:"Admittedly, [让步]. Nevertheless, [转折].",cn:"让步转折高级替换：比 but/although 有档次",eg:"Admittedly, remote work saves commuting time. Nevertheless, it blurs the line between office and life."},
{pat:"It is universally acknowledged that [共识].",cn:"形式主语：举世公认…。首段引出话题经典句",eg:"It is universally acknowledged that a solid vocabulary is the cornerstone of language learning."},
{pat:"[数量/数据] speak(s) louder than words: [事实].",cn:"数据论证句式：事实胜于雄辩的变体",eg:"Numbers speak louder than words: over 60 percent of graduates now consider work-life balance a top priority."},
{pat:"Whether [情况A] or [情况B], [主句不变].",cn:"Whether...or 让步：无论…还是…都…",eg:"Whether in cities or in villages, lifelong learning has become a necessity rather than a luxury."},

{id:"t1",theme:"文化历史",title:"剪纸",cn:"剪纸是中国最古老、最受欢迎的民间艺术之一，距今已有一千五百多年的历史。人们用剪刀或刻刀在红纸上创作出花鸟、人物和吉祥图案，逢年过节时把它们贴在窗户和门上，以表达对幸福生活的期盼。由于材料简单、题材多样，剪纸曾广泛流行于中国各地，成为日常生活的一部分。2009年，中国剪纸被列入联合国教科文组织人类非物质文化遗产代表作名录，这项古老的艺术如今正以新的形式走进现代生活。",
ref:"Paper cutting is one of the oldest and most popular folk arts in China, with a history of more than 1,500 years. Using scissors or knives, people create flowers, birds, figures and auspicious patterns on red paper. During festivals, these works are pasted on windows and doors to express hopes for a happy life. Since the materials are simple and the subjects are diverse, paper cutting was once popular throughout China and became part of everyday life. In 2009, Chinese paper cutting was inscribed on the Representative List of the Intangible Cultural Heritage of Humanity of UNESCO. Today, this ancient art is entering modern life in new forms.",

{id:"t2",theme:"文化历史",title:"春节",cn:"春节是中国最重要的传统节日，标志着农历新年的开始，通常出现在公历一月或二月。每逢春节，在外工作的人们纷纷返乡与家人团聚，形成一年一度规模最大的迁徙。除夕之夜，全家人围坐在一起吃年夜饭、看晚会、守岁到深夜。人们还贴春联、放鞭炮、向长辈拜年，孩子们则会收到装着压岁钱的红包。如今，虽然庆祝方式不断变化，但春节所承载的家庭团圆和对美好生活的向往始终未变。",
ref:"The Spring Festival, which is the most important traditional festival in China, marks the beginning of the lunar new year and usually falls in January or February. During the festival, people working away from home return to reunite with their families, creating the largest annual migration in the country. On New Year's Eve, the whole family sits together to enjoy a reunion dinner, watch the gala, and stay up late to welcome the new year. People also paste spring couplets, set off firecrackers and pay New Year visits to their elders, while children receive red envelopes filled with lucky money. Although the ways of celebration keep changing, what the Spring Festival carries — family reunion and the aspiration for a better life — has remained unchanged.",

{id:"t3",theme:"文化历史",title:"中国园林",cn:"中国园林历史悠久，被誉为世界园林之母。与西方园林讲究对称不同，中国园林追求虽由人作、宛自天开的意境，亭台楼阁、假山池塘错落有致，移步换景，处处如画。苏州园林是其中的杰出代表，被联合国教科文组织列入世界文化遗产名录。园林不仅是休闲娱乐的场所，更寄托了古代文人亲近自然、修身养性的理想，体现着天人合一的哲学思想。",
ref:"Chinese gardens enjoy a long history and are honored as the mother of world gardens. Unlike Western gardens, which stress symmetry, Chinese gardens pursue an artistic conception that man-made scenes resemble natural ones. Pavilions, towers, rockeries and ponds are arranged in pleasing disorder, and every step brings a new view, as if walking through a painting. The classical gardens in the city of Suzhou are outstanding examples and have been inscribed on the World Heritage List of UNESCO. Gardens, which were never merely places for leisure and entertainment, also embodied the ideal of ancient scholars to get close to nature and cultivate their minds, , reflecting the ancient philosophy of harmony between man and nature.",

{id:"t4",theme:"社会发展",title:"城市化进程",cn:"过去四十年，中国经历了人类历史上规模最大的城市化进程。城镇人口比例从1978年的不足20%上升到如今的65%以上，数以亿计的农村居民进入城市工作和生活。城市化极大地推动了经济增长，提高了居民收入，也催生了地铁、高速公路等庞大的基础设施网络。与此同时，大城市也面临交通拥堵、房价高企、环境污染等挑战。如何让城市化更加可持续、让新市民真正融入城市，是当前社会发展的重要课题。",
ref:"Over the past four decades, China has witnessed the largest urbanization in human history. The proportion of urban residents has risen from less than 20 percent in 1978 to more than 65 percent today, and hundreds of millions of rural residents have moved to cities to work and live. Urbanization, which has greatly boosted economic growth and increased people's incomes, has also created a vast network of infrastructure ranging from subways to expressways. Meanwhile, big cities are confronted with challenges including traffic congestion, high housing prices and environmental pollution. How to make urbanization more sustainable and help new citizens truly integrate into urban life has become a key issue of social development.",
keys:[{zh:"规模最大的城市化",en:"the largest urbanization"},{zh:"城镇人口比例",en:"the proportion of urban residents"},{zh:"上升到",en:"has risen from"},{zh:"数以亿计",en:"hundreds of millions of"},{zh:"推动了经济增长",en:"boosted economic growth"},{zh:"基础设施",en:"infrastructure"},{zh:"交通拥堵",en:"traffic congestion"},{zh:"房价高企",en:"high housing prices"},{zh:"更可持续",en:"more sustainable"},{zh:"融入城市",en:"integrate into urban life"}]},
{id:"t5",theme:"社会发展",title:"人口老龄化",cn:"中国正在快速步入老龄化社会。截至2023年底，全国60岁以上的老年人口已超过2.9亿，占总人口的五分之一以上。人口老龄化给养老、医疗和社会保障体系带来了巨大压力，也影响着劳动力供给和经济增长。为此，政府一方面逐步延迟退休年龄、完善养老保险制度，另一方面大力发展社区养老和智慧养老服务，鼓励社会力量参与。让每一位老年人安享晚年，需要全社会的共同努力。",
ref:"China is rapidly entering an aging society. By the end of 2023, the number of people aged 60 and above had exceeded 290 million, accounting for more than one fifth of the total population. Population aging has placed enormous pressure on elderly care, medical services and the social security system, and it also affects the labor supply and economic growth. To cope with this trend, the government is gradually raising the retirement age and improving the pension system on the one hand, and vigorously developing community-based and smart elderly care services on the other, encouraging social forces to participate. Ensuring that every elderly person enjoys a happy later life requires the joint efforts of the whole society.",

{id:"t6",theme:"社会发展",title:"在线教育",cn:"近年来，在线教育在中国发展迅猛，特别是在新冠疫情期间，全国近三亿学生通过在线平台继续上课，创造了世界上规模最大的在线教学实践。在线教育打破了时间和地点的限制，让偏远地区的学生也能听到名师的课程，优质教育资源因此得到更广泛的共享。然而，在线教育也存在缺乏互动、学习效果参差不齐等问题。未来，线上线下相融合的混合式教学，将成为教育发展的重要方向。",

{id:"t7",theme:"科技经济",title:"移动支付",cn:"移动支付已成为中国人日常生活的基本方式。无论是购物、就餐还是乘坐公共交通，人们只需用手机扫一扫二维码即可完成付款。移动支付的普及得益于庞大的智能手机用户群和成熟的互联网技术，它不仅方便了消费者，也帮助无数小商户降低了收款成本。如今，中国移动支付的规模位居世界前列，就连街头的煎饼摊也贴着收款二维码。可以说，移动支付正在重塑中国的商业和消费方式。",

{id:"t8",theme:"科技经济",title:"高速铁路",cn:"高速铁路是中国现代交通的一张亮丽名片。自2008年第一条高铁线路开通以来，中国高铁运营里程已超过4.5万公里，占全球高铁总里程的三分之二以上。乘坐高铁，人们上午还在北京，下午就能抵达一千公里外的城市，朝发夕至的梦想早已成为日常。高铁不仅极大方便了人们的出行，也带动了沿线城市的经济发展。如今，中国高铁正凭借先进技术和丰富经验走向世界，成为国际合作的崭新平台。",

{id:"t9",theme:"科技经济",title:"人工智能",cn:"人工智能是引领新一轮科技革命的关键力量。从智能手机中的语音助手到医院的辅助诊断系统，从自动驾驶汽车到智能工厂，人工智能正在深入各行各业。它不仅提高了生产效率，还创造出许多前所未有的产品和服务。与此同时，人工智能的发展也带来了数据安全、个人隐私和就业结构变化等新问题。如何在鼓励创新的同时规范其应用，让人工智能更好地造福人类，已成为国际社会共同关注的议题。",

{en:"M: Yes. I saw the notice on the campus job board.",cn:"男：是的。我在校园招聘栏上看到的启事。"},
{en:"W: Tell me a little about yourself. Are you a student here?",cn:"女：简单介绍一下你自己。你是本校学生吗？"},
{en:"M: I'm a second-year economics student. I finished all my morning classes, so I'm free after one o'clock every day.",cn:"男：我是经济学专业大二学生。上午的课都排完了，所以每天一点以后有空。"},
{en:"W: Good, because our busy hours are from two to six in the afternoon. Can you work at weekends?",cn:"女：很好，我们最忙的时段是下午两点到六点。周末能上班吗？"},
{en:"M: Saturdays are fine, but I visit my grandparents every Sunday.",cn:"男：周六可以，但每周日我要去看望爷爷奶奶。"},
{en:"W: That's acceptable. We need someone on Saturdays anyway.",cn:"女：可以接受。我们本来就需要周六的人手。"},
{en:"M: May I ask about the pay?",cn:"男：我能问一下工资吗？"},
{en:"W: Twelve dollars an hour, paid weekly. You also get a free meal during each shift.",cn:"女：每小时十二美元，按周结算。每班次还提供一顿免费工作餐。"},
{en:"M: That sounds fair. When can I start?",cn:"男：听起来很合理。我什么时候能开始上班？"},
{en:"W: Come back on Friday for a short training session, and you can start next Monday.",cn:"女：周五来参加一个简短培训，下周一就能正式上岗。"}],
questions:[
{q:"What is the man's major?",opts:["Management.","Economics.","Front desk service.","Computer science."],a:1,exp:"细节题。定位 I'm a second-year economics student，对应 B。"},
{q:"When is the man available to work?",opts:["After one o'clock every day, except Sundays.","All day on both Saturday and Sunday.","Only in the morning.","Every evening after six."],a:0,exp:"细节题。定位 free after one o'clock every day 和每周日看望祖父母，可知他每天一点后有空但周日不行，对应 A。"},
{q:"What does the woman say about the job?",opts:["It pays twelve dollars an hour with a free meal.","It requires weekend work on both days.","Training lasts a full week.","The pay is monthly."],a:0,exp:"细节题。定位 Twelve dollars an hour, paid weekly. You also get a free meal，对应 A。B 与男士只周日不可冲突、C 与 short training 不符、D 与 paid weekly 不符。"}]},
{id:"p1",exam:"cet4",type:"passage",title:"Passage One · 睡眠与大学生",sentences:[
{en:"Many college students believe they can train themselves to need less sleep.",cn:"许多大学生认为自己可以训练出更少睡眠的需求。"},
{en:"However, scientists say the adult body still requires seven to nine hours of sleep every night.",cn:"然而，科学家指出成年人每晚仍需要七到九小时的睡眠。"},
{en:"During deep sleep, the brain sorts and stores the information gathered during the day.",cn:"在深度睡眠中，大脑会对白天收集的信息进行整理和储存。"},
{en:"Students who sleep less than six hours before an exam often perform worse, not better.",cn:"考试前睡眠不足六小时的学生往往表现更差，而不是更好。"},
{en:"Researchers at a Canadian university tracked two hundred students for a whole term.",cn:"加拿大一所大学的研究人员对两百名学生进行了整整一个学期的跟踪。"},
{en:"They found that irregular sleep, rather than short sleep alone, damaged grades most.",cn:"他们发现，与单纯睡眠不足相比，作息不规律对成绩的伤害最大。"},
{en:"Students who went to bed at very different times every night scored lower even when total sleep was enough.",cn:"那些每晚就寝时间差异很大的学生，即使总睡眠时间充足，得分也更低。"},
{en:"The researchers suggest keeping a fixed bedtime, even at weekends.",cn:"研究人员建议保持固定的就寝时间，周末也不例外。"},
{en:"They also warn that coffee after four in the afternoon delays deep sleep.",cn:"他们还提醒，下午四点以后喝咖啡会推迟深度睡眠的到来。"}],
questions:[
{q:"What do scientists say about sleep?",opts:["Adults need seven to nine hours a night.","Students can train themselves to sleep less.","Short sleep improves exam results.","Deep sleep stores physical strength only."],a:0,exp:"细节题。定位 the adult body still requires seven to nine hours，对应 A；B 是学生们的错误观念，C 与原文相反，D 曲解了记忆整理功能。"},
{q:"What damaged students' grades most in the Canadian study?",opts:["Sleeping fewer than six hours.","Drinking coffee in the morning.","Irregular bedtimes.","Studying late at night."],a:2,exp:"细节题。定位 irregular sleep, rather than short sleep alone, damaged grades most，对应 C。"},
{q:"What do researchers suggest students do?",opts:["Drink coffee only in the morning.","Keep a fixed bedtime even at weekends.","Take a nap after every class.","Sleep longer before exams."],a:1,exp:"细节题。定位 suggest keeping a fixed bedtime, even at weekends，对应 B。A 是 warn 部分的推论且表述为 suggest 不准确。"}]},
{id:"p2",exam:"cet4",type:"passage",title:"Passage Two · 蜜蜂与城市养蜂",sentences:[
{en:"More and more city people are keeping bees on rooftops and balconies.",cn:"越来越多的城市居民在屋顶和阳台上养蜂。"},
{en:"Urban beekeeping began as a hobby, but it is now helping science in surprising ways.",cn:"城市养蜂起初只是爱好，如今正以惊人的方式助力科学研究。"},
{en:"Bees in cities often find more varied flowers than bees in the countryside, where farms grow only one crop.",cn:"相比农村单一种植的农田，城市里的蜜蜂往往能采到更多样的花。"},
{en:"A research team in Berlin collected honey from forty city hives.",cn:"柏林的一个研究团队从四十个城市蜂箱中采集了蜂蜜。"},
{en:"They tested the honey to learn which plants the bees had visited.",cn:"他们通过检测蜂蜜来了解蜜蜂造访过哪些植物。"},
{en:"The results showed an amazing variety, including flowers from balconies, parks and roadside trees.",cn:"结果显示蜂蜜来源极为丰富，包括阳台、公园和行道树上的花。"},
{en:"Scientists say city honey can act as a map of urban plant life.",cn:"科学家说，城市蜂蜜可以充当城市植物分布的一张地图。"},
{en:"The data helps planners choose better trees for bees and other insects.",cn:"这些数据有助于规划者为蜜蜂和其他昆虫选择更合适的树木。"},
{en:"Still, experts remind new beekeepers to check local rules and to place hives away from busy walkways.",cn:"不过专家提醒新养蜂人了解当地规定，并把蜂箱安置在远离人行通道的地方。"}],
questions:[
{q:"Why do city bees often find more varied flowers?",opts:["City parks plant imported flowers.","Farms in the countryside grow only one crop.","City bees fly longer distances.","Balconies are warmer than fields."],a:1,exp:"细节题。定位 where farms grow only one crop，说明农村花源单一，对应 B。"},
{q:"What did the Berlin team learn by testing honey?",opts:["The health of the bees.","Which plants the bees had visited.","The pollution level of the city.","The sweetness of city flowers."],a:1,exp:"细节题。定位 to learn which plants the bees had visited，对应 B。"},
{q:"What do experts remind new beekeepers to do?",opts:["Feed the bees in winter.","Check local rules and place hives safely.","Sell honey to neighbors.","Keep at least ten hives."],a:1,exp:"细节题。定位 check local rules and to place hives away from busy walkways，对应 B。"}]}
];

<script>/* ===== 六级听力题库（真题风格自编，音频由用户导入）===== */
window.LISTENING_CET6 = [
{id:"c5",exam:"cet6",type:"conversation",title:"Long Conversation One · 论文选题",sentences:[
{en:"W: Professor Hayes, have you got a minute? I've been circling a term-paper topic for two weeks and getting nowhere.",cn:"女：海斯教授，有时间吗？我的学期论文选题卡住了。"},
{en:"M: Of course, Anna. Talk me through the ground you've been covering.",cn:"男：当然，安娜。你想写哪个方向？"},
{en:"W: Something on remote work, presumably — except the territory has been thoroughly harvested; every angle I try feels second-hand.",cn:"女：想写远程办公，但大家都在写，感觉写烂了。"},
{en:"M: Then the remedy is precision. Remote work is a territory; a topic is a single, answerable question within it.",cn:"男：那就把它收窄。远程办公是一个领域，而题目是一个问题。"},
{en:"W: For example?",cn:"女：比如说？"},
{en:"M: For instance, whether remote hiring has altered the early-career prospects of graduates in second-tier cities — narrow enough to test, broad enough to matter.",cn:"男：比如远程办公如何改变小城市应届毕业生的职业机会。这就是可测量的。"},
{en:"W: That's compelling. But would the evidence base sustain it?",cn:"女：挺有意思的。可我能找到足够的数据吗？"},
{en:"M: Anchor it in the national labour survey and three recent industry reports; the figures triangulate nicely.",cn:"男：查一下全国劳动力调查和三份最新行业报告，它们能相互印证。"},
{en:"W: Should I supplement the statistics with interviews?",cn:"女：我还应该采访应届毕业生吗？"},
{en:"M: Five or six brief interviews would give the argument a human dimension — cap each at ten minutes and code them for recurring themes.",cn:"男：五六次简短采访会让论文更有说服力，每次控制在十分钟以内。"},
{en:"W: Great. And the deadline?",cn:"女：好的。截止时间呢？"},
{en:"M: Proposal by next Friday; if the question is as sharply drawn as it is now, I'll approve it the same day.",cn:"男：下周五前交开题报告。只要方向聚焦，我当天就会批准。"}],
questions:[
{q:"What is the woman's problem?",opts:["She missed the deadline for her paper.","She cannot narrow down a paper topic.","Her professor rejected her proposal.","She lacks interview experience."],a:1,exp:"细节题。女士说选题 stuck 且觉得 remote work 写烂了，即难以收窄选题，对应 B。"},
{q:"What does the professor suggest as a good topic?",opts:["A broad field with rich data.","A measurable question with a clear focus.","A topic nobody has studied.","A subject based on interviews only."],a:1,exp:"细节题。教授强调 a topic is a question 且举的例子 measurable，对应 B。"},
{q:"What does the professor advise about interviews?",opts:["Avoid interviews to save time.","Interview as many graduates as possible.","Keep each interview under ten minutes.","Interview only company managers."],a:2,exp:"细节题。定位 Keep each under ten minutes，对应 C。"}]},
{id:"c6",exam:"cet6",type:"conversation",title:"Long Conversation Two · 房租上涨",sentences:[
{en:"M: Did you see the landlord's email? The rent is being raised by fifteen percent from March — effective overnight, as far as our budget is concerned.",cn:"男：你看到房东的邮件了吗？三月份房租要涨百分之十五。"},
{en:"W: Fifteen percent? That's more than double what he asked last year. Did he offer any justification?",cn:"女：百分之十五？比去年涨的翻了一倍还多。他说明原因了吗？"},
{en:"M: Renovations, ostensibly — a replaced heating system, upgraded windows, the usual inventory.",cn:"男：据说是翻修。换了新的供暖系统、新窗户，诸如此类。"},
{en:"W: Renovations nobody requested, payable by us. What are our options, realistically?",cn:"女：这些翻修我们可从没要求过。我们有什么选择？"},
{en:"M: We can absorb it, contest it, or vacate when the lease expires in June.",cn:"男：我们可以接受、协商，或者六月份租约到期后搬走。"},
{en:"W: Moving is ruinous in its own right — agency fees, deposits, a van; it could consume two months' rent.",cn:"女：搬家很贵。中介费、押金、货车……可能要吃掉两个月房租。"},
{en:"M: True. But fifteen percent is ninety more dollars a month. That's over a thousand a year.",cn:"男：没错。可百分之十五就是每月多付九十美元，一年一千多。"},
{en:"W: Negotiation first, then. Comparable flats in the neighbourhood rose by only eight percent.",cn:"女：先试试协商吧。附近同类公寓只涨了百分之八。"},
{en:"M: Sound reasoning. We present those listings and press for ten percent, in exchange for a two-year commitment.",cn:"男：有道理。我们可以把那些房源给他看，要求涨百分之十并签两年租约。"},
{en:"W: Continuity benefits him as well — it spares him the vacancy and the search.",cn:"女：稳定对他也有价值，他就不用再找新房客了。"},
{en:"M: Exactly. Shall I draft the email tonight and we send it together?",cn:"男：正是。我今晚拟封邮件，我们一起发给他？"}],
questions:[
{q:"Why is the rent being raised?",opts:["The landlord lost his job.","The flat was renovated.","The neighborhood became safer.","Taxes increased sharply."],a:1,exp:"细节题。定位 Renovations, apparently（供暖系统、窗户），对应 B。"},
{q:"What does the woman think of moving out?",opts:["It is the cheapest option.","It should be done immediately.","Its costs may equal two months' rent.","It is impossible in June."],a:2,exp:"细节题。定位 it could eat two months' rent，对应 C。"},
{q:"What will the speakers probably do next?",opts:["Accept the fifteen percent rise.","Report the landlord to the authorities.","Email the landlord a counter-offer.","Move to a cheaper city."],a:2,exp:"推断题。两人商定 draft the email，提出涨 10% 并签两年租约，即 counter-offer，对应 C。"}]},
{id:"p5",exam:"cet6",type:"passage",title:"Passage One · 数字极简主义",sentences:[
{en:"A growing number of young professionals are practicing what psychologists call digital minimalism.",cn:"越来越多的年轻职场人正在践行心理学家所说的数字极简主义。"},
{en:"The doctrine does not counsel abandoning technology altogether; it demands that technology be deployed with deliberate intention.",cn:"这并不意味着完全告别科技，而是有明确目的地使用科技。"},
{en:"Adherents typically uninstall the applications engineered to harvest attention and retain only a handful of indispensable tools.",cn:"践行者通常会删除那些只消耗注意力的应用，只保留少数必要工具。"},
{en:"In a study conducted at a European business school, sixty volunteers capped personal screen time at one hour a day for a month.",cn:"在欧洲一所商学院的一项研究中，六十名志愿者把个人屏幕时间压缩到每天一小时，坚持一个月。"},
{en:"By the end of the trial, two thirds reported measurably sharper concentration at work.",cn:"到月底，三分之二的参与者报告工作专注度有所提升。"},
{en:"More strikingly, their reported loneliness declined — although they met no more people offline than they had before.",cn:"更出人意料的是，他们的孤独感下降了，尽管线下社交次数并没有比以前多。"},
{en:"The researchers suggest that constant, low-quality contact online may deepen isolation rather than relieve it.",cn:"研究人员认为，持续的低质量线上联系可能让人感觉更孤独，而非更亲近。"},
{en:"Critics object that the sample was small and the trial brief.",cn:"批评者指出该研究样本小、周期短。"},
{en:"Even so, a number of firms have introduced quiet hours, banning internal messages after eight in the evening.",cn:"尽管如此，许多公司已开始实行静音时段，晚八点后禁发内部消息。"},
{en:"The wider lesson may be disarmingly simple: attention is a finite resource, and it deserves a budget.",cn:"更大的启示或许很简单：注意力是有限资源，值得为它做预算。"}],
questions:[
{q:"What is digital minimalism according to the passage?",opts:["Using technology with clear intention.","Giving up all digital devices.","Working without any screens.","Reducing the number of friends online."],a:0,exp:"细节题。定位 it means using it with clear intention，对应 A。B 与 does not mean quitting technology altogether 相反。"},
{q:"What surprised the researchers about the results?",opts:["Concentration improved greatly.","Volunteers spent less on apps.","Loneliness dropped without more offline meetings.","Volunteers quit their jobs."],a:2,exp:"细节题。More strikingly 引导的正是出人意料之处：孤独感下降而线下见面并未增多，对应 C。"},
{q:"What do many companies do now?",opts:["Provide phones without social apps.","Ban internal messages after 8 p.m.","Pay employees to stay offline.","Require one day offline each week."],a:1,exp:"细节题。定位 banning internal messages after eight in the evening，对应 B。"}]},
{id:"p6",exam:"cet6",type:"passage",title:"Passage Two · 城市热岛与屋顶农场",sentences:[
{en:"Cities routinely run several degrees warmer than the countryside encircling them.",cn:"城市通常比周边乡村高出好几度。"},
{en:"Scientists term this the urban heat island effect, and it peaks on summer nights.",cn:"科学家称之为城市热岛效应，在夏夜最为明显。"},
{en:"Dark roofs absorb sunlight throughout the day and radiate the stored heat slowly after dark.",cn:"深色屋顶整天吸收阳光，天黑后又缓慢释放热量。"},
{en:"One increasingly favoured remedy is the green roof, blanketed with vegetation and growing medium.",cn:"一个日益流行的对策是绿色屋顶，也就是种满植物和土壤的屋顶。"},
{en:"A three-year investigation in Singapore compared forty buildings with and without planted roofs.",cn:"新加坡一项为期三年的研究对比了四十栋有绿色屋顶和没有绿色屋顶的建筑。"},
{en:"On hot days, rooms beneath green roofs remained up to four degrees cooler.",cn:"炎热天气里，绿色屋顶下方的房间温度最多可低四度。"},
{en:"The cooling lowered air-conditioning expenditure in those buildings by roughly twenty percent.",cn:"这些建筑的空调费用因此下降约百分之二十。"},
{en:"Several municipalities now underwrite half the cost of installing a green roof.",cn:"一些城市现在提供补贴，可支付绿色屋顶安装费用的一半。"},
{en:"Growers have proceeded a step further, cultivating vegetables on supermarket rooftops.",cn:"农民们更进一步，直接在超市屋顶种蔬菜。"},
{en:"Produce harvested overhead travels metres rather than kilometres, trimming both transport costs and emissions.",cn:"在楼上种出的蔬菜只需运输几米而非几十公里，既省运费又减排放。"}],
questions:[
{q:"When is the urban heat island effect strongest?",opts:["On winter mornings.","On summer nights.","At noon in autumn.","On rainy afternoons."],a:1,exp:"细节题。定位 it is strongest on summer nights，对应 B。"},
{q:"What did the Singapore study find about green roofs?",opts:["They cost more than they save.","They cooled rooms below by up to four degrees.","They doubled the value of buildings.","They attracted more insects than expected."],a:1,exp:"细节题。定位 rooms below green roofs stayed up to four degrees cooler，对应 B。"},
{q:"What advantage does rooftop farming bring to supermarkets?",opts:["Lower transport costs and emissions.","Higher rents for the rooftops.","Longer opening hours.","Fresher customers."],a:0,exp:"细节题。定位 cutting transport costs and emissions，对应 A。"}]},
{id:"l1",exam:"cet6",type:"lecture",title:"Lecture One · 记忆的抽取效应",sentences:[
{en:"Good afternoon. Today's lecture concerns one of the most robust findings in the science of learning: the testing effect.",cn:"下午好。今天我要讲学习科学中最可靠的发现之一：测试效应。"},
{en:"Intuition insists that material is mastered by being read again and again.",cn:"常识告诉我们，反复研读材料才能学得最好。"},
{en:"Yet a century of experimentation indicates otherwise: memory consolidates when we are made to retrieve information from memory itself.",cn:"然而一个世纪的实验给出了相反的结论：当我们努力从脑中提取信息时，记忆才会变得最牢固。"},
{en:"Psychologists call this retrieval practice — the act of remembering recast as training.",cn:"心理学家称之为提取练习，即把回忆当作一种训练。"},
{en:"In a canonical experiment, two matched groups of students read an identical scientific passage.",cn:"在一个经典实验中，两组学生阅读同一篇科学短文。"},
{en:"One group reread the passage four times; the other read it once and then sat a test on it.",cn:"一组把文章读了四遍；另一组只读一遍，然后做了一次自测。"},
{en:"A week later, the testing group outperformed the rereaders by roughly fifty percent on recall.",cn:"一周后，自测组记住的内容比重读组多出大约百分之五十。"},
{en:"Why does retrieval work so well? Picture memory as a footpath across dense forest.",cn:"为什么提取信息如此有效？把记忆想象成林间的一条小路。"},
{en:"Walking the path again tramples it clear; rereading amounts to standing at the treeline consulting the map.",cn:"再走一遍小路会让它更清晰；而重读就像站在边上看着地图。"},
{en:"Retrieval also exposes the gaps that rereading conceals, since recognising a fact is not the same as producing one.",cn:"提取还能暴露重读所掩盖的漏洞，因为认出一个知识点并不等于能把它说出来。"},
{en:"How, then, should students apply this? Convert every chapter into questions and answer them from memory first.",cn:"那么学生该怎么用？把每一章都变成问题，先凭记忆作答。"},
{en:"Consult the text only afterwards, and space the attempts across days rather than hours.",cn:"之后再查书核对，并且把练习分散到几天里进行，而不是集中在几小时。"},
{en:"Painful as it feels, the struggle to recall is precisely the moment the memory gets stronger.",cn:"尽管过程难受，但努力回忆的那一刻，正是记忆变得牢固的时刻。"}],
questions:[
{q:"What does the speaker say about the testing effect?",opts:["It is a newly discovered phenomenon.","It is one of the most reliable findings in learning science.","It works only for science courses.","It has been questioned for a century."],a:1,exp:"细节题。定位 one of the most reliable findings in learning science，对应 B。"},
{q:"What happened a week later in the classic experiment?",opts:["The rereading group scored fifty percent higher.","Both groups performed equally well.","The testing group remembered about fifty percent more.","Neither group remembered the text."],a:2,exp:"细节题。定位 the testing group remembered about fifty percent more，对应 C。"},
{q:"What does the forest-path analogy illustrate?",opts:["Rereading strengthens memory like walking a path.","Recognizing facts equals producing them.","Retrieval makes the memory path clearer.","Maps are useless in learning."],a:2,exp:"推断题。把记忆比作小路，再走一遍（提取）使路更清晰，重读只是看地图，对应 C。"},
{q:"What does the speaker recommend students do?",opts:["Read each chapter at least four times.","Turn chapters into questions and answer from memory first.","Test themselves immediately after reading.","Study for hours without breaks."],a:1,exp:"细节题。定位 Turn every chapter into questions, and answer them from memory first，对应 B。C 缺少从记忆作答的关键环节。"}]},
{id:"l2",exam:"cet6",type:"lecture",title:"Lecture Two · 定价的心理学",sentences:[
{en:"Welcome back to the economics lecture series. Today we turn to the psychology of pricing.",cn:"欢迎回到经济学系列讲座。今天的主题是定价心理学。"},
{en:"Classical theory presumes that buyers weigh prices rationally and select the least expensive option that satisfies their needs.",cn:"经典理论假设买方理性比价，选择满足需求的最便宜选项。"},
{en:"Actual purchasers seldom behave so, and sellers are keenly aware of it.",cn:"现实中的买方很少如此行事，而卖方深谙此道。"},
{en:"Consider the ubiquitous three-tier menu: a basic plan, a standard plan and a premium plan.",cn:"以常见的三档菜单为例：基础版、标准版和尊享版。"},
{en:"Most customers shun both extremes and settle on the middle option.",cn:"多数顾客会避开两个极端，选择中间档。"},
{en:"Firms understand this; hence the premium tier frequently exists chiefly to lend the middle one an air of reasonableness.",cn:"企业深谙此理，因此设置尊享档往往主要是为了让中间档显得合情合理。"},

{en:"Experiments indicate that the one-cent reduction measurably lifts sales, because nine-something registers as meaningfully cheaper than ten.",cn:"实验表明，这一美分的降幅能显著提升销量，因为九点几美元在心理上远比十美元便宜。"},
{en:"Retailers also deploy anchor prices: a jacket first displayed at two hundred dollars appears a bargain at one hundred twenty.",cn:"商店还会用锚定价：先标价两百美元的夹克，一百二十美元时就像捡了便宜。"},
